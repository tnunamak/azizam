services:
  gateway:
    build: .
    # Sweep request scratch under a lock that survives exec into the gateway (REQUEST_RETENTION.md 5.1).
    command: ["python3", "-m", "gateway.private_tmp", "exec", "python3", "-m", "uvicorn", "proxy:app", "--host", "0.0.0.0", "--port", "5000", "--log-level", "warning", "--no-proxy-headers"]
    ports:
      - "127.0.0.1:${AZIZAM_PORT-5000}:5000"
    env_file:
      - path: .env
        required: false
    environment:
      AZIZAM_LITELLM_COMPOSE_PROFILE: "true"
      AZIZAM_CONFIG_PATH: /app/first-run.yml
      # The loopback-published port reaches the container from this exact host
      # bridge address. This permits setup, not anonymous runtime access.
      AZIZAM_SETUP_ALLOWED_CIDRS: ${AZIZAM_DOCKER_GATEWAY-172.30.251.1}/32
      AZIZAM_LITELLM_BASE_URL: ${AZIZAM_LITELLM_BASE_URL-http://litellm:4000}
      AZIZAM_LITELLM_API_KEY: ${AZIZAM_LITELLM_API_KEY-sk-local-litellm}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - gateway-data:/app/data
      - gateway-cache:/app/cache
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  litellm:
    image: ghcr.io/berriai/litellm:1.86.2@sha256:cae1ac3492d6d0bea69c26f4485381624e073eb753f3534ae7703a4204a4ce6b
    entrypoint:
      - /bin/sh
      - -lc
      - |
        pid="";
        last="";
        trap 'if [ -n "$$pid" ]; then kill "$$pid" 2>/dev/null || true; fi; exit 0' TERM INT EXIT;
        while true; do
          while [ ! -s /app/data/litellm.config.yaml ]; do sleep 1; done;
          next="$$(sha256sum /app/data/litellm.config.yaml | awk '{print $$1}')";
          if [ "$$next" != "$$last" ] || ! kill -0 "$${pid:-0}" 2>/dev/null; then
            if [ -n "$$pid" ]; then kill "$$pid" 2>/dev/null || true; wait "$$pid" 2>/dev/null || true; fi;
            litellm --config /app/data/litellm.config.yaml --host 0.0.0.0 --port 4000 & pid="$$!";
            last="$$next";
          fi;
          sleep 2;
        done
    environment:
      LITELLM_MASTER_KEY: ${AZIZAM_LITELLM_API_KEY-sk-local-litellm}
      LITELLM_LOG: CRITICAL
      LITELLM_MODE: PRODUCTION
      DISABLE_ADMIN_UI: "true"
      NO_DOCS: "true"
      NO_REDOC: "true"
    volumes:
      - gateway-data:/app/data
    restart: unless-stopped

volumes:
  gateway-data:
  gateway-cache:

networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: ${AZIZAM_DOCKER_SUBNET-172.30.251.0/24}
          gateway: ${AZIZAM_DOCKER_GATEWAY-172.30.251.1}
