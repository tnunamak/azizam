services:
  gateway:
    build: .
    ports:
      - "${OPENAI_PROXY_PORT:-5000}:5000"
    env_file:
      - .env
    volumes:
      - gateway-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  gateway-data:
