schema_version: 1
min_gateway_version: "0.1"
version: "0.1.0"
id: video.generate.ltx-2.5-long
intent: video.generate
display_name: LTX 2.5 Long
description: Minimal video.generate contract bound to the LTX 2.5 long-form (chunked, 2-50 s) ComfyUI workflow. Replaces the retired LTX 2.3 long workflow.
source: local
trusted: true
inputs:
  prompt:
    type: string
  negative_prompt:
    type: string
  width:
    type: integer
    minimum: 64
    maximum: 1280
  height:
    type: integer
    minimum: 64
    maximum: 720
  frame_rate:
    type: number
    minimum: 1
    maximum: 60
  seed:
    type: integer
    minimum: 0
  image_strength:
    type: number
    minimum: 0
    maximum: 1
outputs:
  video:
    media_type: video/mp4
bindings:
  comfyui:
    workflow: workflows/videos/video-ltx-2.5-long.json
    map:
      prompt:
        - node: "1621"
          input: text
      negative_prompt:
        - node: "1626"
          input: text
      width:
        - node: "1606"
          input: value
      height:
        - node: "1591"
          input: value
      frame_rate:
        - node: "1586"
          input: value
      seed:
        - node: "1527"
          input: value
      image_strength:
        - node: "1722"
          input: value
requires:
  models:
    - role: diffusion_model
      path: diffusion_models/ltx-2.5-22b-distilled-transformer-comfy-int8-convrot.safetensors
    - role: text_encoder
      path: text_encoders/gemma4-12b-with-proj-ltx-2.5-comfy-int8-convrot.safetensors
    - role: vae
      path: vae/ltx-2.5-video-vae-bf16.safetensors
    - role: vae
      path: vae/ltx-2.5-audio-vae-bf16.safetensors
