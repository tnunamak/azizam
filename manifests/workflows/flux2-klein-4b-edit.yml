schema_version: 1
min_gateway_version: "0.1"
version: "0.3.0"
id: image.edit.flux2-klein-4b
intent: image.edit
display_name: Flux2 Klein 4B Edit
purpose: Edit an image from an instruction
description: Portable image edit contract bound to the existing ComfyUI workflow.
source: local
trusted: true
inputs:
  prompt:
    type: string
    required: true
  source_image:
    type: asset
    required: true
  mask:
    type: asset
    description: Optional OpenAI image-edit mask. Transparent alpha edits and opaque alpha preserves; grayscale white edits and black preserves. The current Flux2 edit workflow has no native inpaint node, so the gateway applies this as a post-composite preservation mask unless a mask-bound workflow is selected.
  width:
    type: integer
    minimum: 64
    maximum: 2048
  height:
    type: integer
    minimum: 64
    maximum: 2048
  steps:
    type: integer
    minimum: 1
    maximum: 100
  guidance:
    type: number
    minimum: 0
    maximum: 20
  denoise:
    type: number
    minimum: 0
    maximum: 1
    default: 1
    description: Amount of denoising applied by truncating the Flux2 sigma schedule. Lower values preserve more input-image structure.
outputs:
  image:
    media_type: image/png
bindings:
  comfyui:
    workflow: workflows/images/flux2-klein-4b-edit.json
    map:
      prompt:
        - node: "6"
          input: text
      source_image:
        - node: "10"
          input: image
      width:
        - node: "48"
          input: width
        - node: "47"
          input: width
      height:
        - node: "48"
          input: height
        - node: "47"
          input: height
      steps:
        - node: "48"
          input: steps
      guidance:
        - node: "26"
          input: guidance
      denoise:
        - node: "49"
          input: denoise
