schema_version: 2
min_gateway_version: "0.1"
version: "0.1.0"
id: audio.generate.ace-step-1.5-xl-turbo
intent: audio.generate
capability: music
display_name: ACE-Step 1.5 XL Turbo
purpose: Songs and instrumentals from a prompt
prompt_hint: Describe the music you want
description: Songs and instrumentals from a prompt
technical_description: Portable audio.generate contract bound to the ACE-Step 1.5 XL Turbo ComfyUI workflow.
inputs:
  tags:
    label: music style
    help: Describe the genre, mood and instruments.
    type: string
  lyrics:
    label: lyrics
    help: Enter the words to sing.
    type: string
  duration:
    label: length
    help: Length in seconds.
    type: number
    minimum: 1
    maximum: 300
  seed:
    label: variation number
    help: Reuse this number and the same settings for a similar result.
    type: integer
    minimum: 0
    generate:
      generator: random_integer
      minimum: 0
      maximum: 4294967295
  bpm:
    label: beats per minute
    help: Set the tempo.
    type: integer
    minimum: 0
    maximum: 300
  timesignature:
    label: time signature
    type: string
    enum: ["2", "3", "4", "6"]
  language:
    label: language
    type: string
    enum: ["ar", "az", "bg", "bn", "ca", "cs", "da", "de", "el", "en", "es", "fa", "fi", "fr", "he", "hi", "hr", "ht", "hu", "id", "is", "it", "ja", "ko", "la", "lt", "ms", "ne", "nl", "no", "pa", "pl", "pt", "ro", "ru", "sa", "sk", "sr", "sv", "sw", "ta", "te", "th", "tl", "tr", "uk", "ur", "vi", "yue", "zh", "unknown"]
  keyscale:
    label: musical key
    type: string
    enum: ["C major", "C# major", "Db major", "D major", "D# major", "Eb major", "E major", "F major", "F# major", "Gb major", "G major", "G# major", "Ab major", "A major", "A# major", "Bb major", "B major", "C minor", "C# minor", "Db minor", "D minor", "D# minor", "Eb minor", "E minor", "F minor", "F# minor", "Gb minor", "G minor", "G# minor", "Ab minor", "A minor", "A# minor", "Bb minor", "B minor"]
  cfg_scale:
    label: planning guidance
    type: number
    minimum: 0
    maximum: 20
  temperature:
    label: variety
    type: number
    minimum: 0
    maximum: 2
  top_p:
    label: choice range
    type: number
    minimum: 0
    maximum: 1
  top_k:
    label: choice limit
    type: integer
    minimum: 0
    maximum: 1000
  min_p:
    label: minimum choice likelihood
    type: number
    minimum: 0
    maximum: 1
  steps:
    label: steps
    help: More steps take longer.
    type: integer
    minimum: 1
    maximum: 200
  cfg:
    label: prompt guidance
    type: number
    minimum: 0
    maximum: 20
  sampler:
    label: generation method
    type: string
  scheduler:
    label: step timing
    type: string
outputs:
  audio:
    media_type: audio/flac
bindings:
  comfyui:
    workflow: workflows/audio/ace-step-1.5-xl-turbo.json
    selectors:
      audio: {node: '38', key: audio, from: output_dir, decode: none, take: first}
    map:
      tags:
        - node: "5"
          input: tags
      lyrics:
        - node: "5"
          input: lyrics
      duration:
        - node: "10"
          input: seconds
        - node: "5"
          input: duration
      seed:
        - node: "20"
          input: seed
      bpm:
        - node: "5"
          input: bpm
      timesignature:
        - node: "5"
          input: timesignature
      language:
        - node: "5"
          input: language
      keyscale:
        - node: "5"
          input: keyscale
      cfg_scale:
        - node: "5"
          input: cfg_scale
      temperature:
        - node: "5"
          input: temperature
      top_p:
        - node: "5"
          input: top_p
      top_k:
        - node: "5"
          input: top_k
      min_p:
        - node: "5"
          input: min_p
      steps:
        - node: "20"
          input: steps
      cfg:
        - node: "20"
          input: cfg
      sampler:
        - node: "20"
          input: sampler_name
      scheduler:
        - node: "20"
          input: scheduler
