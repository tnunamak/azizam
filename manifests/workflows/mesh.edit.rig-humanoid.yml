schema_version: 2
min_gateway_version: "0.1"
version: "0.1.0"
id: mesh.edit.rig-humanoid
intent: mesh.edit
capability: mesh
display_name: Rig a humanoid 3D model
purpose: Add a humanoid skeleton to a model
description: Fits a humanoid skeleton to a 3D model by its bounds, adds automatic skin weights, and returns the rigged model as a binary glTF.
technical_description: Fixed 3D stage bound to the local3d-stages service over one multipart POST. The service returns raw GLB bytes.
summary: Send a humanoid model; receive the same model with a humanoid skeleton (model/gltf-binary).
inputs:
  mesh:
    label: model
    help: The 3D model to work on, as a binary glTF (.glb) file.
    type: asset
    accepts:
      - model/gltf-binary
    required: true
outputs:
  mesh:
    media_type: model/gltf-binary
bindings:
  http-multipart:
    map:
      mesh: mesh
    service: local3d-stages
    path: /rigify
