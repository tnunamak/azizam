schema_version: 2
min_gateway_version: '0.1'
version: 0.1.0
id: video.generate.minimax-h3-i2v
license: "MiniMax H3 Community License: not for use in the US, EU, UK or South Korea"
intent: video.generate
capability: video
annotations:
  azizam.dev/backfill:
    capability: intent-prefix rule, schema 1 to 2
display_name: MiniMax H3 I2V
purpose: Animate an image with stereo sound
prompt_hint: Describe how the picture should move
description: Make a video with stereo sound from a starting picture and a description.
typical_seconds: 135
video:
  roles:
    width: width
    height: height
    length: length
    frame_rate: frame_rate
    image: image
  size: {default: 960x544, max: 1344x768, multiple: 32}
  length: {min_seconds: 2, max_seconds: 10}
  grid: {fps: 24, step: 17, offset: 5}
  variants:
    long: video.generate.minimax-h3-long
  requires: [image]
inputs:
  prompt:
    label: What to make
    help: Describe the scene, action, and mood.
    type: string
    required: true
  seed:
    label: Variation number
    help: Use the same number to repeat a variation with the same settings.
    type: integer
    minimum: 0
    generate:
      generator: random_integer
      minimum: 0
      maximum: 4294967295
  steps:
    label: Refinement steps
    help: More steps take longer.
    type: integer
    minimum: 1
    maximum: 50
    default: 8
  image:
    label: a starting picture
    help: The picture the video starts from.
    type: asset
    accepts:
      - image/*
    required: true
  width:
    label: Width
    help: Video width in pixels.
    type: integer
    minimum: 64
    maximum: 1344
  height:
    label: Height
    help: Video height in pixels.
    type: integer
    minimum: 64
    maximum: 768
  length:
    label: Length in frames
    help: Frame count on the 17N+5 grid.
    type: integer
    step: 17
    offset: 5
    minimum: 22
    maximum: 362
  frame_rate:
    label: Frames per second
    help: How many frames the video shows each second.
    type: integer
    minimum: 1
    maximum: 50
    default: 24
outputs:
  video:
    media_type: video/mp4
bindings:
  comfyui:
    workflow: workflows/videos/video-minimax-h3-i2v.json
    selectors:
      video: {node: '18', key: images, from: output_dir, decode: none, take: first}
    map:
      prompt:
        - node: '9'
          input: prompt
      seed:
        - node: '10'
          input: noise_seed
      steps:
        - node: '12'
          input: steps
      image:
        - node: '20'
          input: image
      width:
        - node: '6'
          input: value
      height:
        - node: '7'
          input: value
      frame_rate:
        - node: '17'
          input: fps
      length:
        - node: '8'
          input: value
    requires:
      models:
        - role: diffusion_model
          path: diffusion_models/minimax_h3_fl2va_pruned_int8_convrot.safetensors
        - role: text_encoder
          path: text_encoders/qwen3vl_32b_minimax_h3_nvfp4_awq.safetensors
        - role: vae
          path: vae/minimax_h3_video_vae_int8_convrot.safetensors
        - role: vae
          path: vae/minimax_h3_audio_vae_fp32.safetensors
        - role: lora
          path: loras/minimax_h3_fl2v_turbo_8step_v1.0_comfyui_bf16.safetensors
