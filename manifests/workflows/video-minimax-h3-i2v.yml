schema_version: 1
min_gateway_version: '0.1'
version: 0.1.0
id: video.generate.minimax-h3-i2v
intent: video.generate
display_name: MiniMax H3 I2V
description: 'MiniMax H3 FL2VA first-frame image-to-video with native stereo audio. Selected automatically
  when /v1/videos gets input_reference with model minimax-h3, or by model id. Same size and length rules
  as minimax-h3. About 185 s for 5 s at 960x544. LICENSE: the MiniMax H3 Community License excludes use
  in the US, EU, UK and South Korea.'
source: local
trusted: true
inputs:
  prompt:
    type: string
    required: true
  seed:
    type: integer
    minimum: 0
  steps:
    type: integer
    minimum: 1
    maximum: 50
    default: 8
  image:
    type: asset
    required: true
outputs:
  video:
    media_type: video/mp4
bindings:
  comfyui:
    workflow: workflows/videos/video-minimax-h3-i2v.json
    map:
      prompt:
      - node: '9'
        input: prompt
      seed:
      - node: '10'
        input: noise_seed
      steps:
      - node: '12'
        input: steps
      image:
      - node: '20'
        input: image
requires:
  models:
  - role: diffusion_model
    path: diffusion_models/minimax_h3_fl2va_pruned_int8_convrot.safetensors
  - role: text_encoder
    path: text_encoders/qwen3vl_32b_minimax_h3_nvfp4_awq.safetensors
  - role: vae
    path: vae/minimax_h3_video_vae_int8_convrot.safetensors
  - role: vae
    path: vae/minimax_h3_audio_vae_fp32.safetensors
  - role: lora
    path: loras/minimax_h3_fl2v_turbo_8step_v1.0_comfyui_bf16.safetensors
