schema_version: 2
min_gateway_version: "0.1"
version: "0.1.0"
id: audio.generate.tangoflux
intent: audio.generate
capability: sfx
display_name: TangoFlux
purpose: Create a sound effect from text
prompt_hint: Describe the sound you want
description: Create a sound effect from a text prompt.
typical_seconds: 4
status: superseded
superseded_by: audio.generate.sa3-small-sfx
inputs:
  prompt:
    type: string
    required: true
  duration:
    type: number
    minimum: 1
    maximum: 30
  steps:
    type: integer
    minimum: 1
    maximum: 200
  guidance:
    type: number
    minimum: 0
    maximum: 20
  seed:
    type: integer
    minimum: 0
    generate:
      generator: random_integer
      minimum: 0
      maximum: 4294967295
  batch_size:
    type: integer
    minimum: 1
    maximum: 4
outputs:
  audio:
    media_type: audio/wav
bindings:
  comfyui:
    workflow: workflows/audio/tangoflux.json
    selectors:
      audio: {node: '3', key: audios, from: output_dir, decode: none, take: first}
    map:
      prompt:
        - node: "2"
          input: prompt
      duration:
        - node: "2"
          input: duration
      steps:
        - node: "2"
          input: steps
      guidance:
        - node: "2"
          input: guidance_scale
      seed:
        - node: "2"
          input: seed
      batch_size:
        - node: "2"
          input: batch_size
