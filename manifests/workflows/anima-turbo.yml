schema_version: 2
min_gateway_version: "0.1"
version: "0.1.0"
id: image.generate.anima-turbo
intent: image.generate
capability: image
annotations:
  azizam.dev/backfill:
    capability: intent-prefix rule, schema 1 to 2
display_name: Anima Turbo (anime)
purpose: Anime-style images from a prompt
prompt_hint: Describe the picture you want
description: Make an anime-style picture from a description. It only shows adults.
typical_seconds: 4
inputs:
  prompt:
    label: description
    help: Describe what you want to make.
    type: string
    required: true
  width:
    label: width
    help: Picture width in pixels.
    type: integer
    minimum: 64
    maximum: 2048
    default: 1024
  height:
    label: height
    help: Picture height in pixels.
    type: integer
    minimum: 64
    maximum: 2048
    default: 1024
  steps:
    label: steps
    help: More steps add detail but take longer. 8 to 12 works well for this model.
    type: integer
    minimum: 1
    maximum: 20
    default: 10
  sampler:
    label: Generation method
    help: The method the model uses to build the result. Keep the default unless you are comparing methods.
    choices_from: {node_type: KSampler, input: sampler_name}
    type: string
    enum: [euler, euler_cfg_pp, euler_ancestral, euler_ancestral_cfg_pp, heun, heunpp2, exp_heun_2_x0, exp_heun_2_x0_sde, dpm_2, dpm_2_ancestral, lms, dpm_fast, dpm_adaptive, dpmpp_2s_ancestral, dpmpp_2s_ancestral_cfg_pp, dpmpp_sde, dpmpp_sde_gpu, dpmpp_2m, dpmpp_2m_cfg_pp, dpmpp_2m_sde, dpmpp_2m_sde_gpu, dpmpp_2m_sde_heun, dpmpp_2m_sde_heun_gpu, dpmpp_3m_sde, dpmpp_3m_sde_gpu, ddpm, lcm, ipndm, ipndm_v, deis, cfgpp_ud10_ab, res_multistep, res_multistep_cfg_pp, res_multistep_ancestral, res_multistep_ancestral_cfg_pp, gradient_estimation, gradient_estimation_cfg_pp, er_sde, seeds_2, seeds_3, sa_solver, sa_solver_pece, ddim, uni_pc, uni_pc_bh2]
    default: euler
  scheduler:
    label: Step timing
    help: How the refinement steps are spaced. Keep the default unless you are comparing results.
    choices_from: {node_type: KSampler, input: scheduler}
    type: string
    enum: [simple, sgm_uniform, karras, exponential, ddim_uniform, beta, normal, linear_quadratic, kl_optimal]
    default: simple
  seed:
    label: variation number
    help: Reuse this number and the same settings for a similar result.
    type: integer
    minimum: 0
    generate:
      generator: random_integer
      minimum: 0
      maximum: 4294967295
  batch_size:
    label: number of pictures
    help: How many pictures to make at once.
    type: integer
    minimum: 1
    maximum: 8
    default: 1
outputs:
  image:
    media_type: image/png
bindings:
  comfyui:
    workflow: workflows/images/anima-turbo.json
    selectors:
      image: {node: '9', key: images, from: output_dir, decode: none, take: all}
    map:
      prompt:
        - node: "4"
          input: text
      sampler:
        - node: "7"
          input: sampler_name
      scheduler:
        - node: "7"
          input: scheduler
      width:
        - node: "6"
          input: width
      height:
        - node: "6"
          input: height
      steps:
        - node: "7"
          input: steps
      seed:
        - node: "7"
          input: seed
      batch_size:
        - node: "6"
          input: batch_size
    requires:
      custom_nodes:
        - RMBG
      models:
        - role: diffusion_model
          path: diffusion_models/anima-turbo-v1.1.safetensors
        - role: text_encoder
          path: text_encoders/qwen_3_06b_base.safetensors
        - role: vae
          path: vae/qwen_image_vae.safetensors
source_url: https://huggingface.co/circlestone-labs/Anima
