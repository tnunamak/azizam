schema_version: 1
min_gateway_version: "0.1"
version: "0.1.0"
id: image.generate.anima-turbo
intent: image.generate
display_name: Anima Turbo (anime)
description: Local anime T2I workflow bound to Anima Turbo v1.1 (2B). Fast (about 3.5 s warm at 1024x1024 on a 3090). Accepts booru tags plus prose. CFG fixed at 1.0. Only depict adults.
source: local
trusted: true
typical_seconds: 4
inputs:
  prompt:
    type: string
    required: true
  width:
    type: integer
    minimum: 64
    maximum: 2048
    default: 1024
  height:
    type: integer
    minimum: 64
    maximum: 2048
    default: 1024
  steps:
    type: integer
    minimum: 1
    maximum: 20
    default: 10
    description: Turbo model; 8-12 steps is the sweet spot.
  seed:
    type: integer
    minimum: 0
  batch_size:
    type: integer
    minimum: 1
    maximum: 8
    default: 1
outputs:
  image:
    media_type: image/png
bindings:
  comfyui:
    workflow: workflows/images/anima-turbo.json
    map:
      prompt:
        - node: "4"
          input: text
      width:
        - node: "6"
          input: width
      height:
        - node: "6"
          input: height
      steps:
        - node: "7"
          input: steps
      seed:
        - node: "7"
          input: seed
      batch_size:
        - node: "6"
          input: batch_size
requires:
  custom_nodes:
    - RMBG
  models:
    - role: diffusion_model
      path: diffusion_models/anima-turbo-v1.1.safetensors
    - role: text_encoder
      path: text_encoders/qwen_3_06b_base.safetensors
    - role: vae
      path: vae/qwen_image_vae.safetensors
