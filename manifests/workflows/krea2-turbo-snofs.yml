schema_version: 1
min_gateway_version: "0.1"
version: "0.1.0"
id: image.generate.krea2-turbo-snofs
intent: image.generate
display_name: Krea 2 Turbo + SNOFS (uncensored)
purpose: Uncensored photoreal images from a prompt
description: Local T2I workflow for uncensored output. Krea 2 Turbo (int8_convrot) plus the SNOFS v1.4 LoKr (Ashen3) loaded with stock LoraLoaderModelOnly at strength 1.0. Bake-off 2026-10-03 showed no visible SFW quality loss and explicit output where stock Krea 2 Turbo returns clothed images. Write natural-language prompts that say 'photograph' (not 'photorealistic'). CFG-distilled turbo model, CFG fixed at 1.0. Only depict adults.
source: local
trusted: true
typical_seconds: 9
inputs:
  prompt:
    type: string
    required: true
  width:
    type: integer
    minimum: 64
    maximum: 2048
    default: 1024
  height:
    type: integer
    minimum: 64
    maximum: 2048
    default: 1024
  steps:
    type: integer
    minimum: 1
    maximum: 20
    default: 8
    description: Turbo model; 8-12 steps is the community sweet spot. Values above ~16 show diminishing returns.
  seed:
    type: integer
    minimum: 0
  lora_strength:
    type: number
    minimum: 0
    maximum: 1.5
    default: 1.0
    description: SNOFS LoKr strength. 1.0 is the author-recommended value; 0.6 was less reliable in the bake-off.
  batch_size:
    type: integer
    minimum: 1
    maximum: 8
    default: 1
outputs:
  image:
    media_type: image/png
bindings:
  comfyui:
    workflow: workflows/images/krea2-turbo-snofs.json
    map:
      prompt:
        - node: "4"
          input: text
      width:
        - node: "6"
          input: width
      height:
        - node: "6"
          input: height
      steps:
        - node: "7"
          input: steps
      seed:
        - node: "7"
          input: seed
      lora_strength:
        - node: "11"
          input: strength_model
      batch_size:
        - node: "6"
          input: batch_size
requires:
  custom_nodes:
    - RMBG
  models:
    - role: diffusion_model
      path: diffusion_models/krea2_turbo_int8_convrot.safetensors
    - role: text_encoder
      path: text_encoders/qwen3vl_4b_fp8_scaled.safetensors
    - role: lora
      path: loras/snofs_krea_v1_4.safetensors
    - role: vae
      path: vae/qwen_image_vae.safetensors
