schema_version: 1
min_gateway_version: "0.1"
version: "0.1.0"
id: video.generate.wan-2.2-ti2v-5b-q8
intent: video.generate
display_name: WAN 2.2 TI2V 5B Q8
purpose: Short videos from a prompt or image
description: Make a short video from a description or picture.
source: local
trusted: true
inputs:
  prompt:
    label: What to make
    help: Describe the scene, action, and mood.
    type: string
  negative_prompt:
    label: What to avoid
    help: Describe anything you want left out.
    type: string
  width:
    label: Width
    help: Video width in pixels.
    type: integer
    minimum: 64
    maximum: 1280
  height:
    label: Height
    help: Video height in pixels.
    type: integer
    minimum: 64
    maximum: 704
  length:
    label: Frame count
    help: Number of frames in the video.
    type: integer
    minimum: 1
  frame_rate:
    label: Frames per second
    help: How many frames the video shows each second.
    type: number
    minimum: 1
    maximum: 60
  seed:
    label: Variation number
    help: Use the same number to repeat a variation with the same settings.
    type: integer
    minimum: 0
  image_strength:
    label: Picture influence
    help: Adjust how strongly the starting picture shapes the video.
    type: number
    minimum: 0
    maximum: 1
  steps:
    label: Refinement steps
    help: More steps take longer.
    type: integer
    minimum: 1
    maximum: 100
    default: 20
  cfg:
    label: Prompt influence
    help: Adjust how closely the video follows your description.
    type: number
    minimum: 0
    maximum: 20
    default: 5
outputs:
  video:
    media_type: video/mp4
bindings:
  comfyui:
    workflow: workflows/video-wan-2.2-ti2v-5b-q8.json
    map:
      prompt:
        - node: "5"
          input: text
      negative_prompt:
        - node: "6"
          input: text
      width:
        - node: "9005"
          input: value
      height:
        - node: "9006"
          input: value
      length:
        - node: "10"
          input: value
      frame_rate:
        - node: "11"
          input: value
        - node: "12"
          input: value
      seed:
        - node: "16"
          input: noise_seed
      image_strength:
        - node: "9003"
          input: value
      steps:
        - node: "22"
          input: steps
      cfg:
        - node: "18"
          input: cfg
