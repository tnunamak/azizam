schema_version: 2
min_gateway_version: "0.1"
version: "0.1.1"
id: image.generate.sdxl-seamless-tile
intent: image.generate
capability: image
annotations:
  azizam.dev/backfill:
    capability: intent-prefix rule, schema 1 to 2
display_name: SDXL Seamless Tile
task: texture-tile
purpose: Seamless textures in the SDXL style
prompt_hint: Describe the picture you want
description: Portable image generation contract for SDXL texture tiles with manifest-backed seamless postprocessing controls.
inputs:
  prompt:
    label: What to make
    help: Describe the picture you want.
    type: string
    required: true
  width:
    label: Width
    help: Picture width in pixels.
    type: integer
    minimum: 64
    maximum: 2048
  height:
    label: Height
    help: Picture height in pixels.
    type: integer
    minimum: 64
    maximum: 2048
  steps:
    label: Refinement steps
    help: More steps add detail but take longer.
    type: integer
    minimum: 1
    maximum: 100
  guidance:
    label: Prompt strength
    help: Higher follows your words more closely.
    type: number
    minimum: 0
    maximum: 20
  seed:
    label: Variation number
    help: Use the same number to repeat a variation with the same settings.
    type: integer
    minimum: 0
    generate:
      generator: random_integer
      minimum: 0
      maximum: 4294967295
  batch_size:
    label: Number of pictures
    help: How many pictures to make at once.
    type: integer
    minimum: 1
    maximum: 8
  negative_prompt:
    label: What to avoid
    help: Describe anything you want left out.
    type: string
  sampler:
    label: Generation method
    help: The method the model uses to build the result. Keep the default unless you are comparing methods.
    choices_from: {node_type: KSampler, input: sampler_name}
    type: string
    enum:
      - euler
      - euler_ancestral
      - dpmpp_2m
      - dpmpp_2m_sde
      - dpmpp_sde
      - uni_pc
  scheduler:
    label: Step timing
    help: How the refinement steps are spaced. Keep the default unless you are comparing results.
    choices_from: {node_type: KSampler, input: scheduler}
    type: string
    enum:
      - karras
      - normal
      - simple
      - sgm_uniform
      - beta
  seam_blending:
    label: Seam blending
    help: Sets the blending value used when making the picture seamless.
    type: number
    minimum: 0
    maximum: 0.5
outputs:
  image:
    media_type: image/png
bindings:
  comfyui:
    workflow: workflows/images/sdxl-seamless-tile.json
    selectors:
      image: {node: '9', key: images, from: output_dir, decode: none, take: all}
    map:
      prompt:
        - node: "6"
          input: text
      width:
        - node: "27"
          input: width
        - node: "8"
          input: width
      height:
        - node: "27"
          input: height
        - node: "8"
          input: height
      steps:
        - node: "31"
          input: steps
      guidance:
        - node: "31"
          input: cfg
      seed:
        - node: "31"
          input: seed
      batch_size:
        - node: "27"
          input: batch_size
      negative_prompt:
        - node: "33"
          input: text
      sampler:
        - node: "31"
          input: sampler_name
      scheduler:
        - node: "31"
          input: scheduler
      seam_blending:
        - node: "45"
          input: blending
