schema_version: 1
min_gateway_version: "0.1"
version: "0.1.0"
id: video.generate.ltx-2.3-pure-distilled
intent: video.generate
display_name: LTX 2.3 Pure Distilled
description: Minimal video.generate contract bound to the LTX 2.3 pure distilled ComfyUI workflow.
source: local
trusted: true
inputs:
  prompt:
    type: string
  negative_prompt:
    type: string
  width:
    type: integer
    minimum: 64
    maximum: 1280
  height:
    type: integer
    minimum: 64
    maximum: 720
  length:
    type: integer
    minimum: 1
  frame_rate:
    type: number
    minimum: 1
    maximum: 60
  seed:
    type: integer
    minimum: 0
  image_strength:
    type: number
    minimum: 0
    maximum: 1
  steps:
    type: integer
    minimum: 1
    maximum: 100
    default: 20
  stage1_cfg:
    type: number
    minimum: 0
    maximum: 20
    default: 4
  stage2_cfg:
    type: number
    minimum: 0
    maximum: 20
    default: 1
outputs:
  video:
    media_type: video/mp4
bindings:
  comfyui:
    workflow: workflows/video-ltx-2.3-pure-distilled.json
    map:
      prompt:
        - node: "5"
          input: text
      negative_prompt:
        - node: "6"
          input: text
      width:
        - node: "9005"
          input: value
      height:
        - node: "9006"
          input: value
      length:
        - node: "10"
          input: value
      frame_rate:
        - node: "11"
          input: value
        - node: "12"
          input: value
      seed:
        - node: "16"
          input: noise_seed
        - node: "32"
          input: noise_seed
      image_strength:
        - node: "9003"
          input: value
      steps:
        - node: "22"
          input: steps
      stage1_cfg:
        - node: "18"
          input: cfg
      stage2_cfg:
        - node: "31"
          input: cfg
