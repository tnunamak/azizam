schema_version: 1
min_gateway_version: "0.1"
version: "0.1.0"
id: image.edit.qwen-image-2.1-edit-multiref
intent: image.edit
display_name: Qwen-Image 2.1 Multi-Reference Edit
purpose: Combine two reference images into one
description: Combine two pictures into one, following your description of how to blend them.
source: local
trusted: true
typical_seconds: 26
inputs:
  prompt:
    type: string
    required: true
    description: Reference each image explicitly, e.g. "<image1> ... <image2> ...".
  source_image:
    label: a main picture
    help: The picture you want to change.
    type: asset
    required: true
  reference_image_2:
    label: a second picture
    help: Another picture to take people, things or style from.
    type: asset
    required: true
  negative_prompt:
    type: string
    default: ""
  reference_resolution:
    type: integer
    minimum: 256
    maximum: 2048
    default: 1024
  steps:
    type: integer
    minimum: 1
    maximum: 60
    default: 25
  cfg:
    type: number
    minimum: 0
    maximum: 10
    default: 1.0
  seed:
    type: integer
    minimum: 0
outputs:
  image:
    media_type: image/png
bindings:
  comfyui:
    workflow: workflows/images/qwen-image-2.1-edit-multiref.json
    # The edit route supplies this asset from the second multipart image part.
    route_bound_inputs: [reference_image_2]
    map:
      prompt:
        - node: "6"
          input: text
      source_image:
        - node: "4"
          input: image
      reference_image_2:
        - node: "11"
          input: image
      negative_prompt:
        - node: "7"
          input: negative_prompt
      reference_resolution:
        - node: "7"
          input: resolution
      steps:
        - node: "8"
          input: steps
      cfg:
        - node: "8"
          input: cfg
      seed:
        - node: "8"
          input: seed
requires:
  custom_nodes:
    - RMBG
  models:
    - role: diffusion_model
      path: diffusion_models/qwen_image_2.1_int8_convrot.safetensors
    - role: text_encoder
      path: text_encoders/qwen3vl_8b_w4a8.safetensors
    - role: vae
      path: vae/texture_fix_vae_for_qwen_image_2.1_bf16.safetensors
