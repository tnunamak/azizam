schema_version: 1
min_gateway_version: "0.1"
version: "0.1.0"
id: audio.generate.ace-step-1.5-2b-base
intent: audio.generate
capability: music
display_name: ACE-Step 1.5 2B Base
purpose: Create a song from lyrics and tags
description: Portable audio.generate contract bound to the ACE-Step 1.5 2B Base ComfyUI workflow.
source: local
trusted: true
inputs:
  prompt:
    label: description
    help: Describe what you want to make.
    type: string
  tags:
    label: music style
    help: Describe the genre, mood and instruments.
    type: string
  lyrics:
    label: lyrics
    help: Enter the words to sing.
    type: string
  duration:
    label: length
    help: Length in seconds.
    type: number
    minimum: 1
    maximum: 300
  seed:
    label: variation number
    help: Reuse this number and the same settings for a similar result.
    type: integer
    minimum: 0
  bpm:
    label: beats per minute
    help: Set the tempo.
    type: integer
    minimum: 0
    maximum: 300
  timesignature:
    label: time signature
    type: string
  language:
    label: language
    type: string
  keyscale:
    label: musical key
    type: string
  cfg_scale:
    label: planning guidance
    type: number
    minimum: 0
    maximum: 20
  temperature:
    label: variety
    type: number
    minimum: 0
    maximum: 2
  top_p:
    label: choice range
    type: number
    minimum: 0
    maximum: 1
  top_k:
    label: choice limit
    type: integer
    minimum: 0
    maximum: 1000
  min_p:
    label: minimum choice likelihood
    type: number
    minimum: 0
    maximum: 1
  steps:
    label: steps
    help: More steps take longer.
    type: integer
    minimum: 1
    maximum: 200
  cfg:
    label: prompt guidance
    type: number
    minimum: 0
    maximum: 20
  sampler:
    label: generation method
    type: string
  scheduler:
    label: step timing
    type: string
  denoise:
    label: change strength
    type: number
    minimum: 0
    maximum: 1
outputs:
  audio:
    media_type: audio/wav
bindings:
  comfyui:
    workflow: workflows/audio/ace-step-1.5-2b-base.json
    map:
      prompt:
        - node: "5"
          input: tags
      tags:
        - node: "5"
          input: tags
      lyrics:
        - node: "5"
          input: lyrics
      duration:
        - node: "10"
          input: seconds
        - node: "5"
          input: duration
      seed:
        - node: "20"
          input: seed
      bpm:
        - node: "5"
          input: bpm
      timesignature:
        - node: "5"
          input: timesignature
      language:
        - node: "5"
          input: language
      keyscale:
        - node: "5"
          input: keyscale
      cfg_scale:
        - node: "5"
          input: cfg_scale
      temperature:
        - node: "5"
          input: temperature
      top_p:
        - node: "5"
          input: top_p
      top_k:
        - node: "5"
          input: top_k
      min_p:
        - node: "5"
          input: min_p
      steps:
        - node: "20"
          input: steps
      cfg:
        - node: "20"
          input: cfg
      sampler:
        - node: "20"
          input: sampler_name
      scheduler:
        - node: "20"
          input: scheduler
      denoise:
        - node: "20"
          input: denoise
