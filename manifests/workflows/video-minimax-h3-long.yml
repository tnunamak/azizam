schema_version: 1
min_gateway_version: "0.1"
version: "0.1.0"
id: video.generate.minimax-h3-long
intent: video.generate
display_name: MiniMax H3 Long
description: >-
  MiniMax H3 long video with native audio. The manifest binds the single-segment (10 s) reference
  graph; POST /v1/videos builds longer chains (shots, seconds past 10 s) and POST /v1/videos/extensions
  extends a video, both in code. Each added segment is pinned to the end of the video so far with the
  H3 Motion Context nodes. LICENSE: the MiniMax H3 Community License excludes use in the US, EU, UK and
  South Korea.
source: local
trusted: true
inputs:
  prompt:
    type: string
  width:
    type: integer
    minimum: 64
    maximum: 1344
  height:
    type: integer
    minimum: 64
    maximum: 768
  seed:
    type: integer
    minimum: 0
outputs:
  video:
    media_type: video/mp4
bindings:
  comfyui:
    workflow: workflows/videos/video-minimax-h3-long.json
    map:
      prompt:
        - node: s0_cond
          input: prompt
      width:
        - node: s0_cond
          input: width
      height:
        - node: s0_cond
          input: height
      seed:
        - node: s0_noise
          input: noise_seed
requires:
  models:
    - role: diffusion_model
      path: diffusion_models/minimax_h3_fl2va_pruned_int8_convrot.safetensors
    - role: text_encoder
      path: text_encoders/qwen3vl_32b_minimax_h3_nvfp4_awq.safetensors
    - role: vae
      path: vae/minimax_h3_video_vae_int8_convrot.safetensors
    - role: vae
      path: vae/minimax_h3_audio_vae_fp32.safetensors
    - role: lora
      path: loras/minimax_h3_fl2v_turbo_8step_v1.0_comfyui_bf16.safetensors
