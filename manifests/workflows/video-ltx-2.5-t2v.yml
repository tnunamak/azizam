schema_version: 2
min_gateway_version: '0.1'
version: 0.1.0
id: video.generate.ltx-2.5-t2v
license: "LTX-2.x Community License (commercial use at USD 10M or more annual revenue and competing services require a separate license; acceptable-use restrictions) with Apache-2.0"
intent: video.generate
capability: video
annotations:
  azizam.dev/backfill:
    capability: intent-prefix rule, schema 1 to 2
display_name: LTX 2.5
purpose: Video from a prompt or image
prompt_hint: Describe the clip you want
description: Make a video with sound from a description or picture.
technical_description: 'LTX-2.5 22B distilled two-stage text-to-video with synchronized audio (int8_convrot). Default video model. Request via POST /v1/videos: size is floored to multiples of 64 (max 1280x704; default 960x512), seconds 1-10 at 24 fps (frames are 8k+1). About 45 s warm for 5 s at 960x512; 1280x704 about 140 s. License: LTX-2.x Community License.'
typical_seconds: 49
video:
  roles:
    width: width
    height: height
    length: length
    frame_rate: frame_rate
  size: {default: 960x512, max: 1280x704, multiple: 64}
  length: {min_seconds: 1, max_seconds: 10}
  grid: {fps: 24, step: 8, offset: 1}
  variants:
    image: video.generate.ltx-2.5-i2v
    long: video.generate.ltx-2.5-long
inputs:
  prompt:
    label: What to make
    help: Describe the scene, action, and mood.
    type: string
    required: true
  negative_prompt:
    label: What to avoid
    help: Describe anything you want left out.
    type: string
  frame_rate:
    label: Frames per second
    help: How many frames the video shows each second.
    type: integer
    minimum: 1
    maximum: 50
    default: 24
  seed:
    label: Variation number
    help: Use the same number to repeat a variation with the same settings.
    type: integer
    minimum: 0
    generate:
      generator: random_integer
      minimum: 0
      maximum: 4294967295
  width:
    label: Width
    help: Video width in pixels.
    type: integer
    minimum: 64
    maximum: 1280
  height:
    label: Height
    help: Video height in pixels.
    type: integer
    minimum: 64
    maximum: 704
  length:
    label: Length in frames
    help: Frame count on the 8N+1 grid.
    type: integer
    step: 8
    offset: 1
    minimum: 9
    maximum: 241
outputs:
  video:
    media_type: video/mp4
bindings:
  comfyui:
    workflow: workflows/videos/video-ltx-2.5-t2v.json
    selectors:
      video: {node: '60', key: images, from: output_dir, decode: none, take: first}
    map:
      prompt:
        - node: '5'
          input: text
      negative_prompt:
        - node: '6'
          input: text
      frame_rate:
        - node: '23'
          input: value
        - node: '24'
          input: value
      seed:
        - node: '30'
          input: noise_seed
        - node: '31'
          input: noise_seed
      width:
        - node: '20'
          input: value
      height:
        - node: '21'
          input: value
      length:
        - node: '22'
          input: value
    requires:
      models:
        - role: diffusion_model
          path: diffusion_models/ltx-2.5-22b-distilled-transformer-comfy-int8-convrot.safetensors
        - role: text_encoder
          path: text_encoders/gemma4-12b-with-proj-ltx-2.5-comfy-int8-convrot.safetensors
        - role: vae
          path: vae/ltx-2.5-video-vae-bf16.safetensors
        - role: vae
          path: vae/ltx-2.5-audio-vae-bf16.safetensors
        - role: upscale_model
          path: latent_upscale_models/ltx-2.5-latent-spatial-upscaler-x2-bf16-1.0.safetensors
