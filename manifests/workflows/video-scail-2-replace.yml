schema_version: 1
min_gateway_version: "0.1"
version: "0.1.0"
id: video.edit.scail-2-replace
intent: video.edit
display_name: SCAIL-2 Character Replace
purpose: Put a reference character into a video
description: Replace a person in a video with a character from a picture, keeping the original motion and scene.
source: local
trusted: true
typical_seconds: 231
inputs:
  reference_image:
    label: a new character
    help: A picture of who should appear in the video.
    type: asset
    media_type: image/*
    required: true
  source_video:
    label: a video to change
    help: The video whose character is replaced.
    type: asset
    media_type: video/*
    required: true
  source_subject:
    label: Person to replace
    help: Describe the person to replace in the video.
    type: string
    default: person
  reference_subject:
    label: Character to use
    help: Describe the character to use from the picture.
    type: string
    default: person
  subject_index:
    label: Person number
    help: Choose a tracked person, counting from zero; zero selects the largest person.
    type: string
    default: "0"
  reference_fit:
    label: Match original size
    help: Resize and position the new character to match the person being replaced.
    type: boolean
    default: true
  source_point_x:
    label: Horizontal selection point
    help: Select a person in the first frame using a horizontal position from 0 to 1.
    type: number
    minimum: 0
    maximum: 1
  source_point_y:
    label: Vertical selection point
    help: Select a person in the first frame using a vertical position from 0 to 1.
    type: number
    minimum: 0
    maximum: 1
  prompt:
    label: What to make
    help: Describe the scene, action, and mood.
    type: string
    required: true
  width:
    label: Width
    help: Video width in pixels.
    type: integer
    minimum: 256
    maximum: 1024
    default: 832
  height:
    label: Height
    help: Video height in pixels.
    type: integer
    minimum: 256
    maximum: 1024
    default: 448
  length:
    label: Frame count
    help: Number of frames in the video.
    type: integer
    minimum: 5
    maximum: 81
    default: 81
  seed:
    label: Variation number
    help: Use the same number to repeat a variation with the same settings.
    type: integer
    minimum: 0
outputs:
  video:
    media_type: video/mp4
bindings:
  comfyui:
    workflow: workflows/videos/video-scail-2-replace.json
    map:
      reference_image:
        - node: "2"
          input: image
      source_subject:
        - node: "16"
          input: text
      reference_subject:
        - node: "17"
          input: text
      subject_index:
        - node: "23"
          input: object_indices
      source_video:
        - node: "1"
          input: file
      prompt:
        - node: "10"
          input: value
      width:
        - node: "20"
          input: value
      height:
        - node: "21"
          input: value
      length:
        - node: "22"
          input: value
      seed:
        - node: "30"
          input: value
requires:
  models:
    - role: diffusion_model
      path: diffusion_models/SCAIL-2-Q4_K_M.gguf
    - role: lora
      path: loras/wan2.1_SCAIL_2_DPO_lora_bf16.safetensors
    - role: lora
      path: loras/lightx2v_I2V_14B_480p_cfg_step_distill_rank64_bf16.safetensors
    - role: checkpoint
      path: checkpoints/sam3.1_multiplex_fp16.safetensors
    - role: clip_vision
      path: clip_vision/clip_vision_h.safetensors
