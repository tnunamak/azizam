schema_version: 2
min_gateway_version: "0.1"
version: "0.1.0"
id: image.edit.qwen-image-2.1-edit
intent: image.edit
capability: image
annotations:
  azizam.dev/backfill:
    capability: intent-prefix rule, schema 1 to 2
display_name: Qwen-Image 2.1 Edit
purpose: Edit a photo from a text instruction
prompt_hint: Describe the change you want
description: Change a photo by telling it what to do, such as swapping the background or adding an object.
typical_seconds: 20
inputs:
  prompt:
    label: what to make
    help: Describe the change you want.
    type: string
    required: true
  source_image:
    label: a picture to change
    help: The picture you want to change.
    type: asset
    accepts:
      - image/*
    required: true
  negative_prompt:
    label: what to avoid
    help: Describe anything you want left out.
    type: string
    default: ""
  reference_resolution:
    label: reference size
    help: Lower is faster. Large pictures can be much slower above 1024.
    type: integer
    minimum: 256
    maximum: 2048
    default: 1024
  steps:
    label: steps
    help: More steps add detail but take longer. 20 to 30 works well for this model.
    type: integer
    minimum: 1
    maximum: 60
    default: 25
  sampler:
    label: Generation method
    help: The method the model uses to build the result. Keep the default unless you are comparing methods.
    choices_from: {node_type: KSampler, input: sampler_name}
    type: string
    enum: [euler, euler_cfg_pp, euler_ancestral, euler_ancestral_cfg_pp, heun, heunpp2, exp_heun_2_x0, exp_heun_2_x0_sde, dpm_2, dpm_2_ancestral, lms, dpm_fast, dpm_adaptive, dpmpp_2s_ancestral, dpmpp_2s_ancestral_cfg_pp, dpmpp_sde, dpmpp_sde_gpu, dpmpp_2m, dpmpp_2m_cfg_pp, dpmpp_2m_sde, dpmpp_2m_sde_gpu, dpmpp_2m_sde_heun, dpmpp_2m_sde_heun_gpu, dpmpp_3m_sde, dpmpp_3m_sde_gpu, ddpm, lcm, ipndm, ipndm_v, deis, cfgpp_ud10_ab, res_multistep, res_multistep_cfg_pp, res_multistep_ancestral, res_multistep_ancestral_cfg_pp, gradient_estimation, gradient_estimation_cfg_pp, er_sde, seeds_2, seeds_3, sa_solver, sa_solver_pece, ddim, uni_pc, uni_pc_bh2]
    default: euler
  scheduler:
    label: Step timing
    help: How the refinement steps are spaced. Keep the default unless you are comparing results.
    choices_from: {node_type: KSampler, input: scheduler}
    type: string
    enum: [simple, sgm_uniform, karras, exponential, ddim_uniform, beta, normal, linear_quadratic, kl_optimal]
    default: simple
  cfg:
    label: prompt strength
    help: Higher follows your words more closely. Try 3 to 5 if colours look too warm.
    type: number
    minimum: 0
    maximum: 10
    default: 1.0
  seed:
    label: variation number
    help: Use the same number to repeat a variation with the same settings.
    type: integer
    minimum: 0
    generate:
      generator: random_integer
      minimum: 0
      maximum: 4294967295
  loras:
    label: style adapters
    help: Add up to 3 installed style adapters for this model. Strength runs from -4 to 4; 1.0 is usual.
    type: array
    max_items: 3
    items:
      type: object
      properties:
        name:
          label: adapter
          help: One of the installed adapters listed for this model.
          type: string
          required: true
        weight:
          label: strength
          help: How strongly the adapter applies. 1.0 is the usual setting.
          type: number
          minimum: -4
          maximum: 4
          default: 1.0
  text_encoder:
    label: text encoder
    help: Use a different text encoder that the server owner approved for this model. Leave empty for the usual one.
    type: string
    enum: [qwen3vl_8b_w4a8.safetensors]
outputs:
  image:
    media_type: image/png
bindings:
  comfyui:
    workflow: workflows/images/qwen-image-2.1-edit.json
    selectors:
      image: {node: '10', key: images, from: output_dir, decode: none, take: all}
    adapter_architecture: qwen_image_2
    adapter_lora_folder: loras
    map:
      loras:
        - node: "5"
          input: model
          chain:
            node_type: LoraLoaderModelOnly
            link: model
            fields: {name: lora_name, weight: strength_model}
      text_encoder:
        - node: "2"
          input: clip_name
      prompt:
        - node: "6"
          input: text
      sampler:
        - node: "8"
          input: sampler_name
      scheduler:
        - node: "8"
          input: scheduler
      source_image:
        - node: "4"
          input: image
      negative_prompt:
        - node: "7"
          input: negative_prompt
      reference_resolution:
        - node: "7"
          input: resolution
      steps:
        - node: "8"
          input: steps
      cfg:
        - node: "8"
          input: cfg
      seed:
        - node: "8"
          input: seed
    requires:
      custom_nodes:
        - RMBG
      models:
        - role: diffusion_model
          path: diffusion_models/qwen_image_2.1_int8_convrot.safetensors
        - role: text_encoder
          path: text_encoders/qwen3vl_8b_w4a8.safetensors
        - role: vae
          path: vae/texture_fix_vae_for_qwen_image_2.1_bf16.safetensors
released_at: "2026-09-20"
source_url: https://huggingface.co/Qwen/Qwen-Image-2.1
