schema_version: 1
min_gateway_version: "0.1"
version: "0.1.0"
id: image.edit.qwen-image-2.1-edit
intent: image.edit
display_name: Qwen-Image 2.1 Edit
purpose: Edit a photo from a text instruction
description: Change a photo by telling it what to do, such as swapping the background or adding an object.
source: local
trusted: true
typical_seconds: 20
inputs:
  prompt:
    type: string
    required: true
  source_image:
    label: a picture to change
    help: The picture you want to change.
    type: asset
    required: true
  negative_prompt:
    type: string
    default: ""
  reference_resolution:
    label: reference size
    help: Lower is faster. Large pictures can be much slower above 1024.
    type: integer
    minimum: 256
    maximum: 2048
    default: 1024
  steps:
    label: steps
    help: More steps add detail but take longer.
    type: integer
    minimum: 1
    maximum: 60
    default: 25
  cfg:
    label: prompt strength
    help: Higher follows your words more closely. Try 3 to 5 if colours look too warm.
    type: number
    minimum: 0
    maximum: 10
    default: 1.0
  seed:
    type: integer
    minimum: 0
outputs:
  image:
    media_type: image/png
bindings:
  comfyui:
    workflow: workflows/images/qwen-image-2.1-edit.json
    map:
      prompt:
        - node: "6"
          input: text
      source_image:
        - node: "4"
          input: image
      negative_prompt:
        - node: "7"
          input: negative_prompt
      reference_resolution:
        - node: "7"
          input: resolution
      steps:
        - node: "8"
          input: steps
      cfg:
        - node: "8"
          input: cfg
      seed:
        - node: "8"
          input: seed
requires:
  custom_nodes:
    - RMBG
  models:
    - role: diffusion_model
      path: diffusion_models/qwen_image_2.1_int8_convrot.safetensors
    - role: text_encoder
      path: text_encoders/qwen3vl_8b_w4a8.safetensors
    - role: vae
      path: vae/texture_fix_vae_for_qwen_image_2.1_bf16.safetensors
