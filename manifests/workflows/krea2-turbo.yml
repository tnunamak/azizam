schema_version: 1
min_gateway_version: "0.1"
version: "0.1.0"
id: image.generate.krea2-turbo
intent: image.generate
display_name: Krea 2 Turbo
purpose: Photoreal images from a prompt
description: Make a realistic photo-style picture from a description.
source: local
trusted: true
typical_seconds: 9
inputs:
  prompt:
    type: string
    required: true
  width:
    label: width
    help: Picture width in pixels.
    type: integer
    minimum: 64
    maximum: 2048
    default: 1024
  height:
    label: height
    help: Picture height in pixels.
    type: integer
    minimum: 64
    maximum: 2048
    default: 1024
  steps:
    label: steps
    help: More steps add detail but take longer. 8 to 12 works well for this model.
    type: integer
    minimum: 1
    maximum: 20
    default: 8
  seed:
    type: integer
    minimum: 0
  batch_size:
    label: number of pictures
    help: How many pictures to make at once.
    type: integer
    minimum: 1
    maximum: 8
    default: 1
outputs:
  image:
    media_type: image/png
bindings:
  comfyui:
    workflow: workflows/images/krea2-turbo.json
    map:
      prompt:
        - node: "4"
          input: text
      width:
        - node: "6"
          input: width
      height:
        - node: "6"
          input: height
      steps:
        - node: "7"
          input: steps
      seed:
        - node: "7"
          input: seed
      batch_size:
        - node: "6"
          input: batch_size
requires:
  custom_nodes:
    - RMBG
  models:
    - role: diffusion_model
      path: diffusion_models/krea2_turbo_int8_convrot.safetensors
    - role: text_encoder
      path: text_encoders/qwen3vl_4b_fp8_scaled.safetensors
    - role: vae
      path: vae/qwen_image_vae.safetensors
