schema_version: 2
min_gateway_version: "0.1"
version: "0.1.0"
id: image.edit.fibo-2-edit-turbo
license: "CC BY-NC 4.0 (Bria FIBO 2.0; non-commercial use only, commercial use needs a separate agreement with Bria AI)"
intent: image.edit
capability: image
annotations:
  azizam.dev/backfill:
    capability: intent-prefix rule, schema 1 to 2
display_name: FIBO 2 Edit Turbo
purpose: Edit a photo in four steps
prompt_hint: Describe the change you want
description: Change a picture by telling it what to do, such as swapping an outfit, changing the light or adding a sign with readable words. It is Bria's FIBO 2.0 editor and is for non-commercial use only.
typical_seconds: 7
inputs:
  prompt:
    label: what to make
    help: Describe the change you want.
    type: string
    required: true
  source_image:
    label: a picture to change
    help: The picture you want to change. The result has the same shape at about one megapixel.
    type: asset
    accepts:
      - image/*
    required: true
  steps:
    label: steps
    help: This model is trained for 4 steps. More steps rarely help.
    type: integer
    minimum: 1
    maximum: 8
    default: 4
  sampler:
    label: Generation method
    help: The method the model uses to build the result. Keep the default unless you are comparing methods.
    choices_from: {node_type: KSampler, input: sampler_name}
    type: string
    enum: [euler, euler_cfg_pp, euler_ancestral, euler_ancestral_cfg_pp, heun, heunpp2, exp_heun_2_x0, exp_heun_2_x0_sde, dpm_2, dpm_2_ancestral, lms, dpm_fast, dpm_adaptive, dpmpp_2s_ancestral, dpmpp_2s_ancestral_cfg_pp, dpmpp_sde, dpmpp_sde_gpu, dpmpp_2m, dpmpp_2m_cfg_pp, dpmpp_2m_sde, dpmpp_2m_sde_gpu, dpmpp_2m_sde_heun, dpmpp_2m_sde_heun_gpu, dpmpp_3m_sde, dpmpp_3m_sde_gpu, ddpm, lcm, ipndm, ipndm_v, deis, cfgpp_ud10_ab, res_multistep, res_multistep_cfg_pp, res_multistep_ancestral, res_multistep_ancestral_cfg_pp, gradient_estimation, gradient_estimation_cfg_pp, er_sde, seeds_2, seeds_3, sa_solver, sa_solver_pece, ddim, uni_pc, uni_pc_bh2]
    default: euler
  scheduler:
    label: Step timing
    help: How the refinement steps are spaced. Keep the default unless you are comparing results.
    choices_from: {node_type: KSampler, input: scheduler}
    type: string
    enum: [simple, sgm_uniform, karras, exponential, ddim_uniform, beta, normal, linear_quadratic, kl_optimal]
    default: simple
  seed:
    label: variation number
    help: Use the same number to repeat a variation with the same settings.
    type: integer
    minimum: 0
    generate:
      generator: random_integer
      minimum: 0
      maximum: 4294967295
outputs:
  image:
    media_type: image/png
bindings:
  comfyui:
    workflow: workflows/images/fibo-2-edit-turbo.json
    selectors:
      image: {node: '10', key: images, from: output_dir, decode: none, take: all}
    map:
      prompt:
        - node: "6"
          input: prompt
      sampler:
        - node: "7"
          input: sampler_name
      scheduler:
        - node: "7"
          input: scheduler
      source_image:
        - node: "4"
          input: image
      steps:
        - node: "7"
          input: steps
      seed:
        - node: "7"
          input: seed
    requires:
      custom_nodes:
        - RMBG
      models:
        - role: diffusion_model
          path: diffusion_models/fibo2_edit_turbo_int8_convrot.safetensors
        - role: text_encoder
          path: text_encoders/qwen3vl_4b_int8_convrot.safetensors
        - role: vae
          path: vae/flux2-vae.safetensors
source_url: https://huggingface.co/briaai/Fibo-2.0-edit-turbo
