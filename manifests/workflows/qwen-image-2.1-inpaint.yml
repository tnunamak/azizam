schema_version: 2
min_gateway_version: "0.1"
version: "0.1.0"
id: image.edit.qwen-image-2.1-inpaint
intent: image.edit
capability: image
annotations:
  azizam.dev/backfill:
    capability: intent-prefix rule, schema 1 to 2
display_name: Qwen-Image 2.1 Inpaint (LanPaint)
purpose: Repaint a marked area in fine detail
prompt_hint: Describe the change you want
description: Repaint the area you marked in a picture, following your description, and keep the rest as it is.
typical_seconds: 33
inputs:
  prompt:
    label: what to make
    help: Describe the change you want.
    type: string
    required: true
  source_image:
    label: a partly clear picture
    help: Transparent areas of the picture are redrawn.
    type: asset
    accepts:
      - image/*
    required: true
    description: RGBA image. Transparent pixels (alpha=0) mark the region to regenerate.
  negative_prompt:
    label: what to avoid
    help: Describe anything you want left out.
    type: string
    default: ""
  steps:
    label: refinement steps
    help: More steps add detail but take longer. 20 to 30 works well for this model.
    type: integer
    minimum: 1
    maximum: 60
    default: 25
  sampler:
    label: Generation method
    help: The method the model uses to build the result. Keep the default unless you are comparing methods.
    choices_from: {node_type: LanPaint_KSampler, input: sampler_name}
    type: string
    enum: [euler, euler_cfg_pp, euler_ancestral, euler_ancestral_cfg_pp, heun, heunpp2, exp_heun_2_x0, exp_heun_2_x0_sde, dpm_2, dpm_2_ancestral, lms, dpm_fast, dpm_adaptive, dpmpp_2s_ancestral, dpmpp_2s_ancestral_cfg_pp, dpmpp_sde, dpmpp_sde_gpu, dpmpp_2m, dpmpp_2m_cfg_pp, dpmpp_2m_sde, dpmpp_2m_sde_gpu, dpmpp_2m_sde_heun, dpmpp_2m_sde_heun_gpu, dpmpp_3m_sde, dpmpp_3m_sde_gpu, ddpm, lcm, ipndm, ipndm_v, deis, cfgpp_ud10_ab, res_multistep, res_multistep_cfg_pp, res_multistep_ancestral, res_multistep_ancestral_cfg_pp, gradient_estimation, gradient_estimation_cfg_pp, er_sde, seeds_2, seeds_3, sa_solver, sa_solver_pece, ddim, uni_pc, uni_pc_bh2]
    default: euler
  scheduler:
    label: Step timing
    help: How the refinement steps are spaced. Keep the default unless you are comparing results.
    choices_from: {node_type: LanPaint_KSampler, input: scheduler}
    type: string
    enum: [simple, sgm_uniform, karras, exponential, ddim_uniform, beta, normal, linear_quadratic, kl_optimal]
    default: karras
  cfg:
    label: prompt strength
    help: Higher follows your words more closely.
    type: number
    minimum: 0
    maximum: 10
    default: 1.0
  seed:
    label: variation number
    help: Use the same number to repeat a variation with the same settings.
    type: integer
    minimum: 0
    generate:
      generator: random_integer
      minimum: 0
      maximum: 4294967295
  mask_expand:
    label: edit area size
    help: Positive values expand the edit area in pixels; negative values shrink it.
    type: integer
    minimum: -256
    maximum: 256
    default: 0
    description: Pixels to grow (positive) or shrink (negative) the edit mask before sampling.
  mask_feather:
    label: edit edge softness
    help: Higher values soften edit edges but reduce precision near the boundary.
    type: integer
    minimum: 0
    maximum: 256
    description: Pixels to feather each edge of the edit mask. Higher values soften the known boundary-seam artifact at the cost of edit precision near the mask edge. When it is not given, the workflow's own feather applies (48 pixels at the top and bottom, none at the sides).
  lanpaint_steps:
    label: edge refinement steps
    help: More steps improve consistency at the edit boundary but take longer.
    type: integer
    minimum: 0
    maximum: 20
    default: 5
    description: LanPaint's internal Langevin refinement steps per sampler step ("turns of thinking"). Higher = better boundary consistency, slower.
  prompt_mode:
    label: edit priority
    help: Image First favors seamless blending, while Prompt First follows the edit instruction more literally.
    choices_from: {node_type: LanPaint_KSampler, input: LanPaint_PromptMode}
    type: string
    enum: ["Image First", "Prompt First"]
    default: "Image First"
    description: Image First favors seamless blending; Prompt First favors literal adherence to the edit instruction.
outputs:
  image:
    media_type: image/png
bindings:
  comfyui:
    workflow: workflows/images/qwen-image-2.1-inpaint.json
    selectors:
      image: {node: '13', key: images, from: output_dir, decode: none, take: all}
    # This workflow derives its edit mask from source-image alpha. Convert the
    # OpenAI mask upload into alpha on the source image before ComfyUI upload.
    mask_to_source_alpha: true
    map:
      prompt:
        - node: "6"
          input: text
      sampler:
        - node: "11"
          input: sampler_name
      scheduler:
        - node: "11"
          input: scheduler
      source_image:
        - node: "4"
          input: image
      negative_prompt:
        - node: "9"
          input: negative_prompt
      steps:
        - node: "11"
          input: steps
      cfg:
        - node: "11"
          input: cfg
      seed:
        - node: "11"
          input: seed
      mask_expand:
        - node: "14"
          input: expand
      mask_feather:
        - node: "15"
          input: top
        - node: "15"
          input: bottom
        - node: "15"
          input: left
        - node: "15"
          input: right
      lanpaint_steps:
        - node: "11"
          input: LanPaint_NumSteps
      prompt_mode:
        - node: "11"
          input: LanPaint_PromptMode
    requires:
      custom_nodes:
        - LanPaint_KSampler
        - LanPaint_ImageEncode
        - LanPaint_ImageDecode
        - RMBG
      models:
        - role: diffusion_model
          path: diffusion_models/qwen_image_2.1_int8_convrot.safetensors
        - role: text_encoder
          path: text_encoders/qwen3vl_8b_w4a8.safetensors
        - role: vae
          path: vae/texture_fix_vae_for_qwen_image_2.1_bf16.safetensors
released_at: "2026-09-20"
source_url: https://huggingface.co/Qwen/Qwen-Image-2.1
