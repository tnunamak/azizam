# License cards verified 2026-10-20:
# https://huggingface.co/Comfy-Org/MOSS-Image
# https://huggingface.co/OpenMOSS-Team/MOSS-Image-SFT
# https://huggingface.co/lodestones/Kromoss
schema_version: 2
min_gateway_version: '0.1'
version: 0.1.0
id: image.generate.moss-image-fast
intent: image.generate
capability: image
annotations:
  azizam.dev/backfill:
    capability: intent-prefix rule, schema 1 to 2
display_name: MOSS Image Fast
purpose: Fast images with less memory
prompt_hint: Describe the picture you want
description: Make a picture quickly with less memory. Uses about 9.6 GB of memory.
typical_seconds: 5
inputs:
  prompt:
    type: string
    required: true
    label: description
    help: Describe what you want to make.
  width:
    label: width
    help: Picture width in pixels.
    type: integer
    minimum: 64
    maximum: 2048
    default: 1024
  height:
    label: height
    help: Picture height in pixels.
    type: integer
    minimum: 64
    maximum: 2048
    default: 1024
  steps:
    label: steps
    help: This model is trained for 8 steps. 4 to 12 works well.
    type: integer
    minimum: 1
    maximum: 16
    default: 8
  sampler:
    label: Generation method
    help: The method the model uses to build the result. Keep the default unless you are comparing methods.
    choices_from: {node_type: KSamplerSelect, input: sampler_name}
    type: string
    enum: [euler, euler_cfg_pp, euler_ancestral, euler_ancestral_cfg_pp, heun, heunpp2, exp_heun_2_x0, exp_heun_2_x0_sde, dpm_2, dpm_2_ancestral, lms, dpm_fast, dpm_adaptive, dpmpp_2s_ancestral, dpmpp_2s_ancestral_cfg_pp, dpmpp_sde, dpmpp_sde_gpu, dpmpp_2m, dpmpp_2m_cfg_pp, dpmpp_2m_sde, dpmpp_2m_sde_gpu, dpmpp_2m_sde_heun, dpmpp_2m_sde_heun_gpu, dpmpp_3m_sde, dpmpp_3m_sde_gpu, ddpm, lcm, ipndm, ipndm_v, deis, cfgpp_ud10_ab, res_multistep, res_multistep_cfg_pp, res_multistep_ancestral, res_multistep_ancestral_cfg_pp, gradient_estimation, gradient_estimation_cfg_pp, er_sde, seeds_2, seeds_3, sa_solver, sa_solver_pece, ddim, uni_pc, uni_pc_bh2]
    default: euler
  scheduler:
    label: Step timing
    help: How the refinement steps are spaced. Keep the default unless you are comparing results.
    choices_from: {node_type: BasicScheduler, input: scheduler}
    type: string
    enum: [simple, sgm_uniform, karras, exponential, ddim_uniform, beta, normal, linear_quadratic, kl_optimal]
    default: simple
  seed:
    type: integer
    minimum: 0
    label: variation number
    help: Reuse this number and the same settings for a similar result.
    generate:
      generator: random_integer
      minimum: 0
      maximum: 4294967295
  batch_size:
    label: number of pictures
    help: How many pictures to make at once.
    type: integer
    minimum: 1
    maximum: 8
    default: 1
outputs:
  image:
    media_type: image/png
bindings:
  comfyui:
    workflow: workflows/images/moss-image-fast.json
    selectors:
      image: {node: '14', key: images, from: output_dir, decode: none, take: all}
    map:
      prompt:
        - node: '5'
          input: text
      steps:
        - node: '8'
          input: steps
      sampler:
        - node: '7'
          input: sampler_name
      scheduler:
        - node: '8'
          input: scheduler
      width:
        - node: '10'
          input: width
      height:
        - node: '10'
          input: height
      seed:
        - node: '9'
          input: noise_seed
      batch_size:
        - node: '10'
          input: batch_size
    requires:
      custom_nodes:
        - RMBG
      models:
        - role: diffusion_model
          path: diffusion_models/kromoss_int8_convrot.safetensors
        - role: text_encoder
          path: text_encoders/qwen3.5_9b_int8_convrot.safetensors
        - role: vae
          path: vae/flux2-vae.safetensors
        - role: lora
          path: loras/kromoss-8steps-dmd-lora.safetensors
license: Apache-2.0
source_url: https://huggingface.co/lodestones/Kromoss
