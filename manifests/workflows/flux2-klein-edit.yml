schema_version: 1
min_gateway_version: "0.1"
version: "0.3.0"
id: image.edit.flux2-klein
intent: image.edit
display_name: FLUX.2 Klein 9B Edit
purpose: Edit an image from an instruction
description: Portable image edit contract bound to the existing ComfyUI workflow.
source: local
trusted: true
inputs:
  prompt:
    label: description
    help: Describe what you want to make.
    type: string
    required: true
  source_image:
    label: a picture to change
    help: The picture you want to change.
    type: asset
    required: true
  mask:
    label: a mask
    help: White areas change; black areas stay as they are.
    type: asset
    description: Optional OpenAI image-edit mask. Transparent alpha edits and opaque alpha preserves; grayscale white edits and black preserves. The current Flux2 edit workflow has no native inpaint node, so the gateway applies this as a post-composite preservation mask unless a mask-bound workflow is selected.
  width:
    label: width
    help: Picture width in pixels.
    type: integer
    minimum: 64
    maximum: 2048
  height:
    label: height
    help: Picture height in pixels.
    type: integer
    minimum: 64
    maximum: 2048
  steps:
    label: steps
    help: More steps take longer.
    type: integer
    minimum: 1
    maximum: 100
  guidance:
    label: prompt guidance
    type: number
    minimum: 0
    maximum: 20
  denoise:
    label: change strength
    help: Lower values preserve more of the original.
    type: number
    minimum: 0
    maximum: 1
    default: 1
    description: Amount of denoising applied by truncating the Flux2 sigma schedule. Lower values preserve more input-image structure.
outputs:
  image:
    media_type: image/png
bindings:
  comfyui:
    workflow: workflows/images/flux2-klein-edit.json
    map:
      prompt:
        - node: "6"
          input: text
      source_image:
        - node: "10"
          input: image
      width:
        - node: "48"
          input: width
        - node: "47"
          input: width
      height:
        - node: "48"
          input: height
        - node: "47"
          input: height
      steps:
        - node: "48"
          input: steps
      guidance:
        - node: "26"
          input: guidance
      # Route-owned reseeding; the public input schema stays unchanged.
      seed:
        - node: "25"
          input: noise_seed
      denoise:
        - node: "49"
          input: denoise
