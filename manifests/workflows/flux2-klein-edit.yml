schema_version: 2
min_gateway_version: "0.1"
version: "0.1.0"
id: image.edit.flux2-klein
intent: image.edit
capability: image
annotations:
  azizam.dev/backfill:
    capability: intent-prefix rule, schema 1 to 2
display_name: FLUX.2 Klein 9B Edit
purpose: Edit an image with the larger model
prompt_hint: Describe the change you want
description: Portable image edit contract bound to the FLUX.2 Klein 9B edit ComfyUI workflow.
typical_seconds: 27  # measured 2026-10-21 through the gateway on an empty queue, warm
inputs:
  prompt:
    label: description
    help: Describe what you want to make.
    type: string
    required: true
  source_image:
    label: a picture to change
    help: The picture you want to change.
    type: asset
    accepts:
      - image/*
    required: true
  mask:
    label: a mask
    help: White areas change; black areas stay as they are.
    type: asset
    accepts:
      - image/*
    description: Optional OpenAI image-edit mask. Transparent alpha edits and opaque alpha preserves; grayscale white edits and black preserves. The current Flux2 edit workflow has no native inpaint node, so the gateway applies this as a post-composite preservation mask unless a mask-bound workflow is selected.
  width:
    label: width
    help: Picture width in pixels.
    type: integer
    minimum: 64
    maximum: 2048
  height:
    label: height
    help: Picture height in pixels.
    type: integer
    minimum: 64
    maximum: 2048
  steps:
    label: steps
    help: More steps take longer.
    type: integer
    minimum: 1
    maximum: 100
  guidance:
    label: prompt guidance
    type: number
    minimum: 0
    maximum: 20
  seed:
    type: integer
    minimum: 0
    settable: false
    generate:
      generator: random_integer
      minimum: 0
      maximum: 4294967295
outputs:
  image:
    media_type: image/png
bindings:
  comfyui:
    workflow: workflows/images/flux2-klein-edit.json
    selectors:
      image: {node: '9', key: images, from: output_dir, decode: none, take: all}
    # applied by the route as a post-composite preservation mask (gateway/image route), not by a graph node.
    edge_only_inputs: [mask]
    map:
      prompt:
        - node: "6"
          input: text
      source_image:
        - node: "10"
          input: image
      width:
        - node: "48"
          input: width
        - node: "47"
          input: width
      height:
        - node: "48"
          input: height
        - node: "47"
          input: height
      steps:
        - node: "48"
          input: steps
      guidance:
        - node: "26"
          input: guidance
      # Route-owned reseeding; the public input schema stays unchanged.
      seed:
        - node: "25"
          input: noise_seed
