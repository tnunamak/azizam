# Long recordings with human reference transcripts, for measuring long-audio
# transcription settings. This file is data only: it names where each file
# lives and its checksum. Azizam ships no audio. gateway/stt_samples.py
# downloads the sources on demand, checks them and builds a 16 kHz mono WAV
# plus a word list with times.
#
# sources: every file to download. A file is cached by its sha256, so a large
#   archive that several samples share downloads once.
# recipe.kind: how to read the reference words (ami-words, icsi-words,
#   earnings21). recipe.params name the sources by their `name`.
#   cut_seconds (optional, any kind): keep only the first N seconds of audio
#   and only the words that end by then.
# timing: "word" (the corpus times every word) or "segment-interpolated"
#   (the corpus times speech segments; word times are spread over them).
# Every source declares audio_rights and transcript_rights (status and note),
# provenance, and human_transcribed_evidence. Evidence records source claims,
# not an independent rights or authorship verification. Status is stated,
# not-stated, or not-applicable; public hosting does not establish reuse rights.

x-no-audio-rights: &no_audio_rights
  status: not-applicable
  note: This source contains annotations, not audio.
x-no-transcript-rights: &no_transcript_rights
  status: not-applicable
  note: This source contains audio, not transcript text.
x-ami-rights: &ami_rights
  status: stated
  note: >-
    CC BY 4.0; https://groups.inf.ed.ac.uk/ami/corpus/license.shtml
    covers the AMI corpus and its annotations.
x-ami-human-evidence: &ami_human_evidence >-
  AMI public_manual_1.6.2 word annotations in the public manual distribution:
  https://groups.inf.ed.ac.uk/ami/AMICorpusAnnotations/ami_public_manual_1.6.2.zip.
  The manifest identifies these as human references; authorship was not independently verified here.
x-icsi-rights: &icsi_rights
  status: stated
  note: >-
    CC BY 4.0; https://groups.inf.ed.ac.uk/ami/icsi/license.shtml
    and ICSI/LICENCE.txt in ICSI_core_NXT.zip.
x-icsi-human-evidence: &icsi_human_evidence >-
  ICSI word annotations in the Edinburgh NXT distribution:
  https://groups.inf.ed.ac.uk/ami/ICSICorpusAnnotations/ICSI_core_NXT.zip.
  The manifest identifies these as human references; authorship was not independently verified here.
x-earnings-rights: &earnings_rights
  status: stated
  note: >-
    CC BY-SA 4.0 for transcripts and alignment files, per
    https://github.com/revdotcom/speech-datasets/blob/c05ab6fd8b4b627d123c922a22a39e993dd37635/earnings21/LICENSE.md.
x-earnings-human-evidence: &earnings_human_evidence >-
  Rev.com Earnings-21 nlp_references transcript, paired with RTTM speaker segments,
  at repository revision c05ab6fd8b4b627d123c922a22a39e993dd37635.
  The manifest identifies this as a human reference; authorship was not independently verified here.

x-ami-annotations: &ami_annotations
  name: annotations
  url: https://groups.inf.ed.ac.uk/ami/AMICorpusAnnotations/ami_public_manual_1.6.2.zip
  sha256: b56e5babb2496b8795deeeda7e71178d7fbc9963f94276cf2a3f4b56ebbc9f9d
  bytes: 22887865
  audio_rights: *no_audio_rights
  transcript_rights: *ami_rights
  provenance: AMI public manual annotation archive, distributed by the University of Edinburgh.
  human_transcribed_evidence: *ami_human_evidence

x-ami-licence: &ami_licence
  name: CC BY 4.0
  url: https://creativecommons.org/licenses/by/4.0/
  attribution: AMI Meeting Corpus, Carletta et al. (https://groups.inf.ed.ac.uk/ami/corpus/)
  note: >-
    https://groups.inf.ed.ac.uk/ami/corpus/license.shtml says "The AMI corpus
    and its annotations are released under the Creative Commons Attribution
    4.0 license agreement".

