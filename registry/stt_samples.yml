          - words/ES2014a.D.words.xml

  - id: icsi-Bdb001-first30min
    corpus: icsi
    title: ICSI meeting Bdb001, first 30 minutes (interaction mix)
    licence:
      name: CC BY 4.0
      url: https://creativecommons.org/licenses/by/4.0/
      attribution: ICSI Meeting Corpus (Janin et al. 2003), Edinburgh NXT distribution
      note: >-
        https://groups.inf.ed.ac.uk/ami/icsi/license.shtml and ICSI/LICENCE.txt
        in ICSI_core_NXT.zip: CC BY 4.0. Only the first 1800 s of the 3022 s
        meeting are used. Some words have no times in the corpus; they are
        spread between known neighbours. Some contractions have no apostrophe
        in the source ("thats").
    duration_seconds: 1800.0
    speakers: 6
    timing: word
    sources:
      - name: audio
        url: https://groups.inf.ed.ac.uk/ami/ICSIsignals/NXT/Bdb001.interaction.wav
        sha256: 74ded35b52877dd300effd32ed25d8c390fe9eecfaf451c080271778751842d9
        bytes: 96701996
      - name: annotations
        url: https://groups.inf.ed.ac.uk/ami/ICSICorpusAnnotations/ICSI_core_NXT.zip
        sha256: cf4860245b9ca9c9ed11a66e5a74cfea2a99a686a52f7580aa0a6bc2225895a9
        bytes: 19488722
    recipe:
      kind: icsi-words
      params:
        audio: audio
        annotations: annotations
        cut_seconds: 1800
        word_members:
          - ICSI/Words/Bdb001.A.words.xml
          - ICSI/Words/Bdb001.B.words.xml
          - ICSI/Words/Bdb001.C.words.xml
          - ICSI/Words/Bdb001.D.words.xml
          - ICSI/Words/Bdb001.E.words.xml
          - ICSI/Words/Bdb001.F.words.xml

  - id: earnings21-4366522
    corpus: earnings21
    title: Earnings-21 call 4366522 (Aldeyra Therapeutics Q2 2020)
    licence:
      name: CC BY-SA 4.0
      url: https://creativecommons.org/licenses/by-sa/4.0/
      attribution: Earnings-21, Rev.com (https://github.com/revdotcom/speech-datasets/tree/main/earnings21)
      note: >-
        https://github.com/revdotcom/speech-datasets/blob/main/earnings21/LICENSE.md
        licenses the transcripts and alignment files under CC BY-SA 4.0 and
        states no separate licence for the audio, which is public earnings-call
        audio that Rev publishes in the same repository. Use it for private
        local evaluation; do not redistribute the audio. The public transcript
        has no word times: word times are spread over the speaker's RTTM speech
        segments and can be a few seconds off inside a long segment.
    duration_seconds: 1817.731
    speakers: 5
    timing: segment-interpolated
    sources:
      - name: audio
        url: https://raw.githubusercontent.com/revdotcom/speech-datasets/main/earnings21/media/4366522.mp3
        sha256: 143073661592bc19ab931de1f5cf564adbfd2777c65837cacfa98572c6b1e09e
        bytes: 9088686
      - name: transcript
        url: https://raw.githubusercontent.com/revdotcom/speech-datasets/main/earnings21/transcripts/nlp_references/4366522.nlp
        sha256: 53eab8ef960f999d6fb0a55af583cdfb7210e1a17ae164b07c7855bffeebcbf8
        bytes: 96239
      - name: segments
        url: https://raw.githubusercontent.com/revdotcom/speech-datasets/main/earnings21/rttms/4366522.rttm
        sha256: 2c60f70d87784d4b29ee539fbdacec9fd5b98c950d861b73799b6d12c73feebe
        bytes: 26228
    recipe:
      kind: earnings21
      params:
        audio: audio
        transcript: transcript
        segments: segments
