# Frozen compatibility policy. Migration selectors run only at admin schema version 6.
schema_version: 1
# Ordered keys for the legacy base64/byte result wrapper, not engine selectors.
# The first truthy value wins; if none is truthy, retain the last key's value.
legacy_audio_result_keys: [audio, b64_json, data]
migration:
  include_capabilities: [transcriptions, translations, translation, stt, audio.transcriptions, audio.translations]
  exclude_capabilities: [chat, completions]
  config_mapping: chunking
# Which workflow intents each alias section of /gateway/v1/aliases may name, and the prefix
# older alias targets carry before the workflow's short id (image-flux2-klein -> flux2-klein).
alias_operation_intents:
  images: [{intent: image.generate, target_prefix: image-}]
  image_edits: [{intent: image.edit, target_prefix: image-}]
  videos: [{intent: video.generate, target_prefix: video-}, {intent: video.edit, target_prefix: video-}]
  audio_generate: [{intent: audio.generate, target_prefix: audio-}]
legacy_alias_tables:
  videos: videos
  audio_generate: audio
# Exact canonical workflow IDs and their older configuration keys.
limit_key_aliases:
  video.generate.ltx-2.5-t2v: video-ltx-2.5-t2v
  video.generate.ltx-2.5-i2v: video-ltx-2.5-i2v
  video.generate.ltx-2.5-keyframes: video-ltx-2.5-keyframes
  video.generate.ltx-2.5-keyframes-mid: video-ltx-2.5-keyframes-mid
  video.generate.ltx-2.5-long: video-ltx-2.5-long
  video.generate.minimax-h3-t2v: video-minimax-h3-t2v
  video.generate.minimax-h3-i2v: video-minimax-h3-i2v
  video.generate.minimax-h3-keyframes: video-minimax-h3-keyframes
  video.generate.minimax-h3-keyframes-mid: video-minimax-h3-keyframes-mid
  video.generate.minimax-h3-long: video-minimax-h3-long
  video.edit.scail-2-replace: video-scail-2-replace
