        compatibility_base_url: /
        tags_url: /ollama/api/tags
        chat_url: /ollama/api/chat
        auth: "Authorization: Bearer $AZIZAM_API_KEY; discovery needs a key like every other route"
        unsupported_lifecycle:
          - create
          - pull
          - push
          - copy
          - delete
        unsupported_lifecycle_note: Lifecycle routes return unsupported_operation and never mutate local model files.
      streaming:
        chat: true
        generate: true
        embed: false
      endpoints:
        - /ollama/api/tags
        - /ollama/api/chat
        - /ollama/api/generate
        - /ollama/api/embed
        - /ollama/api/embeddings
        - /ollama/api/show
        - /ollama/api/ps
        - /ollama/api/version
        - /ollama/api/create
        - /ollama/api/copy
        - /ollama/api/pull
        - /ollama/api/push
        - /ollama/api/delete
        - /api/tags
        - /api/chat
        - /api/generate
        - /api/embed
        - /api/embeddings
        - /api/show
        - /api/ps
        - /api/version
        - /api/create
        - /api/copy
        - /api/pull
        - /api/push
        - /api/delete
      limits:
        - model catalog/status endpoints are projected from the gateway; model mutation endpoints return unsupported_operation
        - model lifecycle endpoints create/pull/push/copy/delete do not mutate local model files through the gateway
        - backend-native options without portable meaning are rejected
  - id: gateway
    # Stored-receipt protocol vocabulary; owner projections read this data.
    receipt_protocols: [gateway.media, azizam.make]
    name: Gateway-native
    protocol: gateway
    source: builtin
    editable: false
    enabled: true
    strictness: exact
    canonical: true
    routes:
      - /gateway/v1
    intents:
      - capabilities.list
      - providers.native
      - jobs.create
      - assets.read
    registered_routes:
      - methods: [GET]
        translator: gateway
        intent: media.job.content
        canonical: /gateway/v1/media/jobs/{job_id}/content
        runtime_policy: {protocol: openai.images, intent: image.generate, backend: comfyui, capability_exposure: default, capability_trust_tier: stable, capability_resource_tier: batch}
    asset_content_policies:
      img: {protocol: openai.images, intent: image.generate, backend: comfyui, capability_exposure: default, capability_trust_tier: stable, capability_resource_tier: batch}
      aud: {protocol: openai.audio, intent: audio.generate, backend: comfyui, capability_exposure: default, capability_trust_tier: stable, capability_resource_tier: batch}
      vid: {protocol: openai.video, intent: video.generate, backend: comfyui, capability_exposure: default, capability_trust_tier: stable, capability_resource_tier: expensive}
    public_discovery:
      compatibility: azizam-native
      default: false
      base_url_recipe: "{base_url}/gateway/v1"
      recipe:
        canonical_base_url: /gateway/v1
        capabilities_url: /gateway/v1/capabilities
        providers_url: /gateway/v1/providers
        auth: "Authorization: Bearer $AZIZAM_API_KEY"
      streaming: {}
      endpoints:
        - /gateway/v1/capabilities
        - /gateway/v1/workflows
        - /gateway/v1/receipts
        - /gateway/v1/media/jobs
        - /gateway/v1/assets/{asset_id}
        - /gateway/v1/assets/{asset_id}/content
        - /openai/v1/audio/generate
        - /openai/v1/audio/models
        - /v1/audio/generate
        - /v1/audio/models
        - /gateway/v1/providers
        - /gateway/v1/providers/{provider}
      limits:
        - /openai/v1/audio/generate and /v1/audio/generate are gateway-native music/SFX generation routes, not OpenAI SDK-compatible audio endpoints
        - signed asset content URLs are bearerless capability URLs until expiry; asset metadata and input reuse remain API-key scoped
  - id: provider-native
    # Stored-receipt protocol vocabulary; owner projections read this data.
    receipt_protocols: [provider-native]
    name: Provider-native passthrough
    protocol: provider-native
    source: builtin
    editable: false
    enabled: true
    strictness: exact
    canonical: false
    routes:
      - /gateway/v1/providers/{provider}
    intents:
      - provider.native
    registered_routes:
      - methods: [GET]
        canonical: /gateway/v1/providers
        translator: provider-native
        intent: provider.list
      - methods: [GET]
        canonical: /gateway/v1/providers/{provider}
        translator: provider-native
        intent: provider.detail
      - methods: [GET, POST, PUT, DELETE, PATCH, OPTIONS]
        canonical: /gateway/v1/providers/{provider}/{native_path:path}
        translator: provider-native
        intent: provider.native
    public_discovery:
      base_path: /gateway/v1/providers
      compatibility: provider-native-passthrough
      default: false
      base_url_recipe: "{base_url}/gateway/v1/providers/{provider}"
      recipe:
        discovery_url: /gateway/v1/providers
        provider_url: /gateway/v1/providers/{provider}
        passthrough_url_template: /gateway/v1/providers/{provider}/{path...}
        auth: "Authorization: Bearer $AZIZAM_API_KEY plus App profile native_passthrough permission"
        discovery_facts: Provider rows include caller-projected native_passthrough policy, allowed operations/backends, required gateway auth, non-secret downstream auth classes when known, and live enabled state.
        collision_strategy: Canonical protocol frontends own /openai/v1, /anthropic/v1, /ollama/api, /v1, and /api. Provider-native passthrough is only under /gateway/v1/providers/{provider}/{path...}.
      streaming: {}
      endpoints:
        - /gateway/v1/providers
        - /gateway/v1/providers/{provider}
        - /gateway/v1/providers/{provider}/{path...}
      policy:
        - requires provider-native protocol access
        - requires native_passthrough enabled for the App profile
        - provider and operation must be allowed by policy
        - no root catch-all
        - protocol frontend path collisions stay owned by the frontend; use /gateway/v1/providers/{provider}/{path...} for raw provider-native paths
  - id: native
    name: Per-engine native pass-through
    protocol: native
    source: builtin
    editable: false
    enabled: true
    strictness: exact
    canonical: false
    routes:
      - /native/{engine_id}
    intents:
      - engine.native
    # Contract section 5. Off unless the engine record sets native_passthrough; never for a remote
    # provider; the access plan and the receipt apply as they do to /gateway/v1/providers/{provider}.
    # No public_discovery: the lane is not advertised yet.
    registered_routes:
      - methods: [GET, POST, PUT, DELETE, PATCH, OPTIONS]
        canonical: /native/{engine_id}/{native_path:path}
        translator: native
        intent: engine.native
  # Image to 3D. The handlers are the rows `mesh-generations` and `mesh-glb` below, mounted by gateway/row_routes.py
  # (FRONTEND_TRANSLATORS.register_owned). This record owns method, path, protocol, intent, the required capability,
  # exposure and tiers, and public discovery of those two routes. The record has no translator, so the frontend mount does
  # not mount it. Which workflows the rows serve is each row's selector, not this record.
  - id: mesh
    receipt_protocols: [openai.mesh]
    name: 3D generation
    protocol: openai
    source: builtin
    editable: false
    enabled: true
    strictness: exact
    canonical: true
    routes: [/v1/3d]
    intents: [mesh.generate]
    registered_routes:
      - methods: [POST]
        canonical: /v1/3d/generations
        intent: mesh.generate
        capability: mesh
        discovery_metadata:
          input_modalities: [image]
          output_modalities: [mesh]
        runtime_policy: {protocol: openai.mesh, intent: mesh.generate, capability_exposure: default, capability_trust_tier: stable, capability_resource_tier: batch}
      - methods: [POST]
        canonical: /v1/3d/generations/glb
        intent: mesh.generate
        capability: mesh
        discovery_metadata:
          input_modalities: [image]
          output_modalities: [mesh]
        runtime_policy: {protocol: openai.mesh, intent: mesh.generate, capability_exposure: default, capability_trust_tier: stable, capability_resource_tier: batch}
    # A finished model is stored under the generic ``ast`` prefix; the job's content route and the asset content route
    # read this row for the plan check, as they read the img, aud and vid rows.
    asset_content_policies:
      ast: {protocol: openai.mesh, intent: mesh.generate, capability_exposure: default, capability_trust_tier: stable, capability_resource_tier: batch}
    public_discovery:
      canonical_base_path: /v1/3d
      compatibility: "One picture in, one textured GLB out (model/gltf-binary)."
      streaming: false
      base_url_recipe: "Set the base URL to the gateway root; the routes are POST /v1/3d/generations and POST /v1/3d/generations/glb."
      endpoints: [/v1/3d/generations, /v1/3d/generations/glb]

# Frontend rows (CODE_TO_DATA_S4_S8 I5, section 8): one row per modality route. A row names the reviewed wire shape
# that speaks the route (gateway/frontend_shapes), the routes it owns, a selector in the kernel's closed schema that says
# which workflows it serves (an `ids` list, or a `match` on inputs and outputs; never an intent word), and `mode`
# (`sync` answers in one call, `job` answers with a job). `lists_as_model: true` lists the row's workflows as models.
# Each row is validated with `selector_problems` when it is loaded (gateway/frontend_shapes.parse_rows).
# The `registered_routes` above still carry the routes the main module serves today; a route moves onto its row, and
# leaves `registered_routes`, in the same change.
frontends:
  - id: images-generations
    shape: openai.images.json
    mode: sync
    refusal_bodies: {service_disabled: {message: Image generation not enabled, type: service_unavailable}}
    receipt_protocol: openai.images
    receipt_opens: before_policy
    refusal_receipt: rejected
    result_headers: {warnings: X-Proxy-Warning, rounds: X-Image-Rounds, returned: X-Image-Returned, size_adjusted: X-Azizam-Size-Adjusted, models_freed: X-ComfyUI-Models-Freed, background_removal: X-Image-Background-Removal, background_removal_source: X-Image-Background-Removal-Source}
    result_receipt: {models_freed: comfyui_models_freed_for_vram}
    strictness: exact
    lists_as_model: true
    selects: {match: {inputs: {prompt: {type: string}}, outputs: {media_type: "image/*"}}}
    routes:
      - methods: [POST]
        canonical: /v1/images/generations
        aliases: [/openai/v1/images/generations]
        runtime_policy: {receipt_names: short, default_answer: b64_json, job_retries: none, protocol: openai.images, intent: image.generate, backend: comfyui, capability_exposure: default, capability_trust_tier: stable, capability_resource_tier: batch}
  - id: images-edits
    shape: openai.images.multipart
    mode: sync
    refusal_bodies: {service_disabled: {message: Image generation not enabled, type: service_unavailable}}
    receipt_protocol: openai.images
    receipt_opens: before_policy
    refusal_receipt: rejected
    result_headers: {warnings: X-Proxy-Warning, rounds: X-Image-Rounds, returned: X-Image-Returned, size_adjusted: X-Azizam-Size-Adjusted, models_freed: X-ComfyUI-Models-Freed, background_removal: X-Image-Background-Removal, background_removal_source: X-Image-Background-Removal-Source, image_mask: X-Image-Mask, image_mask_source: X-Image-Mask-Source}
    result_receipt: {models_freed: comfyui_models_freed_for_vram}
    strictness: exact
    lists_as_model: true
    selects: {match: {inputs: {prompt: {type: string}, source_image: {media_type: "image/*"}}, outputs: {media_type: "image/*"}}}
    routes:
      - methods: [POST]
        canonical: /v1/images/edits
        aliases: [/openai/v1/images/edits]
        runtime_policy: {receipt_names: short, default_answer: b64_json, job_retries: none, protocol: openai.images, intent: image.edit, backend: comfyui, capability_exposure: default, capability_trust_tier: stable, capability_resource_tier: batch}
  - id: images-variations
    shape: openai.images.variations
    mode: sync
    refusal_bodies: {service_disabled: {message: Image generation not enabled, type: service_unavailable}}
    receipt_protocol: openai.images
    receipt_opens: before_policy
    refusal_receipt: rejected
    result_headers: {warnings: X-Proxy-Warning, rounds: X-Image-Rounds, returned: X-Image-Returned, size_adjusted: X-Azizam-Size-Adjusted, models_freed: X-ComfyUI-Models-Freed, background_removal: X-Image-Background-Removal, background_removal_source: X-Image-Background-Removal-Source}
    result_receipt: {models_freed: comfyui_models_freed_for_vram}
    strictness: exact
    selects: {match: {inputs: {source_image: {media_type: "image/*"}}, outputs: {media_type: "image/*"}}}
    routes:
      - methods: [POST]
        canonical: /v1/images/variations
        aliases: [/openai/v1/images/variations]
        runtime_policy: {receipt_names: short, default_answer: b64_json, job_retries: none, protocol: openai.images, intent: image.edit, backend: comfyui, capability_exposure: default, capability_trust_tier: stable, capability_resource_tier: batch}
  - id: image-jobs
    shape: openai.images.jobs
    mode: job
    refusal_bodies: {service_disabled: {message: This service is not available right now., code: resource_admission_denied, retry_after_s: 30}}
    receipt_protocol: openai.images
    receipt_opens: before_policy
    refusal_receipt: rejected
    run_receipt_path: /v1/images/generations
    strictness: exact
    selects: {match: {inputs: {prompt: {type: string}}, outputs: {media_type: "image/*"}}}
    routes:
      - methods: [POST]
        canonical: /gateway/v1/media/jobs/image-generations
        runtime_policy: {receipt_names: short, default_answer: b64_json, job_failure_text: category_copy, protocol: openai.images, intent: image.generate, backend: comfyui, capability_exposure: default, capability_trust_tier: stable, capability_resource_tier: batch}
  - id: audio-generate
    shape: openai.audio.json
    mode: sync
    receipt_protocol: openai.audio
    strictness: exact
    lists_as_model: true
    selects: {match: {inputs: {prompt: {type: string}}, outputs: {media_type: "audio/*"}}}
    routes:
      - methods: [POST]
        canonical: /v1/audio/generate
        aliases: [/openai/v1/audio/generate]
        runtime_policy: {protocol: openai.audio, intent: audio.generate, backend: comfyui, capability_exposure: default, capability_trust_tier: stable, capability_resource_tier: batch}
  - id: videos-create
    shape: openai.video.create
    mode: job
    cancel_wait_s: 10
    receipt_allowed: true
    receipt_closes: submit
    history_facts: false
    backend_at_run: true
    refusal_bodies: {service_disabled: {message: Video generation not enabled, type: service_unavailable}}
    result_headers: {duration_adjusted: X-Duration-Adjusted}
    receipt_protocol: openai.video
    strictness: exact
    lists_as_model: true
    selects: {match: {inputs: {prompt: {type: string}}, outputs: {media_type: "video/*"}}}
    routes:
      - methods: [POST]
        canonical: /v1/videos
        aliases: [/openai/v1/videos]
        runtime_policy: {protocol: openai.video, intent: video.generate, backend: comfyui, capability_exposure: default, capability_trust_tier: stable, capability_resource_tier: expensive, job_retries: none}
  - id: videos-remix
    shape: openai.video.remix
    mode: job
    receipt_protocol: openai.video
    strictness: exact
    unconfigured: {status: 501, code: video_remix_not_configured, message: "Video remix is not configured on this gateway. Set videos.remix_workflow in proxy_config.yml to enable it."}
    selects: {match: {inputs: {prompt: {type: string}, video: {media_type: "video/*"}}, outputs: {media_type: "video/*"}}}
    routes:
      - methods: [POST]
        canonical: /v1/videos/{video_id}/remix
        aliases: ["/openai/v1/videos/{video_id}/remix"]
        runtime_policy: {protocol: openai.video, intent: video.remix, backend: comfyui, capability_exposure: default, capability_trust_tier: stable, capability_resource_tier: expensive}
  - id: videos-edit
    shape: openai.video.json_source
    mode: job
    receipt_protocol: openai.video
    unconfigured: {status: 501, code: video_remix_not_configured, message: "Video remix is not configured on this gateway. Set videos.remix_workflow in proxy_config.yml to enable it."}
    strictness: exact
    selects: {match: {inputs: {prompt: {type: string}, video: {media_type: "video/*"}}, outputs: {media_type: "video/*"}}}
    routes:
      - methods: [POST]
        canonical: /v1/videos/edits
        aliases: [/openai/v1/videos/edits]
        runtime_policy: {protocol: openai.video, intent: video.remix, backend: comfyui, capability_exposure: default, capability_trust_tier: stable, capability_resource_tier: expensive}
  - id: mesh-generations
    shape: localai.3d.generations
    mode: sync
    receipt_protocol: openai.mesh
    strictness: exact
    lists_as_model: true
    selects: {match: {outputs: {media_type: "model/gltf-binary"}}}
    routes:
      - methods: [POST]
        canonical: /v1/3d/generations
        runtime_policy: {protocol: openai.mesh, intent: mesh.generate, capability_exposure: default, capability_trust_tier: stable, capability_resource_tier: batch}
  - id: mesh-glb
    shape: multipart.glb
    mode: sync
    receipt_protocol: openai.mesh
    strictness: exact
    selects: {match: {outputs: {media_type: "model/gltf-binary"}}}
    routes:
      - methods: [POST]
        canonical: /v1/3d/generations/glb
        runtime_policy: {protocol: openai.mesh, intent: mesh.generate, capability_exposure: default, capability_trust_tier: stable, capability_resource_tier: batch}

# Compatibility mapping used after a workflow and its binding have been selected.
# New manifests declare neutral roles and input_fields; the second path reads older documents.
input_contract:
  extension_hints:
    prompt: prompt
    negative_prompt: negative_prompt
    width: size
    height: size
    length: seconds
    frame_rate: workflow configuration
    seed: seed
    image: input_reference
    image_strength: image_strength
  source_role_paths:
    - [roles, source]
    - [video, roles, source]
