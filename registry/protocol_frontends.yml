# Each frontend declares `strictness`: `exact` refuses a request field the translator cannot carry and a
# body that is not a JSON object, `lenient` drops the field and reports it (response header x-azizam-loss
# and the receipt). A route row that declares `carries: [path, ...]` is held to that list; a path names a
# nested field (`options.temperature`, `messages[].role`), and a name alone carries everything under it. A
# row without `carries` is not checked, and an identity row never declares it (it carries every field, so
# its loss report is empty). A row with `body: multipart` cannot be checked field by field; it says so, and
# declares no `carries`. The anthropic and ollama rows list what their translators read (gateway/protocols/);
# they stay `lenient`, because clients send fields these translators do not map and a refusal would break them.
# adapter_request_fields: fields an adapter may supply automatically, separately
# from workflow-owned route_inputs. An absent declaration grants no default.
records:
  - id: openai
    # Stored-receipt protocol vocabulary; owner projections read this data.
    receipt_protocols: [openai.chat, openai.responses, openai.images, openai.audio, openai.video, openai.decisions, openai.models, openai.rerank]
    name: OpenAI-compatible
    protocol: openai
    source: builtin
    editable: false
    enabled: true
    strictness: exact
    canonical: true
    routes:
      - /openai/v1
      - /v1
    intents:
      - chat.completions
      - text.completions
      - text.embeddings
      - audio.speech
      - audio.transcriptions
      - images.generate
      - images.edit
      - video.generate
    registered_routes:
      - methods: [GET]
        translator: identity
        intent: models.list
        canonical: /v1/models
        alias: /openai/v1/models
        runtime_policy: {protocol: openai.models, intent: models.list}
      - methods: [POST]
        canonical: /v1/decisions
        operation: decisions
        model_metadata:
          type: decision
          input_modalities: [text]
          output_modalities: [text]
        runtime_policy: {protocol: openai.decisions, intent: decision.systemone}
      - methods: [GET]
        translator: identity
        intent: voices.list
        canonical: /v1/voices
        alias: /openai/v1/voices
        runtime_policy: {protocol: openai.audio, intent: speech.synthesis, backend: tts, capability_exposure: default, capability_trust_tier: stable, capability_resource_tier: interactive}
      - methods: [GET]
        translator: identity
        intent: voices.list
        canonical: /v1/audio/voices
        alias: /openai/v1/audio/voices
        runtime_policy: {protocol: openai.audio, intent: speech.synthesis, backend: tts, capability_exposure: default, capability_trust_tier: stable, capability_resource_tier: interactive}
      # Custom voices and consent recordings (gateway/voices_api.py). Every one of these routes
      # enforces the policy of GET /v1/audio/voices in-handler; they carry no runtime_policy here
      # because that dict is keyed by path alone.
      - methods: [POST]
        canonical: /v1/audio/voices
        alias: /openai/v1/audio/voices
      - methods: [GET, POST, DELETE]
        canonical: /v1/audio/voices/{voice_id}
        alias: /openai/v1/audio/voices/{voice_id}
      - methods: [GET]
        canonical: /v1/audio/voices/{voice_id}/sample
        alias: /openai/v1/audio/voices/{voice_id}/sample
      - methods: [GET, POST]
        canonical: /v1/audio/voice_consents
        alias: /openai/v1/audio/voice_consents
      - methods: [GET, POST, DELETE]
        canonical: /v1/audio/voice_consents/{consent_id}
        alias: /openai/v1/audio/voice_consents/{consent_id}
      - methods: [POST]
        translator: identity
        intent: audio.speech
        canonical: /v1/audio/speech
        extensions: [com.azizam.prompts]
        extension_order: 70
        operation: speech
        model_metadata:
          type: audio
          input_modalities: [text]
          output_modalities: [audio]
        alias: /openai/v1/audio/speech
        runtime_policy: {protocol: openai.audio, intent: speech.synthesis, backend: tts, capability_exposure: default, capability_trust_tier: stable, capability_resource_tier: interactive}
      - methods: [POST]
        translator: identity
        intent: audio.transcriptions
        canonical: /v1/audio/transcriptions
        operation: transcriptions
        model_metadata:
          type: audio
          input_modalities: [audio]
          output_modalities: [text]
        alias: /openai/v1/audio/transcriptions
        body: multipart
        runtime_policy: {protocol: openai.audio, intent: speech.transcription, backend: stt, capability_exposure: default, capability_trust_tier: stable, capability_resource_tier: interactive}
      - methods: [POST]
        translator: identity
        intent: audio.translations
        canonical: /v1/audio/translations
        alias: /openai/v1/audio/translations
        body: multipart
        runtime_policy: {protocol: openai.audio, intent: speech.translation, backend: stt, capability_exposure: default, capability_trust_tier: stable, capability_resource_tier: interactive}
      - methods: [POST]
        translator: identity
        intent: audio.generate
        canonical: /v1/audio/generate
        extensions: [com.azizam.prompts, com.azizam.workflow]
        extension_order: 60
        route_inputs: [prompt, tags, lyrics, duration, seed]
        workflow_targets:
          intent_prefixes: [audio.]
          route_intent: audio.generate
        operation: audio_generate
        execution_intents: {admission: audio.generate, receipt: audio.generate}
        model_metadata:
          type: audio
          input_modalities: [text]
          output_modalities: [audio]
        alias: /openai/v1/audio/generate
        runtime_policy: {protocol: openai.audio, intent: audio.generate, backend: comfyui, capability_exposure: default, capability_trust_tier: stable, capability_resource_tier: batch}
      - methods: [GET]
        translator: identity
        intent: audio.models
        canonical: /v1/audio/models
        alias: /openai/v1/audio/models
        runtime_policy: {protocol: openai.audio, intent: models.list}
      - methods: [POST]
        translator: identity
        intent: images.generate
        canonical: /v1/images/generations
        extensions: [com.azizam.prompts, com.azizam.workflow]
        extension_order: 10
        route_inputs: [prompt, source_image, width, height]
        adapter_request_fields: [response_format]
        workflow_targets:
          intent_prefixes: [image.generate]
          route_intent: image.generate
        operation: images
        execution_intents: {admission: image.generate}
        model_metadata:
          type: image
          input_modalities: [text]
          output_modalities: [image]
        alias: /openai/v1/images/generations
      - methods: [POST]
        translator: identity
        intent: images.edit
        canonical: /v1/images/edits
        extensions: [com.azizam.prompts, com.azizam.workflow]
        extension_order: 20
        route_inputs: [prompt, source_image, width, height, mask, source_mask, mask_asset]
        adapter_request_fields: [response_format]
        workflow_targets:
          intent_prefixes: [image.edit]
          route_intent: image.edit
        operation: image_edits
        execution_intents: {admission: image.edit}
        model_metadata:
          type: image
          input_modalities: [text, image]
          output_modalities: [image]
        alias: /openai/v1/images/edits
        body: multipart
      - methods: [GET]
        translator: identity
        intent: images.content
        canonical: /v1/images/{image_id}/content
        alias: /openai/v1/images/{image_id}/content
        runtime_policy: {protocol: openai.images, intent: image.generate, backend: comfyui, capability_exposure: default, capability_trust_tier: stable, capability_resource_tier: batch}
      - methods: [GET]
        translator: identity
        intent: assets.content
        canonical: /v1/assets/{asset_id}/content
        alias: /openai/v1/assets/{asset_id}/content
        runtime_policy: {protocol: openai.images, intent: image.generate, backend: comfyui, capability_exposure: default, capability_trust_tier: stable, capability_resource_tier: batch}
      - methods: [DELETE]
        translator: identity
        intent: assets.delete
        canonical: /v1/assets/{asset_id}
      - methods: [DELETE]
        translator: identity
        intent: assets.delete
        canonical: /openai/v1/assets/{asset_id}
      # Data only: no translator, because the videos-create frontend row below serves this route. The row stays here for the
      # extension catalog and the model metadata, which read their facts from registered_routes.
      - methods: [POST]
        intent: videos.create
        canonical: /v1/videos
        extensions: [com.azizam.prompts, com.azizam.workflow]
        extension_order: 30
        route_inputs: [prompt, negative_prompt, width, height, length, frame_rate, seed, image, image_strength]
        workflow_targets:
          intent_prefixes: [video.]
          route_intent: video.generate
        operation: videos
        model_metadata:
          type: video
          input_modalities: [text]
          output_modalities: [video]
        alias: /openai/v1/videos
      - methods: [GET]
        translator: identity
        intent: videos.retrieve
        canonical: /v1/videos/{video_id}
        alias: /openai/v1/videos/{video_id}
        runtime_policy: {protocol: openai.video, intent: video.generate, backend: comfyui, capability_exposure: default, capability_trust_tier: stable, capability_resource_tier: expensive}
      - methods: [GET]
        translator: identity
        intent: videos.content
        canonical: /v1/videos/{video_id}/content
        alias: /openai/v1/videos/{video_id}/content
        runtime_policy: {protocol: openai.video, intent: video.generate, backend: comfyui, capability_exposure: default, capability_trust_tier: stable, capability_resource_tier: expensive}
      # GET /v1/videos (list) and DELETE /v1/videos/{video_id} deliberately have
      # no runtime_policy entry here: this registry's runtime_route_policy()
      # keys _RUNTIME_ROUTE_POLICY by canonical path alone (not path+method,
      # see gateway/route_registry.py), so a second entry at the already-
      # registered "/v1/videos" (POST, video.generate) or
      # "/v1/videos/{video_id}" (GET, video.generate) path would silently
      # overwrite the existing entry instead of adding a method-specific one.
      # They are NOT unguarded, though: proxy.py's videos_list/videos_delete
      # route handlers enforce the identical openai.video/video.generate
      # policy in-handler via _video_route_policy() + _enforce_runtime_route_
      # policy's policy= override, bypassing this path-keyed registry dict
      # entirely for those two routes. Fixing the registry itself to key on
      # path+method (so this override wouldn't be needed) is a separate,
      # riskier change outside this task's scope.
      - methods: [POST]
        translator: identity
        intent: videos.remix
        execution_intents: {admission: video.remix}
        canonical: /v1/videos/{video_id}/remix
        alias: /openai/v1/videos/{video_id}/remix
        runtime_policy: {protocol: openai.video, intent: video.remix, backend: comfyui, capability_exposure: default, capability_trust_tier: stable, capability_resource_tier: expensive}
      - methods: [POST]
        translator: identity
        intent: videos.edit
        execution_intents: {admission: video.edit}
        canonical: /v1/videos/edits
        alias: /openai/v1/videos/edits
        runtime_policy: {protocol: openai.video, intent: video.remix, backend: comfyui, capability_exposure: default, capability_trust_tier: stable, capability_resource_tier: expensive}
      # /rerank and /v2/rerank are handled in-handler with the policy of /v1/rerank. rerank is retrieval
      # infrastructure like embeddings, so it shares the text.embeddings intent: a key that may embed may rerank.
      - methods: [POST]
        translator: identity
        intent: rerank
        canonical: /v1/rerank
        operation: rerank
        model_metadata:
          type: reranking
          input_modalities: [text]
          output_modalities: [text]
        alias: /openai/v1/rerank
        runtime_policy: {protocol: openai.rerank, intent: text.embeddings, backend: rerank, capability_exposure: default, capability_trust_tier: stable, capability_resource_tier: interactive}
      - methods: [POST]
        translator: identity
        intent: videos.extend
        execution_intents: {admission: video.extend, receipt: video.extend}
        canonical: /v1/videos/extensions
        extensions: [com.azizam.prompts]
        extension_order: 40
        alias: /openai/v1/videos/extensions
        runtime_policy: {protocol: openai.video, intent: video.generate, backend: comfyui, capability_exposure: default, capability_trust_tier: stable, capability_resource_tier: expensive}
      - methods: [POST]
        translator: identity
        intent: responses.create
        canonical: /v1/responses
        extensions: [com.azizam.prompts, com.azizam.chat, com.azizam.routing]
        extension_order: 80
        alias: /openai/v1/responses
      - methods: [GET]
        translator: identity
        intent: responses.retrieve
        canonical: /v1/responses/{response_id}
        alias: /openai/v1/responses/{response_id}
      - methods: [DELETE]
        translator: identity
        intent: responses.delete
        canonical: /v1/responses/{response_id}
        alias: /openai/v1/responses/{response_id}
      - methods: [POST]
        translator: identity
        intent: chat.completions
        canonical: /v1/chat/completions
        extensions: [com.azizam.chat, com.azizam.routing]
        extension_order: 75
        operation: chat
        model_metadata:
          type: language
          input_modalities: [text]
          output_modalities: [text]
        alias: /openai/v1/chat/completions
        azizam_policy: {protocol: openai.chat, intent: chat.completions}
      - methods: [POST]
        translator: identity
        intent: text.completions
        canonical: /v1/completions
        alias: /openai/v1/completions
        azizam_policy: {protocol: openai.chat, intent: text.completions}
      - methods: [POST]
        translator: identity
        intent: text.embeddings
        canonical: /v1/embeddings
        operation: embeddings
        model_metadata:
          type: embedding
          input_modalities: [text]
          output_modalities: [embedding]
        alias: /openai/v1/embeddings
        azizam_policy: {protocol: openai.embeddings, intent: text.embeddings}
      - methods: [GET]
        canonical: /v1/videos
        translator: identity
        intent: videos.list
      - methods: [GET]
        canonical: /openai/v1/videos
        translator: identity
        intent: videos.list
      - methods: [DELETE]
        canonical: /v1/videos/{video_id}
        translator: identity
        intent: videos.delete
      - methods: [DELETE]
        canonical: /openai/v1/videos/{video_id}
        translator: identity
        intent: videos.delete
      - methods: [GET]
        canonical: /v1/models/{model_id:path}
        translator: identity
        intent: models.retrieve
      - methods: [GET]
        canonical: /openai/v1/models/{model_id:path}
        translator: identity
        intent: models.retrieve
      - methods: [POST]
        canonical: /v1/images/variations
        translator: identity
        intent: images.variations
        adapter_request_fields: [response_format]
        execution_intents: {admission: image.variation}
        body: multipart
      - methods: [POST]
        canonical: /openai/v1/images/variations
        translator: identity
        intent: images.variations
        adapter_request_fields: [response_format]
        execution_intents: {admission: image.variation}
        body: multipart
      - methods: [POST]
        canonical: /v2/rerank
        translator: identity
        intent: rerank.v2
      - methods: [POST]
        canonical: /rerank
        translator: identity
        intent: rerank.root
      - methods: [GET]
        canonical: /v1/responses/{response_id}/input_items
        translator: identity
        intent: responses.input_items
      - methods: [GET]
        canonical: /openai/v1/responses/{response_id}/input_items
        translator: identity
        intent: responses.input_items
      - methods: [POST]
        canonical: /v1/responses/input_tokens
        translator: identity
        intent: responses.input_tokens
      - methods: [POST]
        canonical: /openai/v1/responses/input_tokens
        translator: identity
        intent: responses.input_tokens
      - methods: [POST]
        canonical: /v1/responses/{response_id}/cancel
        translator: identity
        intent: responses.cancel
      - methods: [POST]
        canonical: /openai/v1/responses/{response_id}/cancel
        translator: identity
        intent: responses.cancel
      - methods: [GET, POST, PUT, DELETE, PATCH]
        canonical: /v1/assistants{rest:path}
        translator: identity
        intent: unsupported.assistants
      - methods: [GET, POST, PUT, DELETE, PATCH]
        canonical: /openai/v1/assistants{rest:path}
        translator: identity
        intent: unsupported.assistants
      - methods: [GET, POST, DELETE]
        canonical: /v1/files{rest:path}
        translator: identity
        intent: unsupported.files
      - methods: [GET, POST, DELETE]
        canonical: /openai/v1/files{rest:path}
        translator: identity
        intent: unsupported.files
      - methods: [GET, POST, DELETE]
        canonical: /v1/batches{rest:path}
        translator: identity
        intent: unsupported.batches
      - methods: [GET, POST, DELETE]
        canonical: /openai/v1/batches{rest:path}
        translator: identity
        intent: unsupported.batches
      - methods: [GET, POST, DELETE]
        canonical: /v1/fine_tuning{rest:path}
        translator: identity
        intent: unsupported.fine_tuning
      - methods: [GET, POST, DELETE]
        canonical: /openai/v1/fine_tuning{rest:path}
        translator: identity
        intent: unsupported.fine_tuning
      - methods: [GET, POST, DELETE]
        canonical: /v1/realtime{rest:path}
        translator: identity
        intent: unsupported.realtime
      - methods: [GET, POST, DELETE]
        canonical: /openai/v1/realtime{rest:path}
        translator: identity
        intent: unsupported.realtime
      - methods: [WEBSOCKET]
        canonical: /v1/realtime
        translator: realtime
        intent: realtime.session
      - methods: [WEBSOCKET]
        canonical: /openai/v1/realtime
        translator: realtime
        intent: realtime.session
    public_discovery:
      compatibility: openai-compatible
      default: true
      base_url_recipe: "{base_url}/openai/v1"
      recipe:
        canonical_base_url: /openai/v1
        compatibility_base_url: /v1
        auth: "Authorization: Bearer $AZIZAM_API_KEY"
        models_url: /openai/v1/models
        chat_url: /openai/v1/chat/completions
      streaming:
        chat_completions: true
        responses: true
        images: false
        audio: false
      endpoints:
        - /openai/v1/models
        - /openai/v1/chat/completions
        - /openai/v1/completions
        - /openai/v1/embeddings
        - /openai/v1/rerank
        - /openai/v1/responses
        - /openai/v1/images/generations
        - /openai/v1/images/edits
        - /openai/v1/images/variations
        - /openai/v1/audio/speech
        - /openai/v1/audio/transcriptions
        - /openai/v1/audio/translations
        - /openai/v1/assistants
        - /openai/v1/files
        - /openai/v1/batches
        - /openai/v1/fine_tuning/jobs
        - /openai/v1/realtime
        - /openai/v1/videos
        - /v1/models
        - /v1/decisions
        - /v1/chat/completions
        - /v1/completions
        - /v1/embeddings
        - /v1/rerank
        - /v2/rerank
        - /rerank
        - /v1/responses
        - /v1/images/generations
        - /v1/images/edits
        - /v1/images/variations
        - /v1/audio/speech
        - /v1/audio/transcriptions
        - /v1/audio/translations
        - /v1/assistants
        - /v1/files
        - /v1/batches
        - /v1/fine_tuning/jobs
        - /v1/realtime
        - /v1/videos
      limits:
        - audio translations are registered but return an OpenAI-shaped unsupported_audio_translation error unless the local STT backend declares translation support
        - images variations route through a configurable edit-capable workflow (images.variations.default_workflow) with a fixed generic prompt, since there is no local model dedicated to variations
        - assistants, files, batches, fine-tuning, and realtime routes are registered but return OpenAI-shaped unsupported_operation errors
  - id: typesafe
    # Stored-receipt protocol vocabulary; owner projections read this data.
    receipt_protocols: [typesafe.systemone, typesafe.models]
    name: TypeSafe-compatible decisions
    protocol: typesafe
    source: builtin
    editable: false
    enabled: true
    strictness: exact
    canonical: true
    routes: [/typesafe/v1]
    intents: [decision.systemone, models.list]
    registered_routes:
      - methods: [POST]
        canonical: /v1/systemone
        alias: /typesafe/v1/systemone
        runtime_policy: {protocol: typesafe.systemone, intent: decision.systemone}
      - methods: [GET]
        canonical: /typesafe/v1/models
        runtime_policy: {protocol: typesafe.models, intent: models.list}
    public_discovery:
      canonical_base_path: /typesafe/v1
      compatibility: "TypeSafe System One; Choice, Score and Noul. Local probabilities; no streaming."
      streaming: false
      base_url_recipe: "Set TYPESAFE_BASE_URL to the gateway root plus /typesafe."
      endpoints: [/typesafe/v1/systemone, /typesafe/v1/models, /v1/systemone]
  - id: anthropic
    # Stored-receipt protocol vocabulary; owner projections read this data.
    receipt_protocols: [anthropic.messages]
    name: Anthropic Messages-compatible
    protocol: anthropic
    source: builtin
    editable: false
    enabled: true
    strictness: lenient
    canonical: true
    routes:
      - /anthropic/v1
      - /v1/messages
    intents:
      - chat.completions
    registered_routes:
      - methods: [POST]
        translator: anthropic
        intent: chat.completions
        canonical: /v1/messages
        alias: /anthropic/v1/messages
        carries:
          - model
          - max_tokens
          - stream
          - temperature
          - top_p
          - top_k
          - stop_sequences
          - system
          - "messages[].role"
          - "messages[].content"
          - "tools[].type"
          - "tools[].name"
          - "tools[].description"
          - "tools[].input_schema"
          - "tool_choice.type"
          - "tool_choice.name"
          - "tool_choice.disable_parallel_tool_use"
          - "thinking.type"
          - "thinking.budget_tokens"
          - "output_config.effort"
          - "metadata.user_id"
      - methods: [POST]
        translator: anthropic
        intent: tokens.count
        canonical: /v1/messages/count_tokens
        alias: /anthropic/v1/messages/count_tokens
        carries:
          - model
          - system
          - "messages[].role"
          - "messages[].content"
          - "tools[].type"
          - "tools[].name"
          - "tools[].description"
          - "tools[].input_schema"
          - "tool_choice.type"
          - "tool_choice.name"
          - "tool_choice.disable_parallel_tool_use"
          - "thinking.type"
          - "thinking.budget_tokens"
          - "output_config.effort"
      - methods: [GET]
        canonical: /anthropic/v1/models
        translator: anthropic
        intent: models.list
      - methods: [GET]
        canonical: /anthropic/v1/models/{model_id:path}
        translator: anthropic
        intent: models.retrieve
    public_discovery:
      compatibility: anthropic-messages-subset
      default: false
      base_url_recipe: "{base_url}/anthropic"
      recipe:
        canonical_base_url: /anthropic
        messages_url: /anthropic/v1/messages
        auth: "x-api-key or Authorization bearer accepted by SDK/client; store the opk token outside prompts and config checked into git"
        notes:
          - OpenAI-style /v1/messages remains a legacy convenience alias; prefer /anthropic/v1/messages.
          - Image, document, thinking, prompt-cache, and beta-header semantics are not represented.
      streaming:
        messages: true
      endpoints:
        - /anthropic/v1/models
        - /anthropic/v1/messages
        - /anthropic/v1/messages/count_tokens
        - /v1/messages
        - /v1/messages/count_tokens
      limits:
        - image blocks are translated to gateway multimodal chat; document/thinking blocks are rejected
        - /v1/models remains OpenAI-shaped; use /anthropic/v1/models for Anthropic ModelInfoList
        - count_tokens is a best-effort gateway estimator
  - id: ollama
    # Stored-receipt protocol vocabulary; owner projections read this data.
    receipt_protocols: [ollama.chat, ollama.generate, ollama.embeddings, ollama.models, ollama.tags]
    name: Ollama-compatible
    protocol: ollama
    source: builtin
    editable: false
    enabled: true
    strictness: lenient
    canonical: true
    routes:
      - /ollama/api
      - /api
    intents:
      - chat.completions
      - text.completions
      - text.embeddings
    registered_routes:
      - methods: [POST]
        translator: ollama
        intent: chat.completions
        canonical: /api/chat
        alias: /ollama/api/chat
        carries:
          - model
          - stream
          - format
          - think
          - keep_alive
