records:
  - id: openai
    name: OpenAI-compatible
    protocol: openai
    source: builtin
    editable: false
    enabled: true
    canonical: true
    routes:
      - /openai/v1
      - /v1
    intents:
      - chat.completions
      - text.completions
      - text.embeddings
      - audio.speech
      - audio.transcriptions
      - images.generate
      - images.edit
      - video.generate
    registered_routes:
      - methods: [GET]
        canonical: /v1/models
        alias: /openai/v1/models
        runtime_policy: {protocol: openai.models, intent: models.list}
      - methods: [POST]
        canonical: /v1/decisions
        runtime_policy: {protocol: openai.decisions, intent: decision.systemone}
      - methods: [GET]
        canonical: /v1/voices
        alias: /openai/v1/voices
        runtime_policy: {protocol: openai.audio, intent: speech.synthesis, backend: tts, capability_exposure: default, capability_trust_tier: stable, capability_resource_tier: interactive}
      - methods: [GET]
        canonical: /v1/audio/voices
        alias: /openai/v1/audio/voices
        runtime_policy: {protocol: openai.audio, intent: speech.synthesis, backend: tts, capability_exposure: default, capability_trust_tier: stable, capability_resource_tier: interactive}
      # Custom voices and consent recordings (gateway/voices_api.py). Every one of these routes
      # enforces the policy of GET /v1/audio/voices in-handler; they carry no runtime_policy here
      # because that dict is keyed by path alone.
      - methods: [POST]
        canonical: /v1/audio/voices
        alias: /openai/v1/audio/voices
      - methods: [GET, POST, DELETE]
        canonical: /v1/audio/voices/{voice_id}
        alias: /openai/v1/audio/voices/{voice_id}
      - methods: [GET]
        canonical: /v1/audio/voices/{voice_id}/sample
        alias: /openai/v1/audio/voices/{voice_id}/sample
      - methods: [GET, POST]
        canonical: /v1/audio/voice_consents
        alias: /openai/v1/audio/voice_consents
      - methods: [GET, POST, DELETE]
        canonical: /v1/audio/voice_consents/{consent_id}
        alias: /openai/v1/audio/voice_consents/{consent_id}
      - methods: [POST]
        canonical: /v1/audio/speech
        alias: /openai/v1/audio/speech
        runtime_policy: {protocol: openai.audio, intent: speech.synthesis, backend: tts, capability_exposure: default, capability_trust_tier: stable, capability_resource_tier: interactive}
      - methods: [POST]
        canonical: /v1/audio/transcriptions
        alias: /openai/v1/audio/transcriptions
        runtime_policy: {protocol: openai.audio, intent: speech.transcription, backend: stt, capability_exposure: default, capability_trust_tier: stable, capability_resource_tier: interactive}
      - methods: [POST]
        canonical: /v1/audio/translations
        alias: /openai/v1/audio/translations
        runtime_policy: {protocol: openai.audio, intent: speech.translation, backend: stt, capability_exposure: default, capability_trust_tier: stable, capability_resource_tier: interactive}
      - methods: [POST]
        canonical: /v1/audio/generate
        alias: /openai/v1/audio/generate
        runtime_policy: {protocol: openai.audio, intent: audio.generate, backend: comfyui, capability_exposure: default, capability_trust_tier: stable, capability_resource_tier: batch}
      - methods: [GET]
        canonical: /v1/audio/models
        alias: /openai/v1/audio/models
        runtime_policy: {protocol: openai.audio, intent: models.list}
      - methods: [POST]
        canonical: /v1/images/generations
        alias: /openai/v1/images/generations
      - methods: [POST]
        canonical: /v1/images/edits
        alias: /openai/v1/images/edits
      - methods: [GET]
        canonical: /v1/images/{image_id}/content
        alias: /openai/v1/images/{image_id}/content
        runtime_policy: {protocol: openai.images, intent: image.generate, backend: comfyui, capability_exposure: default, capability_trust_tier: stable, capability_resource_tier: batch}
      - methods: [GET]
        canonical: /v1/assets/{asset_id}/content
        alias: /openai/v1/assets/{asset_id}/content
        runtime_policy: {protocol: openai.images, intent: image.generate, backend: comfyui, capability_exposure: default, capability_trust_tier: stable, capability_resource_tier: batch}
      - methods: [POST]
        canonical: /v1/videos
        alias: /openai/v1/videos
        runtime_policy: {protocol: openai.video, intent: video.generate, backend: comfyui, capability_exposure: default, capability_trust_tier: stable, capability_resource_tier: expensive}
      - methods: [GET]
        canonical: /v1/videos/{video_id}
        alias: /openai/v1/videos/{video_id}
        runtime_policy: {protocol: openai.video, intent: video.generate, backend: comfyui, capability_exposure: default, capability_trust_tier: stable, capability_resource_tier: expensive}
      - methods: [GET]
        canonical: /v1/videos/{video_id}/content
        alias: /openai/v1/videos/{video_id}/content
        runtime_policy: {protocol: openai.video, intent: video.generate, backend: comfyui, capability_exposure: default, capability_trust_tier: stable, capability_resource_tier: expensive}
      # GET /v1/videos (list) and DELETE /v1/videos/{video_id} deliberately have
      # no runtime_policy entry here: this registry's runtime_route_policy()
      # keys _RUNTIME_ROUTE_POLICY by canonical path alone (not path+method,
      # see gateway/route_registry.py), so a second entry at the already-
      # registered "/v1/videos" (POST, video.generate) or
      # "/v1/videos/{video_id}" (GET, video.generate) path would silently
      # overwrite the existing entry instead of adding a method-specific one.
      # They are NOT unguarded, though: proxy.py's videos_list/videos_delete
      # route handlers enforce the identical openai.video/video.generate
      # policy in-handler via _video_route_policy() + _enforce_runtime_route_
      # policy's policy= override, bypassing this path-keyed registry dict
      # entirely for those two routes. Fixing the registry itself to key on
      # path+method (so this override wouldn't be needed) is a separate,
      # riskier change outside this task's scope.
      - methods: [POST]
        canonical: /v1/videos/{video_id}/remix
        alias: /openai/v1/videos/{video_id}/remix
        runtime_policy: {protocol: openai.video, intent: video.remix, backend: comfyui, capability_exposure: default, capability_trust_tier: stable, capability_resource_tier: expensive}
      - methods: [POST]
        canonical: /v1/videos/edits
        alias: /openai/v1/videos/edits
        runtime_policy: {protocol: openai.video, intent: video.remix, backend: comfyui, capability_exposure: default, capability_trust_tier: stable, capability_resource_tier: expensive}
      # /rerank and /v2/rerank are handled in-handler with the policy of /v1/rerank. rerank is retrieval
      # infrastructure like embeddings, so it shares the text.embeddings intent: a key that may embed may rerank.
      - methods: [POST]
        canonical: /v1/rerank
        alias: /openai/v1/rerank
        runtime_policy: {protocol: openai.rerank, intent: text.embeddings, backend: rerank, capability_exposure: default, capability_trust_tier: stable, capability_resource_tier: interactive}
      - methods: [POST]
        canonical: /v1/videos/extensions
        alias: /openai/v1/videos/extensions
        runtime_policy: {protocol: openai.video, intent: video.generate, backend: comfyui, capability_exposure: default, capability_trust_tier: stable, capability_resource_tier: expensive}
      - methods: [POST]
        canonical: /v1/responses
        alias: /openai/v1/responses
      - methods: [GET]
        canonical: /v1/responses/{response_id}
        alias: /openai/v1/responses/{response_id}
      - methods: [DELETE]
        canonical: /v1/responses/{response_id}
        alias: /openai/v1/responses/{response_id}
      - methods: [POST]
        canonical: /v1/chat/completions
        alias: /openai/v1/chat/completions
        azizam_policy: {protocol: openai.chat, intent: chat.completions}
      - methods: [POST]
        canonical: /v1/completions
        alias: /openai/v1/completions
        azizam_policy: {protocol: openai.chat, intent: text.completions}
      - methods: [POST]
        canonical: /v1/embeddings
        alias: /openai/v1/embeddings
        azizam_policy: {protocol: openai.embeddings, intent: text.embeddings}
    public_discovery:
      compatibility: openai-compatible
      default: true
      base_url_recipe: "{base_url}/openai/v1"
      recipe:
        canonical_base_url: /openai/v1
        compatibility_base_url: /v1
        auth: "Authorization: Bearer $AZIZAM_API_KEY"
        models_url: /openai/v1/models
        chat_url: /openai/v1/chat/completions
      streaming:
        chat_completions: true
        responses: true
        images: false
        audio: false
      endpoints:
        - /openai/v1/models
        - /openai/v1/chat/completions
        - /openai/v1/completions
        - /openai/v1/embeddings
        - /openai/v1/rerank
        - /openai/v1/responses
        - /openai/v1/images/generations
        - /openai/v1/images/edits
        - /openai/v1/images/variations
        - /openai/v1/audio/speech
        - /openai/v1/audio/transcriptions
        - /openai/v1/audio/translations
        - /openai/v1/assistants
        - /openai/v1/files
        - /openai/v1/batches
        - /openai/v1/fine_tuning/jobs
        - /openai/v1/realtime
        - /openai/v1/videos
        - /v1/models
        - /v1/decisions
        - /v1/chat/completions
        - /v1/completions
        - /v1/embeddings
        - /v1/rerank
        - /v2/rerank
        - /rerank
        - /v1/responses
        - /v1/images/generations
        - /v1/images/edits
        - /v1/images/variations
        - /v1/audio/speech
        - /v1/audio/transcriptions
        - /v1/audio/translations
        - /v1/assistants
        - /v1/files
        - /v1/batches
        - /v1/fine_tuning/jobs
        - /v1/realtime
        - /v1/videos
      limits:
        - audio translations are registered but return an OpenAI-shaped unsupported_audio_translation error unless the local STT backend declares translation support
        - images variations route through a configurable edit-capable workflow (images.variations.default_workflow) with a fixed generic prompt, since there is no local model dedicated to variations
        - assistants, files, batches, fine-tuning, and realtime routes are registered but return OpenAI-shaped unsupported_operation errors
  - id: typesafe
    name: TypeSafe-compatible decisions
    protocol: typesafe
    source: builtin
    editable: false
    enabled: true
    canonical: true
    routes: [/typesafe/v1]
    intents: [decision.systemone, models.list]
    registered_routes:
      - methods: [POST]
        canonical: /v1/systemone
        alias: /typesafe/v1/systemone
        runtime_policy: {protocol: typesafe.systemone, intent: decision.systemone}
      - methods: [GET]
        canonical: /typesafe/v1/models
        runtime_policy: {protocol: typesafe.models, intent: models.list}
    public_discovery:
      canonical_base_path: /typesafe/v1
      compatibility: "TypeSafe System One; Choice, Score and Noul. Local probabilities; no streaming."
      streaming: false
      base_url_recipe: "Set TYPESAFE_BASE_URL to the gateway root plus /typesafe."
      endpoints: [/typesafe/v1/systemone, /typesafe/v1/models, /v1/systemone]
  - id: anthropic
    name: Anthropic Messages-compatible
    protocol: anthropic
    source: builtin
    editable: false
    enabled: true
    canonical: true
    routes:
      - /anthropic/v1
      - /v1/messages
    intents:
      - chat.completions
    registered_routes:
      - methods: [POST]
        canonical: /v1/messages
        alias: /anthropic/v1/messages
      - methods: [POST]
        canonical: /v1/messages/count_tokens
        alias: /anthropic/v1/messages/count_tokens
    public_discovery:
      compatibility: anthropic-messages-subset
      default: false
      base_url_recipe: "{base_url}/anthropic"
      recipe:
        canonical_base_url: /anthropic
        messages_url: /anthropic/v1/messages
        auth: "x-api-key or Authorization bearer accepted by SDK/client; store the opk token outside prompts and config checked into git"
        notes:
          - OpenAI-style /v1/messages remains a legacy convenience alias; prefer /anthropic/v1/messages.
          - Image, document, thinking, prompt-cache, and beta-header semantics are not represented.
      streaming:
        messages: true
      endpoints:
        - /anthropic/v1/models
        - /anthropic/v1/messages
        - /anthropic/v1/messages/count_tokens
        - /v1/messages
        - /v1/messages/count_tokens
      limits:
        - image blocks are translated to gateway multimodal chat; document/thinking blocks are rejected
        - /v1/models remains OpenAI-shaped; use /anthropic/v1/models for Anthropic ModelInfoList
        - count_tokens is a best-effort gateway estimator
  - id: ollama
    name: Ollama-compatible
    protocol: ollama
    source: builtin
    editable: false
    enabled: true
    canonical: true
    routes:
      - /ollama/api
      - /api
    intents:
      - chat.completions
      - text.completions
      - text.embeddings
    registered_routes:
      - methods: [POST]
        canonical: /api/chat
        alias: /ollama/api/chat
      - methods: [POST]
        canonical: /api/generate
        alias: /ollama/api/generate
      - methods: [POST]
        canonical: /api/embed
        alias: /ollama/api/embed
      - methods: [POST]
        canonical: /api/embeddings
        alias: /ollama/api/embeddings
      - methods: [GET]
        canonical: /api/tags
        alias: /ollama/api/tags
      - methods: [POST]
        canonical: /api/show
        alias: /ollama/api/show
      - methods: [GET]
        canonical: /api/ps
        alias: /ollama/api/ps
      - methods: [GET]
        canonical: /api/version
        alias: /ollama/api/version
      - methods: [POST]
        canonical: /api/create
        alias: /ollama/api/create
      - methods: [POST]
        canonical: /api/copy
        alias: /ollama/api/copy
      - methods: [POST]
        canonical: /api/pull
        alias: /ollama/api/pull
      - methods: [POST]
        canonical: /api/push
        alias: /ollama/api/push
      - methods: [DELETE]
        canonical: /api/delete
        alias: /ollama/api/delete
    public_discovery:
      compatibility: ollama-subset
      default: false
      base_url_recipe: "{base_url}/ollama"
      recipe:
        canonical_base_url: /ollama
        compatibility_base_url: /
        tags_url: /ollama/api/tags
        chat_url: /ollama/api/chat
        auth: "Authorization: Bearer $AZIZAM_API_KEY; discovery needs a key like every other route"
        unsupported_lifecycle:
          - create
          - pull
          - push
          - copy
          - delete
        unsupported_lifecycle_note: Lifecycle routes return unsupported_operation and never mutate local model files.
      streaming:
        chat: true
        generate: true
        embed: false
      endpoints:
        - /ollama/api/tags
        - /ollama/api/chat
        - /ollama/api/generate
        - /ollama/api/embed
        - /ollama/api/embeddings
        - /ollama/api/show
        - /ollama/api/ps
        - /ollama/api/version
        - /ollama/api/create
        - /ollama/api/copy
        - /ollama/api/pull
        - /ollama/api/push
        - /ollama/api/delete
        - /api/tags
        - /api/chat
        - /api/generate
        - /api/embed
        - /api/embeddings
        - /api/show
        - /api/ps
        - /api/version
        - /api/create
        - /api/copy
        - /api/pull
        - /api/push
        - /api/delete
      limits:
        - model catalog/status endpoints are projected from the gateway; model mutation endpoints return unsupported_operation
        - model lifecycle endpoints create/pull/push/copy/delete do not mutate local model files through the gateway
        - backend-native options without portable meaning are rejected
  - id: gateway
    name: Gateway-native
    protocol: gateway
    source: builtin
    editable: false
    enabled: true
    canonical: true
    routes:
      - /gateway/v1
    intents:
      - capabilities.list
      - providers.native
      - jobs.create
      - assets.read
    registered_routes:
      - methods: [GET]
        canonical: /gateway/v1/media/jobs/{job_id}/content
        runtime_policy: {protocol: openai.images, intent: image.generate, backend: comfyui, capability_exposure: default, capability_trust_tier: stable, capability_resource_tier: batch}
    asset_content_policies:
      img: {protocol: openai.images, intent: image.generate, backend: comfyui, capability_exposure: default, capability_trust_tier: stable, capability_resource_tier: batch}
      aud: {protocol: openai.audio, intent: audio.generate, backend: comfyui, capability_exposure: default, capability_trust_tier: stable, capability_resource_tier: batch}
      vid: {protocol: openai.video, intent: video.generate, backend: comfyui, capability_exposure: default, capability_trust_tier: stable, capability_resource_tier: expensive}
    public_discovery:
      compatibility: azizam-native
      default: false
      base_url_recipe: "{base_url}/gateway/v1"
      recipe:
        canonical_base_url: /gateway/v1
        capabilities_url: /gateway/v1/capabilities
        providers_url: /gateway/v1/providers
        auth: "Authorization: Bearer $AZIZAM_API_KEY"
      streaming: {}
      endpoints:
        - /gateway/v1/capabilities
        - /gateway/v1/workflows
        - /gateway/v1/receipts
        - /gateway/v1/media/jobs
        - /gateway/v1/assets/{asset_id}
        - /gateway/v1/assets/{asset_id}/content
        - /openai/v1/audio/generate
        - /openai/v1/audio/models
        - /v1/audio/generate
        - /v1/audio/models
        - /gateway/v1/providers
        - /gateway/v1/providers/{provider}
      limits:
        - /openai/v1/audio/generate and /v1/audio/generate are gateway-native music/SFX generation routes, not OpenAI SDK-compatible audio endpoints
        - signed asset content URLs are bearerless capability URLs until expiry; asset metadata and input reuse remain API-key scoped
  - id: provider-native
    name: Provider-native passthrough
    protocol: provider-native
    source: builtin
    editable: false
    enabled: true
    canonical: false
    routes:
      - /gateway/v1/providers/{provider}
    intents:
      - provider.native
    public_discovery:
      base_path: /gateway/v1/providers
      compatibility: provider-native-passthrough
      default: false
      base_url_recipe: "{base_url}/gateway/v1/providers/{provider}"
      recipe:
        discovery_url: /gateway/v1/providers
        provider_url: /gateway/v1/providers/{provider}
        passthrough_url_template: /gateway/v1/providers/{provider}/{path...}
        auth: "Authorization: Bearer $AZIZAM_API_KEY plus App profile native_passthrough permission"
        discovery_facts: Provider rows include caller-projected native_passthrough policy, allowed operations/backends, required gateway auth, non-secret downstream auth classes when known, and live enabled state.
        collision_strategy: Canonical protocol frontends own /openai/v1, /anthropic/v1, /ollama/api, /v1, and /api. Provider-native passthrough is only under /gateway/v1/providers/{provider}/{path...}.
      streaming: {}
      endpoints:
        - /gateway/v1/providers
        - /gateway/v1/providers/{provider}
        - /gateway/v1/providers/{provider}/{path...}
      policy:
        - requires provider-native protocol access
        - requires native_passthrough enabled for the App profile
        - provider and operation must be allowed by policy
        - no root catch-all or legacy root Tabby shim
        - protocol frontend path collisions stay owned by the frontend; use /gateway/v1/providers/{provider}/{path...} for raw provider-native paths
