# Request retention: the bundled defaults of the contract
# (docs/design/REQUEST_RETENTION.md section 3.2).
#
# This is data. gateway/retention.py loads and validates it and holds no default of its own;
# Python and the web read these values through the settings API. A missing or invalid file
# stops the gateway at startup with the rule it broke. registry/retention.schema.json is the
# closed schema. The owner's household policy (operator setting "retention") and each member's
# choice can only narrow what this file allows.
format_version: 1

# The shared vocabulary of how long content is kept. Seconds are data, not code; null means
# no expiry.
retention_choices:
  never: null
  3_months: 7776000
  1_year: 31536000

# Evidence is local data. Reading the ledger never fetches a source URL.
stale_after_days: 180

# Copies outside the gateway's own request-history writer. These are shown even
# when that writer is off. The operator must check the effective deployment.
system_facts:
  gateway:
    name: Azizam
    facts:
      - id: gateway-temporary-copies
        holds: request bodies while a request runs
        where: process memory and temporary workspaces
        how_long: during execution; host swap, hibernation, and crash-dump lifetimes depend on the machine
        default: conditional
        condition: host swap, hibernation, and crash capture settings
        reach: the machine owner and anyone with access to its files or memory image
        control: review swap, hibernation, and crash-dump settings on the host
        evidence_url: https://man7.org/linux/man-pages/man2/mlock.2.html
        checked: '2026-10-19'
        confidence: documented
      - id: gateway-crash-dumps
        holds: a process-memory image that may contain request content
        where: systemd crash dump file and journal entry
        how_long: according to the host's separate dump and journal cleanup settings
        default: conditional
        condition: a permitted crash dump handled by systemd-coredump
        reach: people who can read the host's crash dumps or journal
        control: review Storage and ProcessSizeMax in systemd-coredump and host core limits
        evidence_url: https://www.freedesktop.org/software/systemd/man/latest/systemd-coredump.html
        checked: '2026-10-19'
        confidence: documented
  litellm:
    name: LiteLLM
    facts:
      - id: litellm-spend-content
        holds: request and response content if spend-content storage is enabled
        where: LiteLLM spend rows
        how_long: unknown; cleanup requires a separately configured retention period
        default: 'off'
        condition: store_prompts_in_spend_logs or its environment override is enabled
        reach: LiteLLM administrators and anyone with access to its spend database
        control: inspect effective UI, environment and file settings; disable content storage and delete old rows separately
        evidence_url: https://docs.litellm.ai/docs/proxy/ui_logs
        checked: '2026-10-19'
        confidence: documented
      - id: litellm-error-rows
        holds: errors and metadata that may include request content
        where: LiteLLM error rows and downstream logs
        how_long: unknown
        default: conditional
        condition: error logging is enabled; whether a given error echoes content depends on the failure
        reach: LiteLLM administrators and downstream log readers
        control: inspect disable_error_logs and effective diagnostic logging; check downstream collectors
        evidence_url: https://docs.litellm.ai/docs/proxy/config_settings
        checked: '2026-10-19'
        confidence: documented
      - id: litellm-callbacks
        holds: inputs and outputs sent to configured callbacks
        where: callback destinations outside LiteLLM
        how_long: unknown; each destination has its own retention
        default: 'off'
        condition: success, failure, general or service callbacks are configured
        reach: people authorized at each configured callback destination
        control: inspect effective callback settings and message omission at each destination
        evidence_url: https://docs.litellm.ai/docs/proxy/logging
        checked: '2026-10-19'
        confidence: documented
      - id: litellm-cache
        holds: requests and responses used for response reuse
        where: LiteLLM exact or semantic cache backend
        how_long: unknown; depends on the selected cache backend and its TTL
        default: 'off'
        condition: a LiteLLM or router cache is enabled
        reach: people authorized to read the selected cache backend
        control: inspect both LiteLLM and router cache settings and remove existing cache entries separately
        evidence_url: https://docs.litellm.ai/docs/proxy/caching
        checked: '2026-10-19'
        confidence: documented
      - id: litellm-lens
        holds: trace inputs, outputs and attributes
        where: LiteLLM Lens traces
        how_long: unknown
        default: conditional
        condition: Lens ingestion or tracing integration is enabled
        reach: administrators and viewers of all traces; other permitted users may read their own or team traces
        control: inspect Lens ingestion and access settings independently from spend logging
        evidence_url: https://docs.litellm.ai/docs/proxy/lens/api
        checked: '2026-10-19'
        confidence: documented

# Evidence profiles for destinations that are not executable provider presets.
# An owner can assign a provider_id to a service and override these facts in DB.
provider_fact_catalog:
  bedrock:
    - id: bedrock-invocation-logging
      holds: supported request and response bodies and invocation metadata
      where: customer CloudWatch Logs or S3 destinations
      how_long: CloudWatch defaults to indefinite; S3 follows its own object lifecycle
      default: 'off'
      condition: model invocation logging is enabled for the account and Region
      reach: people with effective destination IAM, bucket, log-group and encryption permissions
      control: disable future invocation logging and set separate CloudWatch and S3 retention
      evidence_url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-invocation-logging.html
      checked: '2026-10-19'
      confidence: documented
  vertex:
    - id: vertex-implicit-cache
      holds: input, output and derived cache state for supported models
      where: project-isolated RAM cache and possibly durable derived-KV cache
      how_long: deleted within 24 hours of writing
      default: 'on'
      condition: a supported model is used; durable caching occurs when RAM capacity is exceeded
      reach: project-isolated service cache; effective staff access is unknown
      control: set disableCache for both caches; EPHEMERAL removes only durable caching
      evidence_url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/resources/zero-data-retention
      checked: '2026-10-19'
      confidence: documented
    - id: vertex-request-logging
      holds: request and response JSON subject to size limits
      where: project BigQuery logging destination
      how_long: determined by the BigQuery table expiry setting
      default: 'off'
      condition: request-response logging is enabled
      reach: people with effective project and BigQuery permissions
      control: disable future logging and inspect BigQuery retention and existing rows
      evidence_url: https://docs.cloud.google.com/gemini-enterprise-agent-platform/resources/zero-data-retention
      checked: '2026-10-19'
      confidence: documented
  langsmith:
    - id: langsmith-traces
      holds: traced inputs, outputs and metadata
      where: LangSmith traces
      how_long: depends on plan, trace date and configured retention
      default: 'off'
      condition: tracing is enabled or a RunTree is manually posted
      reach: workspace users and anyone allowed by its sharing settings
      control: disable tracing, hide inputs and outputs, and delete existing traces separately
      evidence_url: https://docs.langchain.com/langsmith/annotate-code
      checked: '2026-10-19'
      confidence: documented

# The household-wide kill switch. The owner turns it on to stop every kind from being kept.
household:
  never_keep: false

# One member switch per group. A group is a set of kinds that share one switch. The values are
# the ones the gateway used before this file existed.
groups:
  prompts:
    kinds: [library_prompt, conversation]
    default_keep: true          # for a new member; never applied later to a person who has a row
    default_retention: never    # the member's default period
    default_cap: never          # the household's default cap on every member's period
    choices: [never, 1_year, 3_months]   # the order the settings screens list them

# One purpose per kind, and what a record of the kind may hold and who may read it.
kinds:
  library_prompt:
    purpose: Library keeps the words that made each thing you created, so you can find it and make it again.
    parts: {allowed: [accepted], default: [accepted]}
    readers: maker
  conversation:
    purpose: An app can ask Azizam to keep a conversation so it can continue it later.
    parts: {allowed: [accepted, received], default: [accepted, received]}
    readers: scope

# Nothing in data widens who can read content. The validator accepts only none.
widening: none
