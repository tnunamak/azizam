# How Azizam asks an OpenAI-shaped transcription engine for text.
#
# This file is data. The reviewed adapter `chunked-stt`
# (gateway/engine_protocol/chunked_stt.py) sends each upload as a multipart
# request, bounds and classifies the engine's answer, and relays event streams.
# The chunk planner and the merge of chunk transcripts stay in
# gateway/stt_chunking.py, which the adapter drives. The operation names the
# route; a native event stream is a choice core makes for one run (any route),
# not an operation of its own.
protocol_version: 1
id: chunked-stt
title: OpenAI-shaped transcription route
label: STT backend
executor: adapter:chunked-stt
serves: [transcriptions]
operations:
  stt.transcribe: {class: generate}
  stt.translate: {class: generate}
