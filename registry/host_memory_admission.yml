# Release defaults of host-memory admission (docs/design/COMFY_HOST_RAM_RELEASE.md). Read-only data; gateway/host_memory_admission.py reads it once.
# A prompt that makes the graph engine load model files waits until the host's MemAvailable covers the files it will load
# plus a margin. Models the gateway already sent to the engine, and has not freed, are resident and cost nothing.
schema_version: 1
# GiB that must stay free after the load, by the kind of App that asks: a personal App has a person behind it; a service
# App has none, yields to every personal request and keeps the larger margin. The owner's saved setting (admin.db key
# host_memory_admission, /admin/api/settings/host-memory) wins over this file, for these margins and the two waits below.
margin_gb:
  personal: 12
  service: 20
# Seconds a synchronous request waits before the retryable busy answer, and the ceiling of a job's wait.
wait_s: 300
job_wait_s: 7200
# Seconds between looks at MemAvailable, between wait reports to a job, and for which an admitted load stays reserved
# (the engine takes seconds to stage a model, and a second prompt must not read memory that is already spoken for).
poll_s: 2
report_s: 30
# Seconds a model counts as resident after the gateway sent it.
resident_ttl_s: 600
# Seconds the busy answer tells the caller to wait (Retry-After).
retry_after_s: 30
# A string in a prompt that ends with one of these names a model file.
model_extensions: [.safetensors, .gguf, .ckpt, .pt, .pth, .bin, .sft]
# Directories that hold the model files; empty: none known, so no prompt has a known size and none waits. The engine
# directory named by the environment variable below (its models folder and the base paths of its extra-paths file) adds to this list.
model_roots: []
# The environment variable that names the engine's directory, the folder under it that holds models, and the engine's own
# file of further model directories (a mapping whose sections may name a base_path).
engine_dir_env: AZIZAM_COMFY_DIR
engine_models_folder: models
engine_extra_paths_file: extra_model_paths.yaml
