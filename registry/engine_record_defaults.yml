# Release defaults for the values an engine's service record may leave out (docs/design/CODE_TO_DATA.md, S8).
#
# This file is data. A value in the engine's own service record (the release record, with the owner's stored patches
# over it) wins over the value here. The gateway holds no timeout, default model, health path or workflow directory of
# its own. An engine address is never a default: a record that names none is not configured.
#
# Keys are capability role keys, not selected deployment ids: a service of any name takes the defaults of the
# role being derived, so a record that serves two (speech and transcription) takes each one's value in turn.
# timeout / video_timeout: seconds a request to the engine may take.
# health_endpoint: the path that the readiness probe reads, when the record names none.
# model_id: the model that the engine serves, when the record names none.
# default_model: the model a request gets when it names none.
# workflows_dir / video_workflows_dir: where the engine's graph files are, relative to the gateway, unless absolute.
# status_panels: the panels the status page shows for the service selected for the role, when its record declares none.
#   Each is {kind, output_key, title, short_title}. kind health_json reads the record's health path and publishes the
#   JSON it returns under output_key. A record that names its own status_panels replaces these.
defaults:
  audio.speech:
    timeout: 120
    health_endpoint: /health
    status_panels:
      - kind: health_json
        output_key: voxtral
        title: Voxtral (TTS)
        short_title: Voxtral (TTS)
  audio.transcriptions:
    timeout: 120
    health_endpoint: /health
    status_panels:
      - kind: health_json
        output_key: parakeet
        title: Parakeet (STT)
        short_title: Parakeet (STT)
  embeddings:
    timeout: 120
    health_endpoint: /health
    model_id: nomic-embed-text-v1.5
  images:
    timeout: 300
    default_model: flux2-klein-4b
    workflows_dir: ./workflows/images
  videos:
    video_timeout: 1800
    video_workflows_dir: ./workflows
