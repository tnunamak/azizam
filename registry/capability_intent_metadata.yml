schema_version: 1
exact:
  - intent: image.generate
    model_metadata: {type: image, input_modalities: [text], output_modalities: [image]}
  - intent: image.edit
    model_metadata: {type: image, input_modalities: [text, image], output_modalities: [image]}
  - intent: image.analyze
    model_metadata: {type: image, input_modalities: [image], output_modalities: [text]}
  - intent: video.generate
    model_metadata: {type: video, input_modalities: [text], output_modalities: [video]}
  - intent: video.edit
    model_metadata: {type: video, input_modalities: [text, video], output_modalities: [video]}
  - intent: audio.generate
    model_metadata: {type: audio, input_modalities: [text], output_modalities: [audio]}
  - intent: text.embeddings
    model_metadata: {type: embedding, input_modalities: [text], output_modalities: [embedding]}
  - intent: chat.completions
    operation: chat
  - intent: text.completions
    operation: chat
  - intent: text.rerank
    operation: rerank
  - intent: speech.synthesis
    operation: speech
  - intent: speech.transcription
    operation: transcriptions
  - intent: speech.translation
    operation: transcriptions
families:
  - family: chat
    operation: chat
  - family: responses
    operation: chat
  - family: decision
    operation: decisions
  - family: image
    model_metadata: {type: image, input_modalities: [text], output_modalities: [image]}
  - family: video
    model_metadata: {type: video, input_modalities: [text], output_modalities: [video]}
  - family: speech
    operation: speech
  - family: audio
    model_metadata: {type: audio, input_modalities: [text], output_modalities: [audio]}

# Model metadata semantic rules; vocabularies live in defaults/models.schema.json.
contract:
  # Schema enum order controls emission order, not these semantic roles.
  schema_version: 1
  tag_types: [language]
  derivation:
    # Scalar manifest inputs and fallback output typing have named roles.
    scalar_input: text
    fallback_output: text
    default_type: language
    output_priority:
      - {modality: image, type: image}
      - {modality: audio, type: audio}
      - {modality: video, type: video}
      - {modality: embedding, type: embedding}
    input_priority:
      - {modality: image, type: image}
      - {modality: audio, type: audio}
      - {modality: video, type: video}
  # Each row is a bidirectional equivalence, scoped to its tag-bearing type.
  implications:
    - {type: language, tag: vision, input_modality: image}
