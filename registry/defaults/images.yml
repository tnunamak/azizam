# Release defaults of the images section (docs/design/CONFIG_HOMES.md, C8a). Read-only; an owner's value is an
# override. The values are the code's fallbacks. The storage roots (cache_dir, vram_estimates_file) and the signing
# secret are startup settings, not in this section. Both workflow ids below ship with the release (workflows/images).
signed_url_ttl: 3600
vram_reserve_bytes: 1073741824
free_vram_on_exhaustion: true
max_batch_size: 4
background_removal:
  enabled: true
  decision_timeout: 45
  # Precedent: LiteLLM model request defaults + declarative request transforms.
  # https://docs.litellm.ai/docs/proxy/configs
  # Model/service transforms run after these workflow-owned decision parameters.
  decision_parameters:
    temperature: 0
    max_tokens: 160
    response_format: {type: json_object}
    chat_template_kwargs: {enable_thinking: false}
variations:
  default_workflow: qwen-image-2.1-edit
  denoise: 0.75
edits:
  default_workflow: qwen-image-2.1-edit
media_jobs:
  max_attempts: 3
  retry_base_seconds: 5
  retry_max_seconds: 30
  resume_on_start: true
  concurrency: 1
  make:
    max_prompt_chars: 32000
    max_outstanding_per_person: 3
    max_outstanding: 12

# Precedent: ComfyUI API-format graph bindings identify a node id and input name.
# Graph facts not represented by the manifests' input binding maps.
# Input targets and output selector definitions stay in their existing manifests.
graph_roles:
  workflows/images/krea2-turbo.json:
    background: {input: images, output: image, processor: "10", slot: 0}
  workflows/images/qwen-image-2.1-edit.json:
    reference_order: [source_image]
    background: {input: images, output: image, processor: "11", slot: 0}
  workflows/images/seedvr2-upscale.json:
    reference_order: [source_image]
    background: {input: images, output: image, processor: "99", slot: 0}
