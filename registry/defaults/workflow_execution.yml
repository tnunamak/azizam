# Release defaults of the workflow_execution section (docs/design/CONFIG_HOMES.md, C10; docs/design/CODE_TO_DATA_S4_S8.md,
# I7). Read-only; an owner's value is an override. The code holds the ceiling of each key, so a value above it is cut to
