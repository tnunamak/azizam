# Which base architecture a file header names. A workflow binding says `adapter_architecture: <id>`;
# a file is offered for it when one of its header keys holds one of the values listed here.
# A new base model is a new row. Values are what trainers write, not what the gateway invents:
# a file whose header has no usable key is never offered unless the owner marks it.
krea2:
  ss_base_model_version: [krea2]
qwen_image_2:
  ss_base_model_version: [qwen_image_2]
flux2_klein_9b:
  ss_base_model_version: [flux2_klein_9b]
