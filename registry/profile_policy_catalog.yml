protocols:
  - id: openai
    label: OpenAI-compatible
    summary_label: OpenAI-compatible
    description: /openai/v1 and /v1 SDKs
    default: true
  - id: anthropic
    label: Anthropic Messages
    summary_label: Anthropic Messages
    description: /anthropic/v1/messages clients
  - id: ollama
    label: Ollama-compatible
    summary_label: Ollama-compatible
    description: /ollama/api and /api clients
  - id: gateway
    label: Gateway jobs
    summary_label: Gateway jobs
    description: capabilities, assets, receipts, media jobs
  - id: provider-native
    label: Provider-native passthrough
    summary_label: Provider-native passthrough
    description: raw provider APIs under /gateway/v1/providers/{provider}
    profile_form: false
    simulator: false

intents:
  # Plan vocabulary: the intent ids runtime routes stamp on requests. A plan
  # value matches an exact id or a dotted family ("chat" covers
  # chat.completions, chat.responses and chat.messages). Protocol frontends
  # describe the same work in route spellings; `aliases` maps each of those to
  # its plan id, so a plan saved with either spelling allows the same requests.
  # Labels for member tasks match taskNames in web/src/lib/terms.ts.
  - id: chat
    label: Chat
    summary_label: chat
    description: chat completions, responses and messages
    aliases: [chat.completions]
    default: true
  - id: text.completions
    label: Text completions
    summary_label: text completions
    description: legacy completion clients
  - id: text.embeddings
    label: Turn text into numbers
    summary_label: embeddings
    description: embeddings and reranking for search, memory, indexes
    aliases: [embeddings, embedding]
  - id: image.generate
    label: Make a picture
    summary_label: image generation
    description: text to image workflows
    aliases: [images.generate, images.generations]
  - id: image.edit
    label: Edit a picture
    summary_label: image editing
    description: inpaint, mask, ControlNet-like workflows
    aliases: [images.edit, images.edits]
  - id: speech.synthesis
    label: Read text aloud
    summary_label: text to speech
    description: voice output and the voice list
    aliases: [audio.speech]
  - id: speech.transcription
    label: Turn a recording into text
    summary_label: speech transcription
    description: transcription input
    aliases: [audio.transcriptions, audio.transcribe]
  - id: speech.translation
    label: Translate a recording into English text
    summary_label: speech translation
    description: speech translation input
    aliases: [audio.translations]
  - id: audio.generate
    label: Make music or sounds
    summary_label: music/audio generation
    description: audio generation workflows
  - id: video.generate
    label: Make a video
    summary_label: video generation
    description: expensive queued video jobs
    aliases: [videos.generate]
  - id: video.remix
    label: Remix a video
    summary_label: video remix
    description: change or replace parts of a finished video
  - id: decision.systemone
    label: Choose an option
    summary_label: decisions
    description: typed judgments for apps
  - id: models.list
    label: List models
    summary_label: model list
    description: show compatible models to clients
    aliases: [capabilities.list]
  - id: jobs.create
    label: Background jobs
    summary_label: background jobs
    description: no request checks this yet; each job checks the task it makes
  - id: assets.read
    label: Read creations
    summary_label: creations
    description: no request checks this yet; each creation checks the task that made it
  - id: provider.native
    label: Provider passthrough
    summary_label: provider passthrough
    description: raw provider APIs; also needs native passthrough
    aliases: [providers.native]

resource_tiers:
  - id: interactive
    label: Interactive
    summary_label: interactive
    description: fast requests, normal chat
    default: true
  - id: batch
    label: Batch
    summary_label: batch
    description: queued media and longer jobs
  - id: expensive
    label: Expensive
    summary_label: expensive
    description: video and heavy GPU workflows

exposure:
  - id: default
    label: Default capabilities
    summary_label: default capabilities
    description: normal model and workflow catalog
    default: true
  - id: opt_in
    label: Opt-in capabilities
    summary_label: opt-in capabilities
    description: operator-curated extras

trust_tiers:
  - id: stable
    label: Stable
    summary_label: stable
    description: expected to work for users
    default: true
  - id: experimental
    label: Experimental
    summary_label: experimental
    description: new, flaky, or changing
  - id: private
    label: Private
    summary_label: private
    description: personal/local-only workflows

target_visibility:
  - id: catalog
    label: Allowed catalog
    summary_label: allowed catalog
    description: Clients can see targets this Profile is allowed to use, even when a target may be cold.
    default: true
  - id: available
    label: Available now
    summary_label: available now
    description: Clients only see targets the gateway believes are currently usable under this Profile and runtime state.

target_activation:
  - id: may_activate
    label: May activate
    summary_label: may activate
    description: Requests may load, switch, start, or queue a target when the Profile and runtime policy allow it.
    default: true
  - id: existing_only
    label: Existing only
    summary_label: existing only
    description: Requests must use already loaded/running/selected targets; cold or disruptive switches are denied.

status_visibility:
  - id: none
    label: None
  - id: basic
    label: Basic
    default: true
  - id: standard
    label: Standard
  - id: full
    label: Full

fallback_profile:
  id: default-local
  label: Gateway default
  description: Built-in local-only policy used when no stored Profile is assigned.
