# Capability rows are in display order. Route intents list only extra words.
schema_version: 1
# Wire-facing modalities are distinct from capability IDs and MIME media types.
modality_words: [text, image, audio, video, mesh]
capabilities:
  - id: chat
    label: Chat
    recommended_alias: default
  - id: image
    label: Images
    recommended_alias: image
    summary: Generate or edit images from your prompts.
    policy_protocol: openai.images
  - id: video
    label: Video
    recommended_alias: video
    summary: Video from a prompt or image.
    policy_protocol: openai.video
  - id: speech
    label: Voice
    recommended_alias: tts
    summary: Turn text into spoken audio.
    policy_protocol: openai.audio
  - id: transcribe
    label: Transcription
    recommended_alias: stt
    summary: Turn recorded speech into text.
    policy_protocol: openai.audio
  - id: music
    label: Music
    recommended_alias: music
    summary: Songs and instrumentals from a prompt.
    policy_protocol: openai.audio
  - id: sfx
    label: Sound effects
    recommended_alias: sfx
    summary: Sound effects from a description.
    policy_protocol: openai.audio
  - id: audio
    label: Audio
    hidden_by: [speech, transcribe, music, sfx]
    icon: sfx
    summary: Generate audio from your prompts.
    policy_protocol: openai.audio
  - id: decide
    label: Decisions
    recommended_alias: decide
    summary: Choose an outcome from your options.
  - id: embed
    label: Document search
    recommended_alias: embed
    summary: Create vectors for search and similarity.
    policy_protocol: openai.embeddings
  - id: rerank
    label: Reranking
    recommended_alias: rerank
    summary: Order search results by relevance.
  - id: mesh
    label: 3D models
    summary: A 3D model from one picture.
    policy_protocol: openai.mesh
