# Where each workflow input goes in a route's request. The loader is
# gateway/workflow_request_maps.py; the shapes it produces are what
# gateway/workflow_openapi.request_mapping builds a request from.
#
# A row selects records (select: a native route and mode, an exact intent and
# mode, an intent prefix, or the default) and places every settable input with
# the first part that matches, in this order: first, inputs, sets, asset,
# default. A placement is `in` one of body, form, file, file+extension,
# extension or none, with an optional `field` (the input name when absent) and
# an optional two-name `combine` for the WIDTHxHEIGHT size field.
#
# Route-managed sets stay in Python. A row names one by word and the loader
# resolves it with the existing constant or helper, so members are never copied
# here. Static words: image_generate_managed, image_edit_managed,
# audio_route_managed, video_route_managed, video_reference. Per-record words:
# unbound (inputs no service binding maps) and route_images (the pictures the
# native edit route reads, in submission order).
schema_version: 1

maps:
  # A native route (the record sets gateway_route): plain multipart. Each asset
  # is a file part and every other input a form field; source_image is the
  # route's single image.
  - select:
      native: true
      mode: sync
    rename:
      source_image: image
    asset:
      in: file
    default:
      in: form

  # The mesh route refuses an input no service binding maps, so those inputs are
  # not form fields either.
  - select:
      intent: mesh.generate
      mode: sync
    sets:
      - word: unbound
        placement:
          in: none
    asset:
      in: file
    default:
      in: form

  # The video-edit run route: plain multipart form.
  - select:
      intent: video.edit
      mode: sync
    asset:
      in: file
    default:
      in: form

  # The image-generations route (POST /v1/images/generations): the prompt and the
  # combined size at the top level, the route-managed image inputs unset, the
  # rest as extension keys.
  - select:
      intent: image.generate
      mode: any
    inputs:
      prompt:
        in: body
        field: prompt
      width:
        in: body
        field: size
        combine: [width, height]
      height:
        in: body
        field: size
        combine: [width, height]
    sets:
      - word: image_generate_managed
        placement:
          in: none
    default:
      in: extension

  # The image-edits route (POST /v1/images/edits): each route picture is one
  # repeated image[] part, source first, then the route's form fields; a later
  # asset is a file part plus its extension value.
  - select:
      intent: image.edit
      mode: any
    first: route_images
    inputs:
      prompt:
        in: form
        field: prompt
      source_image:
        in: file
        field: image[]
      mask:
        in: file
        field: mask
      width:
        in: form
        field: size
        combine: [width, height]
      height:
        in: form
        field: size
        combine: [width, height]
    sets:
      - word: route_images
        placement:
          in: file
          field: image[]
      - word: image_edit_managed
        placement:
          in: none
    asset:
      in: file+extension
    default:
      in: extension

  # The audio-generate route (POST /v1/audio/generate): route-managed audio
  # fields at the top level, the rest as extension keys.
  - select:
      intent: audio.generate
      mode: any
    sets:
      - word: audio_route_managed
        placement:
          in: body
    default:
      in: extension

  # Every video intent (POST /v1/videos; sync video.edit is the run route above):
  # the prompt, size, seconds and input reference at the top level, the
  # route-managed video inputs unset, the rest as extension keys.
  - select:
      intent_prefix: video.
    inputs:
      prompt:
        in: body
        field: prompt
      negative_prompt:
        in: body
        field: negative_prompt
      seed:
        in: body
        field: seed
      image_strength:
        in: body
        field: image_strength
      width:
        in: body
        field: size
        combine: [width, height]
      height:
        in: body
        field: size
        combine: [width, height]
      length:
        in: body
        field: seconds
      image:
        in: body
        field: input_reference
    sets:
      - word: video_route_managed
        placement:
          in: none
    default:
      in: extension

  # Any other intent and mode: a key under extensions["com.azizam.workflow"].
  - select:
      any: true
    default:
      in: extension
