argv:
  - nvidia-smi
  - --query-gpu=index,uuid,name,memory.used,memory.total,utilization.gpu,temperature.gpu,power.draw,power.limit,power.default_limit,power.max_limit,clocks.gr,clocks.mem,fan.speed,clocks_throttle_reasons.active,pcie.link.gen.current,pcie.link.gen.max,pcie.link.width.current,pcie.link.width.max
  - --format=csv,noheader,nounits
fields:
  - {key: index, type: int}
  - {key: uuid, type: str}
  - {key: name, type: str}
  - {key: memory_used_mb, type: int}
  - {key: memory_total_mb, type: int}
  - {key: instantaneous_util_pct, type: optional_int}
  - {key: temp_c, type: optional_int}
  - {key: power_draw_w, type: optional_float}
  - {key: power_limit_w, type: optional_float}
  - {key: power_default_limit_w, type: optional_float}
  - {key: power_max_limit_w, type: optional_float}
  - {key: clocks_gr_mhz, type: optional_int}
  - {key: clocks_mem_mhz, type: optional_int}
  - {key: fan_speed_pct, type: optional_int}
  - {key: throttle_reasons_hex, type: str}
  - {key: pcie_link_gen, type: optional_int}
  - {key: pcie_link_gen_max, type: optional_int}
  - {key: pcie_link_width, type: optional_int}
  - {key: pcie_link_width_max, type: optional_int}
devices:
  - index: 0
    label: GPU0
    order: 0
    budget_key: gpu0
    roles:
      - {label: total, key: total_gb}
      - {label: desktop, key: desktop_gb}
      - {label: TTS, key: tts_gb}
      - {label: "{label}", key: "{gpu_budget_key}"}
      - {label: headroom, key: headroom_gb}
  - index: 1
    label: GPU1
    order: 1
    budget_key: gpu1
    roles:
      - {label: total, key: total_gb}
      - {label: LLM, key: llm_gb}
      - {label: headroom, key: headroom_gb}
runtime_display:
  device_index: 0
  device_label: device[0]
  python_label: Python
  runtime_label: PyTorch
