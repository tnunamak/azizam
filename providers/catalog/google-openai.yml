id: google-openai
display_name: Google Gemini OpenAI-compatible
logo_key: google
base_url: https://generativelanguage.googleapis.com/v1beta/openai
protocol: openai-chat
litellm_provider: openai
auth:
  header: Authorization
  prefix: Bearer
model_listing:
  method: GET
  path: /models
  items_path: data
  id_path: id
docs_url: https://ai.google.dev/gemini-api/docs/openai
key_url: https://aistudio.google.com/apikey
billing_dimensions:
  - prompt_tokens
  - completion_tokens
retention_facts:
  - id: abuse-monitoring
    holds: text prompts, context and outputs in abuse records
    where: provider abuse-monitoring systems
    how_long: 55 days
    default: 'on'
    condition: null
    reach: controlled authorized provider employees on review
    control: review the provider policy; this abuse retention is separate from developer logs
    evidence_url: https://ai.google.dev/gemini-api/docs/usage-policies
    checked: '2026-10-19'
    confidence: documented
  - id: developer-logs
    holds: supported request and response content in project logs
    where: developer-owned project logs or promoted datasets
    how_long: configured 7, 14, 28 or 55 days; promoted datasets have no set retention period
    default: 'off'
    condition: logging is enabled for a billing-enabled project
    reach: people authorized to access the Cloud project or dataset
    control: disable project logging and delete promoted datasets separately
    evidence_url: https://ai.google.dev/gemini-api/docs/logs-policy
    checked: '2026-10-19'
    confidence: documented
  - id: feature-state
    holds: user-uploaded files reusable by reference
    where: provider Files API store
    how_long: files are automatically deleted after 48 hours
    default: conditional
    condition: a file is uploaded through the Files API
    reach: metadata can be read through the API; user-uploaded files cannot be downloaded through it
    control: delete uploaded files early through the Files API
    evidence_url: https://ai.google.dev/gemini-api/docs/files
    checked: '2026-10-19'
    confidence: documented
  - id: unpaid-improvement
    holds: unpaid-service inputs and outputs for improvement and training
    where: provider improvement and review systems after removal of account, API-key and project identifiers
    how_long: unknown
    default: conditional
    condition: unpaid service outside the EEA, Switzerland and UK; active-billing paid projects and those regions receive paid data treatment
    reach: human reviewers may read, annotate and process API input and output
    control: use active-billing paid-project treatment to exclude improvement use; this does not disable abuse monitoring
    evidence_url: https://ai.google.dev/gemini-api/terms
    checked: '2026-10-19'
    confidence: documented
