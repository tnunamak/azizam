# Live drop-in: ~/.config/systemd/user/azizam.service.d/reliability.conf
# Install with the steps in docs/ops/SAFE_RESTART.md (after the first restart
# onto the new start.sh, never before).
[Service]
# A plain `systemctl restart` still lets uvicorn finish in-flight responses.
# The prior comment's intent is kept: nothing may hang in "deactivating", so
# systemd SIGKILLs the whole cgroup when TimeoutStopSec expires.
#
# KillMode=mixed: SIGTERM goes to start.sh only. start.sh forwards it to the
# proxy, waits for uvicorn's graceful shutdown (AZIZAM_GRACEFUL_SHUTDOWN_S,
# default 120 s), then stops LiteLLM, which chat may still use until then.
# With control-group, LiteLLM would get SIGTERM at the same moment as the proxy
# and in-flight chat would fail.
KillMode=mixed
KillSignal=SIGTERM
TimeoutStopSec=150s
SendSIGKILL=yes
