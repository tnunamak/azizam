# Service record for the Pixal3D service (engines/pixal3d_comfy_service.py). Add it under `services:` in the
# deployment config. Compare the `trellis` record in tests/fixtures/config_homes/deployment_config.yml.
#
# The pool shares GPU0 with the bundled TRELLIS.2 service, so declare only one of the two as the active mesh service.
pixal3d:
  display_name: Image to 3D (Pixal3D)
  description: Turn one image into a textured 3D model.
  name: Pixal3D (ComfyUI)
  host: 127.0.0.1
  port: 8892
  base_path: /
  health_endpoint: /health
  timeout: 900
  role: optional
  managed: false
  capabilities: [mesh]
  # Claim: one measured run peaked near 20 GB of GPU memory (about 150 s). 20 GB x 1.1, rounded up to a whole
  # 256 MiB = 20992 MiB. This comes from a single run: measure more inputs and resolutions before relying on it.
  resource_capacity:
    enabled: true
    mode: exclusive-route-pool
    pool_id: gpu0
    max_claim_bytes: 22011707392 # 20992 MiB
    reserve_bytes: 1073741824 # 1 GiB
    retry_after_seconds: 30
    timeout_seconds: 5
    observer:
      service: vram-observer
      path: /vram
      free_pointer: /memory_free_bytes
      total_pointer: /memory_total_bytes
