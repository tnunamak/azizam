proxy:
  host: 0.0.0.0
  port: 5000
llm:
  pin_loaded_model: false
  # Swap drain (gateway/swap_drain.py). When enabled, a model/profile swap on a
  # swap-capable backend waits for the requests it is serving to finish, up to
  # timeout_s; if they do not finish, the swap is refused and the request that
  # wanted it gets 503 + Retry-After. Off by default: a swap restarts at once.
  # swap_drain:
  #   enabled: true
  #   timeout_s: 120          # longest a swap waits for requests in flight
  #   lease_max_age_s: 1800   # a request counted longer than this no longer blocks swaps
backends:
  azizam:
    name: Azizam (self)
    native_passthrough: false
    host: 127.0.0.1
    port: 5000
    health_endpoint: /health
    role: required
    managed: false
  tabby:
    name: TabbyAPI (Qwen3-VL)
    native_passthrough: true
    protocol: openai-compatible
    base_path: /v1
    api_key_env: TABBY_API_KEY
    host: 127.0.0.1
    port: 5050
    model_id: qwen3-vl-30b
    health_endpoint: /v1/models
    # Downstream auth injection (DATA — replaces the old hardcoded apply_tabby_auth):
    # TabbyAPI wants the admin key for model-list endpoints, the api key otherwise.
    # First matching rule wins; secret resolves per-identity, falling back to env.
    auth_inject:
      - paths: ["/v1/models", "/v1/model/list"]
        header: x-admin-key
        secret: admin_key
        secret_env: TABBY_ADMIN_KEY
      - header: x-api-key
        secret: api_key
        secret_env: TABBY_API_KEY
    load_timeout: 300
    idle_timeout: 0
    role: standby
    note: "On-demand vision backend; cold-started by ensure_target() when a vision-capable role is invoked. Down at idle is expected."
    capabilities:
      - vision
      - chat
      - completions
    managed: false
    lifecycle:
      driver: http-load-unload
      driver_config:
        load_url: /v1/model/load
        unload_url: /v1/model/unload
        admin_header: x-admin-key
        admin_key_env: TABBY_ADMIN_KEY
        load_body_params: tabby-config
        load_timeout_s: 300
        success_marker: '"status":"finished"'
        verify_endpoint: /v1/model
        # activation_model_key defaults to "model_name" (omitted = use default).
  kobold:
    name: Local llama.cpp server (official; Bee rollback available)
    native_passthrough: true
    # LiteLLM must route aliases back through the gateway so lifecycle-backed
    # model/profile activation happens before the request reaches llama-server.
    gateway_lifecycle: true
    protocol: openai-compatible
    base_path: /v1
    host: 127.0.0.1
    port: 5051
    state_type: llama_cpp
    health_endpoint: /v1/models
    # Version the logical-policy collection independently of the registry as a
    # whole. Existing DB-owned collections must be explicitly migrated.
    model_policy_schema_version: 1
    # model_metadata: what /v1/models reports (docs/api/MODEL_METADATA.md).
    # Every record loads the mmproj (image input) and llama-bee runs with
    # --jinja (native tool calls) and --reasoning on. Only the records with a
    # `reasoning_effort: none` overlay omit the `reasoning` tag. The 16384
    # `max_tokens` on `default` is a default, not a cap, so it is not declared.
    # After first boot these rows live in admin.db; copy edits there with
    # scripts/local/sync_model_metadata_from_config.py.
    models:
      - id: default
        model_group: default
        upstream_model: Qwen3.8-27B-Uncensored-Q4_K_M.gguf
        activation_model: /media/windows/AI Models/LLMs/GGUF/Qwen3.8-27B-Uncensored-Q4_K_M.gguf
        activation_mmproj: /media/windows/AI Models/LLMs/GGUF/Qwen3.8-27B-Uncensored-mmproj-F16.gguf
        activation_profile: kv-q5-q4
        context_window: 202752
        # Aggregate completion guard for the selected default model only.
        # This is canonical after protocol normalization; an explicit caller
        # max_tokens (or equivalent frontend field) wins by setdefault.
        transforms:
          - kind: param-map
            from: max_completion_tokens
            to: max_tokens
            only_if_destination_absent: true
          - kind: default-params
            set: {max_tokens: 16384}
        model_metadata:
          input_modalities: [text, image]
          tags: [reasoning, tool-use, vision]
      - id: coder
        model_group: coder
        upstream_model: Qwen3.8-27B-Uncensored-Q4_K_M.gguf
        activation_model: /media/windows/AI Models/LLMs/GGUF/Qwen3.8-27B-Uncensored-Q4_K_M.gguf
        activation_mmproj: /media/windows/AI Models/LLMs/GGUF/Qwen3.8-27B-Uncensored-mmproj-F16.gguf
        activation_profile: kv-q5-q4
        context_window: 202752
        model_metadata:
          input_modalities: [text, image]
          tags: [reasoning, tool-use, vision]
      - id: coder-q5
        model_group: coder-q5
        base_model_id: coder
        # Unique internal lifecycle aliases preserve the selected KV profile
        # across LiteLLM's gateway -> internal-gateway hop.
        upstream_model: coder-q5
        backend_model: Qwen3.8-27B-Uncensored-Q4_K_M.gguf
        activation_model: /media/windows/AI Models/LLMs/GGUF/Qwen3.8-27B-Uncensored-Q4_K_M.gguf
        activation_mmproj: /media/windows/AI Models/LLMs/GGUF/Qwen3.8-27B-Uncensored-mmproj-F16.gguf
        activation_profile: kv-q5-q4
        context_window: 202752
        model_metadata:
          input_modalities: [text, image]
          tags: [reasoning, tool-use, vision]
      - id: coder-q8
        model_group: coder-q8
        base_model_id: coder
        upstream_model: coder-q8
        backend_model: Qwen3.8-27B-Uncensored-Q4_K_M.gguf
        activation_model: /media/windows/AI Models/LLMs/GGUF/Qwen3.8-27B-Uncensored-Q4_K_M.gguf
        activation_mmproj: /media/windows/AI Models/LLMs/GGUF/Qwen3.8-27B-Uncensored-mmproj-F16.gguf
        activation_profile: kv-q8
        context_window: 145408
        model_metadata:
          input_modalities: [text, image]
          tags: [reasoning, tool-use, vision]
      - id: coder-unchained
        model_group: coder-unchained
        upstream_model: coder-unchained
        backend_model: Qwen3.8-27B-Uncensored-Q4_K_M.gguf
        activation_model: /media/windows/AI Models/LLMs/GGUF/Qwen3.8-27B-Uncensored-Q4_K_M.gguf
        activation_mmproj: /media/windows/AI Models/LLMs/GGUF/Qwen3.8-27B-Uncensored-mmproj-F16.gguf
        activation_profile: kv-q5-q4
        context_window: 202752
        model_metadata:
          input_modalities: [text, image]
          tags: [reasoning, tool-use, vision]
      # Public aliases inherit the logical base policy by stable id. Physical
      # paths remain routing data; only this overlay distinguishes fast.
      - id: default-fast
        model_group: default-fast
        base_model_id: default
        upstream_model: Qwen3.8-27B-Uncensored-Q4_K_M.gguf
        activation_model: /media/windows/AI Models/LLMs/GGUF/Qwen3.8-27B-Uncensored-Q4_K_M.gguf
        activation_mmproj: /media/windows/AI Models/LLMs/GGUF/Qwen3.8-27B-Uncensored-mmproj-F16.gguf
        activation_profile: kv-q5-q4
        context_window: 202752
        policy_overlay:
          - kind: default-params
            set: {reasoning_effort: none}
        model_metadata:
          input_modalities: [text, image]
          tags: [tool-use, vision]
      # These aliases deliberately select the already loaded routing target.
      # Their base references are policy data, not loaded-file inference.
      # /v1/models reports the loaded model's declared metadata for them. Their
      # own model_metadata is the fallback when the loaded model is not observed.
      # The operator declares what this slot normally runs (the Qwen models:
      # reasoning, vision, tool use). Loading text-only cydonia-24b here is a
      # known exception the fallback does not describe.
      - id: current
        model_group: current
        base_model_id: default
        upstream_model: Qwen3.8-27B-Uncensored-Q4_K_M.gguf
        model_metadata:
          input_modalities: [text, image]
          tags: [reasoning, tool-use, vision]
      - id: current-fast
        model_group: current-fast
        base_model_id: default
        upstream_model: Qwen3.8-27B-Uncensored-Q4_K_M.gguf
        policy_overlay:
          - kind: default-params
            set: {reasoning_effort: none}
        model_metadata:
          input_modalities: [text, image]
          tags: [tool-use, vision]
      - id: rp
        model_group: rp
        # Keep the logical alias across LiteLLM's internal gateway hop so the
        # RP-specific context profile cannot collapse into generic q5.
        upstream_model: rp
        backend_model: Qwen3.8-27B-Uncensored-Q4_K_M.gguf
        activation_model: /media/windows/AI Models/LLMs/GGUF/Qwen3.8-27B-Uncensored-Q4_K_M.gguf
        activation_mmproj: /media/windows/AI Models/LLMs/GGUF/Qwen3.8-27B-Uncensored-mmproj-F16.gguf
        activation_profile: kv-q5-q4
        context_window: 202752
        model_metadata:
          input_modalities: [text, image]
          tags: [reasoning, tool-use, vision]
    role: required
    capabilities:
      - openai
      - chat
      - completions
    managed: false
    lifecycle:
      driver: systemd
      driver_config:
        scope: user
        unit: llama-bee.service
        # Sort after the operator-owned 90-engine.conf so model/profile
        # activation cannot change the selected engine.
        dropin: 95-activation.conf
        swap_strategy: dropin-env-restart
        health_endpoint: /v1/models
        health_timeout_s: 180
        # LLAMA_BEE_* is the retained compatibility API for the local service.
        # Engine selection is operator-owned and intentionally absent here:
        # Daisy/model activation may change models and KV profiles, never engines.
        activation_env_keys:
          model: LLAMA_BEE_MODEL
          aux: LLAMA_BEE_MMPROJ
        # Named engine profiles are lifecycle DATA. Model records select a
        # name; only this driver config translates it into service env.
        activation_profiles:
          kv-q5-q4:
            LLAMA_BEE_CTK: q5_0
            LLAMA_BEE_CTV: q4_1
            LLAMA_BEE_DRAFT_CTK: q5_0
            LLAMA_BEE_DRAFT_CTV: q4_1
            LLAMA_BEE_CTX: 202752
          kv-q5-q4-rp:
            LLAMA_BEE_CTK: q5_0
            LLAMA_BEE_CTV: q4_1
            LLAMA_BEE_CTX: 217088
            LLAMA_BEE_DRAFT_CTK: q5_0
            LLAMA_BEE_DRAFT_CTV: q4_1
          kv-q8:
            LLAMA_BEE_CTK: q8_0
            LLAMA_BEE_CTV: q8_0
            LLAMA_BEE_CTX: 145408
        # Precheck type: validate model is an absolute, existing .gguf path.
        precheck: gguf_path
  tts:
    name: omnivoice-tts
    native_passthrough: true
    host: 127.0.0.1
    port: 8002
    health_endpoint: /health
    timeout: 86400
    # OmniVoice is the fallback behind Chatterbox, so it is on demand: the server exits after
    # 5 min idle (OMNIVOICE_IDLE_EXIT_S in the unit's drop-in) and the gateway starts it again.
    role: standby
    note: "OmniVoice, the fallback speech engine; on demand: exits after 5 min idle (frees 2-4 GB of GPU0, more after long texts), started by the gateway lifecycle driver."
    capabilities:
      - audio
      - speech
    managed: false
    lifecycle:
      driver: systemd
      driver_config:
        scope: user
        unit: omnivoice-tts.service
        health_endpoint: /health
        health_timeout_s: 150
  stt:
    name: parakeet-stt
    native_passthrough: true
    host: 127.0.0.1
    port: 5092
    default_model: parakeet-tdt-0.6b-v3
    health_endpoint: /health
    timeout: 120
    # Generic long-audio protection. This storage root must be on a durable
    # operator-provisioned filesystem; it is intentionally never /tmp.
    chunking:
      enabled: true
      # Measured 2026-08-29: an ~11 min recording (683s) that stayed under
      # the previous threshold_seconds (720s, whole-file passthrough) took
      # 86s solo, but 148-210s+ under concurrent transcription load on this
      # host (multiple STT jobs regularly overlap here). That's too close to
      # backend_timeout_seconds for a single unbounded request. Lowering the
      # threshold to 180s forces genuine chunking for any recording over 3
      # minutes, bounding every individual backend request's own audio span
      # regardless of total recording length or host contention -- each
      # ~150s target chunk finished in 25-56s even under heavy (97% CPU)
      # concurrent load in the same test.
      threshold_seconds: 180
      target_seconds: 150
      silence_noise_db: -30dB
      silence_min_seconds: 0.5
      silence_search_seconds: 120
      max_input_bytes: 536870912
      max_decoded_bytes: 1073741824
      max_duration_seconds: 14400
      max_sample_rate: 48000
      max_channels: 2
      max_segments: 16
      max_files: 8
      max_fields: 100
      max_field_bytes: 65536
      max_response_bytes: 16777216
      max_media_output_bytes: 8388608
      spool_dir: data/stt-spool
      min_free_bytes: 67108864
      # Despite its legacy name, this admission limit is per gateway Python
      # process. Multiple workers multiply this limit and its reserved-disk
      # budget; use one worker until a durable cross-process coordinator exists.
      global_concurrency: 2
      # 180s keeps a real margin over the largest chunk this config now ever
      # sends in one request (~150s of audio, see threshold_seconds/
      # target_seconds above) without masking a genuinely stuck backend for
      # long. deadline_seconds stays proportionally above it.
      backend_timeout_seconds: 180
      deadline_seconds: 360
      setup_failure_policy: passthrough
    role: required
    capabilities:
      - audio
      - transcriptions
    managed: false
  tts-supertonic:
    name: supertonic-tts
    native_passthrough: true
    host: 127.0.0.1
    port: 8010
    health_endpoint: /health
    timeout: 120
    # Higher number = lower priority: the always-on default service keeps winning capability lookups.
    priority: 200
    role: standby
    note: "On-demand audio.cpp Supertonic realtime TTS on GPU0; started by the gateway lifecycle driver."
    capabilities:
      - audio
      - speech
    managed: false
    lifecycle:
      driver: systemd
      driver_config:
        scope: user
        unit: supertonic-tts.service
        health_endpoint: /health
        health_timeout_s: 90
  tts-kokoro:
    name: kokoro-tts
    native_passthrough: true
    host: 127.0.0.1
    port: 8011
    health_endpoint: /health
    timeout: 120
    # Higher number = lower priority: the always-on default service keeps winning capability lookups.
    priority: 200
    role: standby
    note: "On-demand Kokoro-82M Python TTS on GPU0; exits after 10 min idle; started by the gateway lifecycle driver."
    capabilities:
      - audio
      - speech
    managed: false
    lifecycle:
      driver: systemd
      driver_config:
        scope: user
        unit: kokoro-tts.service
        health_endpoint: /health
        health_timeout_s: 90
  tts-chatterbox:
    name: chatterbox-tts
    native_passthrough: true
    host: 127.0.0.1
    port: 8015
    health_endpoint: /health
    timeout: 120
    # Higher number = lower priority: the always-on default service keeps winning capability lookups.
    priority: 200
    role: standby
    note: "On-demand Chatterbox Turbo (Python) voice-cloning TTS on GPU0; weights unload after 10 min idle, process exits after 1 h; started by the gateway lifecycle driver."
    capabilities:
      - audio
      - speech
    managed: false
    lifecycle:
      driver: systemd
      driver_config:
        scope: user
        unit: chatterbox-tts.service
        health_endpoint: /health
        health_timeout_s: 90
  stt-nemotron:
    name: nemotron-stt
    native_passthrough: true
    host: 127.0.0.1
    port: 8012
    health_endpoint: /health
    timeout: 120
    # Higher number = lower priority: the always-on default service keeps winning capability lookups.
    priority: 200
    role: standby
    note: "On-demand audio.cpp Nemotron 3.5 streaming ASR on GPU0; started by the gateway lifecycle driver."
    capabilities:
      - audio
      - transcriptions
    managed: false
    default_model: nemotron-3.5-asr-streaming-0.6b
    # Offline mode handles about 120 s per request, so longer audio is cut at silences.
    # (stream=true uses streaming mode, which has no length limit.)
    chunking:
      enabled: true
      threshold_seconds: 110
      target_seconds: 60
      silence_search_seconds: 30
      max_duration_seconds: 3600
      max_segments: 64
      spool_dir: data/stt-spool
      backend_timeout_seconds: 180
      deadline_seconds: 360
    lifecycle:
      driver: systemd
      driver_config:
        scope: user
        unit: nemotron-stt.service
        health_endpoint: /health
        health_timeout_s: 90
  stt-canary:
    name: canary-stt
    native_passthrough: true
    host: 127.0.0.1
    port: 8013
    health_endpoint: /health
    timeout: 120
    # Higher number = lower priority: the always-on default service keeps winning capability lookups.
    priority: 200
    role: standby
    note: "On-demand audio.cpp Canary 180M Flash ASR on GPU0; started by the gateway lifecycle driver."
    capabilities:
      - audio
      - transcriptions
    managed: false
    default_model: canary-180m-flash
    # Measured: accurate to about 240 s per request, drops words near 300 s. Cut longer audio at silences.
    chunking:
      enabled: true
      threshold_seconds: 200
      target_seconds: 120
      silence_search_seconds: 40
      max_duration_seconds: 3600
      max_segments: 64
      spool_dir: data/stt-spool
      backend_timeout_seconds: 180
      deadline_seconds: 360
    lifecycle:
      driver: systemd
      driver_config:
        scope: user
        unit: canary-stt.service
        health_endpoint: /health
        health_timeout_s: 90
  stt-parakeet-gpu:
    name: parakeet-gpu-stt
    native_passthrough: true
    host: 127.0.0.1
    port: 8017
    health_endpoint: /health
    timeout: 120
    # Higher number = lower priority: the always-on default service keeps winning capability lookups.
    priority: 200
    role: standby
    note: "On-demand audio.cpp Parakeet TDT 0.6B v3 (q8) on GPU0: CPU-Parakeet accuracy at 5-9x the speed; weights unload after 5 min idle; started by the gateway lifecycle driver."
    capabilities:
      - audio
      - transcriptions
    managed: false
    default_model: parakeet-tdt-0.6b-v3
    # Measured on 313 s and 1576 s read speech (WER): 15 s 1.7/3.3%, 20 s 1.5/3.8%, 30 s 1.5/3.3%, 45 s -/3.8%,
    # 60 s 2.0/4.8%, 90 s 2.0/5.4%, 200 s 6.0%; one 313 s request fails outright. Shorter than the 60 s the CPU
    # service needs: cut at silences into about 30 s pieces.
    chunking:
      enabled: true
      threshold_seconds: 40
      target_seconds: 30
      silence_search_seconds: 10
      max_duration_seconds: 3600
      max_segments: 128
      spool_dir: data/stt-spool
      backend_timeout_seconds: 180
      deadline_seconds: 360
    lifecycle:
      driver: systemd
      driver_config:
        scope: user
        unit: parakeet-gpu-stt.service
        health_endpoint: /health
        health_timeout_s: 90
  stt-diarize:
    name: diarize-stt
    native_passthrough: true
    host: 127.0.0.1
    port: 8014
    health_endpoint: /health
    # The service reads the whole upload itself (diarizer speaker cache, ASR windows at quiet points), so it
    # waits for the full answer: 25 min of audio takes about 1 min; allow slow hosts and 4 h inputs.
    timeout: 1800
    # Higher number = lower priority: the always-on default service keeps winning capability lookups.
    priority: 200
    role: standby
    note: "On-demand CPU diarization (Nemotron 3 Diarization) plus Parakeet words, gpt-4o-transcribe-diarize shape; started by the gateway lifecycle driver."
    capabilities:
      - audio
      - transcriptions
    managed: false
    default_model: nemotron-3-diarization
    # Gateway chunking would split speakers across chunks; the service chunks the audio itself.
    # known_speaker_references[] are base64 data URLs, so the field limit is raised from 64 KiB.
    chunking:
      enabled: false
      spool_dir: data/stt-spool
      max_field_bytes: 8388608
      max_duration_seconds: 14400
      backend_timeout_seconds: 1800
      deadline_seconds: 2400
    lifecycle:
      driver: systemd
      driver_config:
        scope: user
        unit: diarize-stt.service
        health_endpoint: /health
        health_timeout_s: 120
  rerank:
    name: rerank-cpu
    host: 127.0.0.1
    port: 8018
    health_endpoint: /health
    timeout: 120
    # Higher number = lower priority: nothing else serves rerank, but the on-demand engines stay behind the always-on ones.
    priority: 200
    role: standby
    note: "On-demand CPU reranker (llama-server --rerank, Qwen3-Reranker-0.6B); about 1 GB RAM while running, exits after 10 min idle, started by the gateway lifecycle driver. Never a GPU."
    capabilities:
