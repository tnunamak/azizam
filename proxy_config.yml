    mmproj: /media/windows/AI Models/LLMs/GGUF/Qwen3.8-27B-Uncensored-mmproj-F16.gguf
    activation_profile: kv-q5-q4
    context_window: 202752
    description: Default LLM, reasoning off (low-latency)
    sampling:
