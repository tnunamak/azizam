proxy:
  host: 0.0.0.0
  port: 5000
llm:
  pin_loaded_model: false
backends:
  openai-proxy:
    name: openai-proxy (self)
    native_passthrough: false
    host: 127.0.0.1
    port: 5000
    health_endpoint: /health
    role: required
    managed: false
  tabby:
    name: TabbyAPI (Qwen3-VL)
    native_passthrough: true
    protocol: openai-compatible
    base_path: /v1
    api_key_env: TABBY_API_KEY
    host: 127.0.0.1
    port: 5050
    model_id: qwen3-vl-30b
    health_endpoint: /v1/models
    # Downstream auth injection (DATA — replaces the old hardcoded apply_tabby_auth):
    # TabbyAPI wants the admin key for model-list endpoints, the api key otherwise.
    # First matching rule wins; secret resolves per-identity, falling back to env.
    auth_inject:
      - paths: ["/v1/models", "/v1/model/list"]
        header: x-admin-key
        secret: admin_key
        secret_env: TABBY_ADMIN_KEY
      - header: x-api-key
        secret: api_key
        secret_env: TABBY_API_KEY
    load_timeout: 300
    idle_timeout: 0
    role: standby
    note: "On-demand vision backend; cold-started by ensure_target() when a vision-capable role is invoked. Down at idle is expected."
    capabilities:
      - vision
      - chat
      - completions
    managed: false
    lifecycle:
      driver: http-load-unload
      driver_config:
        load_url: /v1/model/load
        unload_url: /v1/model/unload
        admin_header: x-admin-key
        admin_key_env: TABBY_ADMIN_KEY
        load_body_params: tabby-config
        load_timeout_s: 300
        success_marker: '"status":"finished"'
        verify_endpoint: /v1/model
        # activation_model_key defaults to "model_name" (omitted = use default).
  kobold:
    name: Local llama.cpp server (official; Bee rollback available)
    native_passthrough: true
    # LiteLLM must route aliases back through the gateway so lifecycle-backed
    # model/profile activation happens before the request reaches llama-server.
    gateway_lifecycle: true
    protocol: openai-compatible
    base_path: /v1
    host: 127.0.0.1
    port: 5051
    state_type: llama_cpp
    health_endpoint: /v1/models
    # Version the logical-policy collection independently of the registry as a
    # whole. Existing DB-owned collections must be explicitly migrated.
    model_policy_schema_version: 1
    models:
      - id: default
        model_group: default
        upstream_model: Qwen3.6-27B-UD-Q4_K_XL-mtp.gguf
        activation_model: /media/windows/AI Models/LLMs/GGUF/Qwen3.6-27B-UD-Q4_K_XL-mtp.gguf
        activation_mmproj: /media/windows/AI Models/LLMs/GGUF/Qwen3.6-27B-mmproj-BF16.gguf
        activation_profile: kv-q5-q4
        context_window: 205824
        # Aggregate completion guard for the selected default model only.
        # This is canonical after protocol normalization; an explicit caller
        # max_tokens (or equivalent frontend field) wins by setdefault.
        transforms:
          - kind: param-map
            from: max_completion_tokens
            to: max_tokens
            only_if_destination_absent: true
          - kind: default-params
            set: {max_tokens: 16384}
      - id: coder
        model_group: coder
        upstream_model: Qwen3.6-27B-UD-Q4_K_XL-mtp.gguf
        activation_model: /media/windows/AI Models/LLMs/GGUF/Qwen3.6-27B-UD-Q4_K_XL-mtp.gguf
        activation_mmproj: /media/windows/AI Models/LLMs/GGUF/Qwen3.6-27B-mmproj-BF16.gguf
        activation_profile: kv-q5-q4
        context_window: 205824
      - id: coder-q5
        model_group: coder-q5
        base_model_id: coder
        # Unique internal lifecycle aliases preserve the selected KV profile
        # across LiteLLM's gateway -> internal-gateway hop.
        upstream_model: coder-q5
        backend_model: Qwen3.6-27B-UD-Q4_K_XL-mtp.gguf
        activation_model: /media/windows/AI Models/LLMs/GGUF/Qwen3.6-27B-UD-Q4_K_XL-mtp.gguf
        activation_mmproj: /media/windows/AI Models/LLMs/GGUF/Qwen3.6-27B-mmproj-BF16.gguf
        activation_profile: kv-q5-q4
        context_window: 205824
      - id: coder-q8
        model_group: coder-q8
        base_model_id: coder
        upstream_model: coder-q8
        backend_model: Qwen3.6-27B-UD-Q4_K_XL-mtp.gguf
        activation_model: /media/windows/AI Models/LLMs/GGUF/Qwen3.6-27B-UD-Q4_K_XL-mtp.gguf
        activation_mmproj: /media/windows/AI Models/LLMs/GGUF/Qwen3.6-27B-mmproj-BF16.gguf
        activation_profile: kv-q8
        context_window: 145408
      - id: coder-unchained
        model_group: coder-unchained
        upstream_model: coder-unchained
        backend_model: Huihui-Qwen3.6-27B-abliterated-UD-Q4_K_XL-MTP.gguf
        activation_model: /media/windows/AI Models/LLMs/GGUF/Huihui-Qwen3.6-27B-abliterated-UD-Q4_K_XL-MTP.gguf
        activation_mmproj: /media/windows/AI Models/LLMs/GGUF/Qwen3.6-27B-mmproj-BF16.gguf
        activation_profile: kv-q5-q4
        context_window: 205824
      # Public aliases inherit the logical base policy by stable id. Physical
      # paths remain routing data; only this overlay distinguishes fast.
      - id: default-fast
        model_group: default-fast
        base_model_id: default
        upstream_model: Qwen3.6-27B-UD-Q4_K_XL-mtp.gguf
        activation_model: /media/windows/AI Models/LLMs/GGUF/Qwen3.6-27B-UD-Q4_K_XL-mtp.gguf
        activation_mmproj: /media/windows/AI Models/LLMs/GGUF/Qwen3.6-27B-mmproj-BF16.gguf
        activation_profile: kv-q5-q4
        context_window: 205824
        policy_overlay:
          - kind: default-params
            set: {reasoning_effort: none}
      # These aliases deliberately select the already loaded routing target.
      # Their base references are policy data, not loaded-file inference.
      - id: current
        model_group: current
        base_model_id: default
        upstream_model: Qwen3.6-27B-UD-Q4_K_XL-mtp.gguf
      - id: current-fast
        model_group: current-fast
        base_model_id: default
        upstream_model: Qwen3.6-27B-UD-Q4_K_XL-mtp.gguf
        policy_overlay:
          - kind: default-params
            set: {reasoning_effort: none}
      - id: rp
        model_group: rp
        # Keep the logical alias across LiteLLM's internal gateway hop so the
        # RP-specific context profile cannot collapse into generic q5.
        upstream_model: rp
        backend_model: Huihui-Qwen3.6-27B-abliterated-UD-Q4_K_XL-MTP.gguf
        activation_model: /media/windows/AI Models/LLMs/GGUF/Huihui-Qwen3.6-27B-abliterated-UD-Q4_K_XL-MTP.gguf
        activation_mmproj: /media/windows/AI Models/LLMs/GGUF/Qwen3.6-27B-mmproj-BF16.gguf
        activation_profile: kv-q5-q4-rp
        context_window: 217088
    role: required
    capabilities:
      - openai
      - chat
      - completions
    managed: false
    lifecycle:
      driver: systemd
      driver_config:
        scope: user
        unit: llama-bee.service
        # Sort after the operator-owned 90-engine.conf so model/profile
        # activation cannot change the selected engine.
        dropin: 95-activation.conf
        swap_strategy: dropin-env-restart
        health_endpoint: /v1/models
        health_timeout_s: 60
        # LLAMA_BEE_* is the retained compatibility API for the local service.
        # Engine selection is operator-owned and intentionally absent here:
        # Daisy/model activation may change models and KV profiles, never engines.
        activation_env_keys:
          model: LLAMA_BEE_MODEL
          aux: LLAMA_BEE_MMPROJ
        # Named engine profiles are lifecycle DATA. Model records select a
        # name; only this driver config translates it into service env.
        activation_profiles:
          kv-q5-q4:
            LLAMA_BEE_CTK: q5_0
            LLAMA_BEE_CTV: q4_1
            LLAMA_BEE_DRAFT_CTK: q5_0
            LLAMA_BEE_DRAFT_CTV: q4_1
            LLAMA_BEE_CTX: 205824
          kv-q5-q4-rp:
            LLAMA_BEE_CTK: q5_0
            LLAMA_BEE_CTV: q4_1
            LLAMA_BEE_CTX: 217088
          kv-q8:
            LLAMA_BEE_CTK: q8_0
            LLAMA_BEE_CTV: q8_0
            LLAMA_BEE_CTX: 145408
        # Precheck type: validate model is an absolute, existing .gguf path.
        precheck: gguf_path
  tts:
    name: voxtral-int4-tts
    native_passthrough: true
    host: 127.0.0.1
    port: 8001
    health_endpoint: /health
    timeout: 86400
    role: required
    capabilities:
      - audio
      - speech
    managed: false
  stt:
    name: parakeet-stt
    native_passthrough: true
    host: 127.0.0.1
    port: 5092
    default_model: parakeet-tdt-0.6b-v3
    health_endpoint: /health
    timeout: 120
    # Generic long-audio protection. This storage root must be on a durable
    # operator-provisioned filesystem; it is intentionally never /tmp.
    chunking:
      enabled: true
      # Measured 2026-08-29: an ~11 min recording (683s) that stayed under
      # the previous threshold_seconds (720s, whole-file passthrough) took
      # 86s solo, but 148-210s+ under concurrent transcription load on this
      # host (multiple STT jobs regularly overlap here). That's too close to
      # backend_timeout_seconds for a single unbounded request. Lowering the
      # threshold to 180s forces genuine chunking for any recording over 3
      # minutes, bounding every individual backend request's own audio span
      # regardless of total recording length or host contention -- each
      # ~150s target chunk finished in 25-56s even under heavy (97% CPU)
      # concurrent load in the same test.
      threshold_seconds: 180
      target_seconds: 150
      silence_noise_db: -30dB
      silence_min_seconds: 0.5
      silence_search_seconds: 120
      max_input_bytes: 536870912
      max_decoded_bytes: 1073741824
      max_duration_seconds: 14400
      max_sample_rate: 48000
      max_channels: 2
      max_segments: 16
      max_files: 8
      max_fields: 100
      max_field_bytes: 65536
      max_response_bytes: 16777216
      max_media_output_bytes: 8388608
      spool_dir: data/stt-spool
      min_free_bytes: 67108864
      # Despite its legacy name, this admission limit is per gateway Python
      # process. Multiple workers multiply this limit and its reserved-disk
      # budget; use one worker until a durable cross-process coordinator exists.
      global_concurrency: 2
      # 180s keeps a real margin over the largest chunk this config now ever
      # sends in one request (~150s of audio, see threshold_seconds/
      # target_seconds above) without masking a genuinely stuck backend for
      # long. deadline_seconds stays proportionally above it.
      backend_timeout_seconds: 180
      deadline_seconds: 360
      setup_failure_policy: passthrough
    role: required
    capabilities:
      - audio
      - transcriptions
    managed: false
  embeddings:
    name: nomic-embed-text-v1.5 CPU
    native_passthrough: true
    protocol: openai-compatible
    base_path: /v1
    host: 127.0.0.1
    port: 5061
    model_id: nomic-embed-text-v1.5
    models:
      - id: nomic-embed-text-v1.5
        model_group: nomic-embed-text-v1.5
        upstream_model: nomic-embed-text-v1.5.f16.gguf
    health_endpoint: /health
    timeout: 120
    role: required
    note: "CPU-only llama-server embedding backend; no GPU budget claim."
    capabilities:
      - openai
      - embeddings
    resources:
      gpu_required: false
      vram_gb_estimate: 0
      duration_class: interactive
      max_parallel: 4
    managed: false
  comfyui:
    name: ComfyUI (Image + Video Generation)
    native_passthrough: true
    host: 127.0.0.1
    port: 7890
    health_endpoint: /system_stats
    timeout: 300
    workflows_dir: ./workflows/images
    default_model: flux2-klein-4b
    video_workflows_dir: ./workflows
    video_timeout: 1800
    role: required
    capabilities:
      - images
      - generations
      - videos
    managed: false
images:
  # Cache for `response_format: "url"` and content-addressed image storage.
  cache_dir: cache/images
  # Persistent VRAM-per-(workflow,size) measurements used for adaptive batching.
  vram_estimates_file: cache/vram_estimates.json
  # Signed URL TTL (seconds). Default 1 hour.
  signed_url_ttl: 3600
  # HMAC secret for signed URLs. If unset/empty, generated at first run and persisted
  # to <cache_dir>/.url_signing_secret with mode 0600.
  signed_url_secret: ""
  # Background eviction TTL for cached image bytes (seconds).
  cache_ttl: 86400
  # How often the eviction task runs (seconds).
  cache_eviction_interval: 3600
  # Reserve this many bytes of free VRAM as a safety margin when computing batch size.
  vram_reserve_bytes: 1073741824 # 1 GiB
  # Hard ceiling on batch_size per ComfyUI prompt regardless of VRAM headroom.
  max_batch_size: 4
  # Supports OpenAI's background option: transparent, opaque, or auto. The
  # RMBG graph lives inside each workflow; the proxy only selects the
  # workflow-declared output. `auto` uses an LLM decision.
  background_removal:
    enabled: true
    decision_timeout: 45
model_routing:
  model_dir: /media/windows/AI Models/LLMs
  gguf_dir: /media/windows/AI Models/LLMs/GGUF
  tabby_service: tabbyapi.service
  kobold_service: llama-bee.service
  kobold_service_legacy: llama-turbo.service
  switch_timeout: 60
  # Per-chunk (idle) read timeout for /v1/chat/completions and /v1/completions
  # forwarding. NOT a wall-clock cap — this is the max silence between bytes
  # from the backend. Covers prompt-processing latency on reasoning/vision
  # models (Qwen3.6 27B PP on a 4K-token vision prompt ≈ 150s). The local server
  # currently buffers tool-call argument JSON, so a legitimate 16K-token write
  # can produce no upstream bytes for far longer than five minutes. Keep the
  # finite liveness boundary here, above the worst credible full completion,
  # while Pi's client-side idle timeout is disabled for this local backend.
  # Env override: UPSTREAM_READ_TIMEOUT.
  upstream_read_timeout: 1800
routing:
  default_backend: kobold
  audio_backend: tts
  check_interval: 30

# Local reasoning policy. Pi sends qualitative effort; the native gateway
# translates it to the local server's numeric per-request thinking budget.
reasoning:
  default_effort: high
  effort_budgets:
    none: 0
    minimal: 2048
    low: 4096
    medium: 6144
    high: 8192
    xhigh: unlimited
roles:
  default:
    backend: kobold
    model: /media/windows/AI Models/LLMs/GGUF/Qwen3.6-27B-UD-Q4_K_XL-mtp.gguf
    mmproj: /media/windows/AI Models/LLMs/GGUF/Qwen3.6-27B-mmproj-BF16.gguf
    activation_profile: kv-q5-q4
    context_window: 205824
    description: Default LLM (Qwen3.6-27B UD-Q4_K_XL MTP via local llama.cpp on :5051)
    # Qwen3.6 thinking mode for coding — from official Qwen team recommendations
    sampling:
      temperature: 0.6
      top_p: 0.95
      top_k: 20
      min_p: 0.0
      presence_penalty: 0.0
      repetition_penalty: 1.0
  # Same physical model as `default`; the model record's declarative alias
  # overlay owns its reasoning default so explicit callers still win.
  default-fast:
    backend: kobold
    model: /media/windows/AI Models/LLMs/GGUF/Qwen3.6-27B-UD-Q4_K_XL-mtp.gguf
    mmproj: /media/windows/AI Models/LLMs/GGUF/Qwen3.6-27B-mmproj-BF16.gguf
    activation_profile: kv-q5-q4
    context_window: 205824
    description: Default LLM, reasoning off (low-latency)
    sampling:
      temperature: 0.6
      top_p: 0.95
      top_k: 20
      min_p: 0.0
      presence_penalty: 0.0
      repetition_penalty: 1.0
  vision:
    backend: tabby
    description: Vision-capable EXL3 model (when tabbyapi.service is active on :5050)
  rp:
    backend: kobold
    model: /media/windows/AI Models/LLMs/GGUF/Huihui-Qwen3.6-27B-abliterated-UD-Q4_K_XL-MTP.gguf
    mmproj: /media/windows/AI Models/LLMs/GGUF/Qwen3.6-27B-mmproj-BF16.gguf
    activation_profile: kv-q5-q4-rp
    context_window: 217088
    description: Roleplay LLM (Huihui Qwen3.6-27B abliterated UD-Q4_K_XL MTP)
    # Qwen3.6 non-thinking/instruct mode — from official Qwen team recommendations
    sampling:
      temperature: 0.7
      top_p: 0.80
      top_k: 20
      min_p: 0.0
      presence_penalty: 1.5
      repetition_penalty: 1.0
  coder:
    backend: kobold
    model: /media/windows/AI Models/LLMs/GGUF/Qwen3.6-27B-UD-Q4_K_XL-mtp.gguf
    mmproj: /media/windows/AI Models/LLMs/GGUF/Qwen3.6-27B-mmproj-BF16.gguf
    activation_profile: kv-q5-q4
    context_window: 205824
    description: Coding LLM (Qwen3.6-27B UD-Q4_K_XL MTP via local llama.cpp)
    # Qwen3.6 thinking mode for coding — from official Qwen team recommendations
    sampling:
      temperature: 0.6
      top_p: 0.95
      top_k: 20
      min_p: 0.0
      presence_penalty: 0.0
      repetition_penalty: 1.0
  coder-q5:
    backend: kobold
    model: /media/windows/AI Models/LLMs/GGUF/Qwen3.6-27B-UD-Q4_K_XL-mtp.gguf
    mmproj: /media/windows/AI Models/LLMs/GGUF/Qwen3.6-27B-mmproj-BF16.gguf
    activation_profile: kv-q5-q4
    context_window: 205824
    description: Coding LLM with balanced Q5_0 K / Q4_1 V cache
    sampling:
      temperature: 0.6
      top_p: 0.95
      top_k: 20
      min_p: 0.0
      presence_penalty: 0.0
      repetition_penalty: 1.0
  coder-q8:
    backend: kobold
    model: /media/windows/AI Models/LLMs/GGUF/Qwen3.6-27B-UD-Q4_K_XL-mtp.gguf
    mmproj: /media/windows/AI Models/LLMs/GGUF/Qwen3.6-27B-mmproj-BF16.gguf
    activation_profile: kv-q8
    context_window: 145408
    description: Coding LLM with conservative Q8_0 K / Q8_0 V cache
    sampling:
      temperature: 0.6
      top_p: 0.95
      top_k: 20
      min_p: 0.0
      presence_penalty: 0.0
      repetition_penalty: 1.0
  coder-unchained:
    backend: kobold
    model: /media/windows/AI Models/LLMs/GGUF/Huihui-Qwen3.6-27B-abliterated-UD-Q4_K_XL-MTP.gguf
    mmproj: /media/windows/AI Models/LLMs/GGUF/Qwen3.6-27B-mmproj-BF16.gguf
    activation_profile: kv-q5-q4
    context_window: 205824
    description: Coding LLM - abliterated (Huihui Qwen3.6-27B abliterated UD-Q4_K_XL MTP)
    sampling:
      temperature: 0.6
      top_p: 0.95
      top_k: 20
      min_p: 0.0
      presence_penalty: 0.0
      repetition_penalty: 1.0
# Optional catalog of additional GGUF aliases. Each entry becomes a selectable
# model in /v1/models — clients send `model: "<id>"` and the proxy resolves it
# through the same ensure_target() path as roles: (cold-swap on first use).
# Use roles: for canonical workflows; use models: for ad-hoc/extra GGUFs you
# want to expose without inventing a new role.
models:
  - id: heretic-v2
    backend: kobold
    path: /media/windows/AI Models/LLMs/GGUF/Qwen3.6-27B-uncensored-heretic-v2-Q4_K_M.gguf
    mmproj: /media/windows/AI Models/LLMs/GGUF/Qwen3.6-27B-mmproj-BF16.gguf
    description: "Qwen3.6-27B Uncensored Heretic v2 (Q4_K_M)"
  - id: cydonia-24b
    backend: kobold
    path: /media/windows/AI Models/LLMs/GGUF/TheDrummer_Cydonia-24B-v4.3-Q6_K.gguf
    mmproj: null # 24B Cydonia is text-only — no companion mmproj on disk
    description: "TheDrummer Cydonia 24B v4.3 (Q6_K, text-only)"
  - id: qwen3-35b-a3b
    backend: kobold
    path: /media/windows/AI Models/LLMs/GGUF/Qwen3.6-35B-A3B-UD-IQ4_XS.gguf
    mmproj: null # 35B MoE has no companion mmproj on disk (text-only)
    description: "Qwen3.6-35B-A3B UD-IQ4_XS (MoE, text-only)"
videos:
  default_workflow: video-ltx-2.3-distilled
  workflows:
    video-ltx-2.3-distilled:
      file: workflows/video-ltx-2.3-distilled.json
      min_seconds: 1
      max_seconds: 8
      max_size: 1280x720
      frame_rate: 24
      # Duration granularity ~0.333s (LTX 8N+1 latent stride at 24 fps).
      # Proxy rounds requested seconds to the nearest representable length and
      # surfaces any drift via the X-Duration-Adjusted response header.
    video-ltx-2.3-detail:
      file: workflows/video-ltx-2.3-detail.json
      min_seconds: 1
      max_seconds: 8
      max_size: 1280x720
      frame_rate: 24
    video-ltx-2.3-pure-distilled:
      file: workflows/video-ltx-2.3-pure-distilled.json
      min_seconds: 1
      max_seconds: 8
      max_size: 1280x720
      frame_rate: 24
    video-wan-2.2-ti2v-5b-q8:
      file: workflows/video-wan-2.2-ti2v-5b-q8.json
      min_seconds: 1
      max_seconds: 5
      max_size: 1280x704
      frame_rate: 24
      # Same 8N+1 latent stride as LTX. Granularity ~0.333s at 24 fps.
    video-ltx-2.3-long:
      file: workflows/video-ltx-2.3-long.json
      # Long-form is intrinsically ≥2 chunks (the easy forLoopStart body runs
      # once even when LOOPS=0, so actual_seconds = chunk_seconds * (LOOPS + 2)).
      # Minimum at LENGTH=1, LOOPS=0 is ~2.08s. Use ltx-2.3-distilled for <2s.
      min_seconds: 2
      max_seconds: 50
      max_size: 1280x720
      frame_rate: 24
      # Multi-chunk granularity. Drift typically <0.21s; surfaced via
      # X-Duration-Adjusted header.
  aliases:
    ltx-2.3: video-ltx-2.3-distilled
    ltx-2.3-distilled: video-ltx-2.3-distilled
    ltx-2.3-fast: video-ltx-2.3-pure-distilled
    ltx-2.3-distilled-fast: video-ltx-2.3-pure-distilled
    ltx-2.3-pure-distilled: video-ltx-2.3-pure-distilled
    ltx-2.3-22b: video-ltx-2.3-distilled
    ltx-2.3-detail: video-ltx-2.3-detail
    ltx-2.3-long: video-ltx-2.3-long
    ltx-2.3-long-form: video-ltx-2.3-long
    wan-2.2: video-wan-2.2-ti2v-5b-q8
    wan-2.2-ti2v-5b: video-wan-2.2-ti2v-5b-q8
    sora-2: video-ltx-2.3-distilled
    sora-2-pro: video-ltx-2.3-distilled
audio:
  default_workflow: ace-step-1.5-xl-turbo
  workflows_dir: ./workflows/audio
  workflows:
    ace-step-1.5-2b-base:
      file: workflows/audio/ace-step-1.5-2b-base.json
      max_seconds: 300
      min_seconds: 1
    ace-step-1.5-xl-turbo:
