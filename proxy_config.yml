proxy:
  host: 0.0.0.0
  port: 5000
llm:
  pin_loaded_model: false
backends:
  openai-proxy:
    name: openai-proxy (self)
    native_passthrough: false
    host: 127.0.0.1
    port: 5000
    health_endpoint: /health
    role: required
    managed: false
  tabby:
    name: TabbyAPI (Qwen3-VL)
    native_passthrough: true
    protocol: openai-compatible
    base_path: /v1
    api_key_env: TABBY_API_KEY
    host: 127.0.0.1
    port: 5050
    model_id: qwen3-vl-30b
    health_endpoint: /v1/models
    # Downstream auth injection (DATA — replaces the old hardcoded apply_tabby_auth):
    # TabbyAPI wants the admin key for model-list endpoints, the api key otherwise.
    # First matching rule wins; secret resolves per-identity, falling back to env.
    auth_inject:
      - paths: ["/v1/models", "/v1/model/list"]
        header: x-admin-key
        secret: admin_key
        secret_env: TABBY_ADMIN_KEY
      - header: x-api-key
        secret: api_key
        secret_env: TABBY_API_KEY
    load_timeout: 300
    idle_timeout: 0
    role: standby
    note: "On-demand vision backend; cold-started by ensure_target() when a vision-capable role is invoked. Down at idle is expected."
    capabilities:
      - vision
      - chat
      - completions
    managed: false
    lifecycle:
      driver: http-load-unload
      driver_config:
        load_url: /v1/model/load
        unload_url: /v1/model/unload
        admin_header: x-admin-key
        admin_key_env: TABBY_ADMIN_KEY
        load_body_params: tabby-config
        load_timeout_s: 300
        success_marker: '"status":"finished"'
        verify_endpoint: /v1/model
        # activation_model_key defaults to "model_name" (omitted = use default).
  kobold:
    name: BeeLlama (LLM + MTP)
    native_passthrough: true
    protocol: openai-compatible
    base_path: /v1
    host: 127.0.0.1
    port: 5051
    state_type: llama_cpp
    health_endpoint: /v1/models
    models:
      - id: default
        model_group: default
        upstream_model: Qwen3.6-27B-UD-Q4_K_XL-mtp.gguf
        activation_model: /media/windows/AI Models/LLMs/GGUF/Qwen3.6-27B-UD-Q4_K_XL-mtp.gguf
        activation_mmproj: /media/windows/AI Models/LLMs/GGUF/Qwen3.6-27B-mmproj-BF16.gguf
      - id: coder
        model_group: coder
        upstream_model: Qwen3.6-27B-UD-Q4_K_XL-mtp.gguf
        activation_model: /media/windows/AI Models/LLMs/GGUF/Qwen3.6-27B-UD-Q4_K_XL-mtp.gguf
        activation_mmproj: /media/windows/AI Models/LLMs/GGUF/Qwen3.6-27B-mmproj-BF16.gguf
      # Same GGUF as default; the matching roles.default-fast entry adds
      # reasoning_effort:none (thinking off). Registered here so LiteLLM accepts
      # the model name and it appears in /v1/models for header-less clients.
      - id: default-fast
        model_group: default-fast
        upstream_model: Qwen3.6-27B-UD-Q4_K_XL-mtp.gguf
        activation_model: /media/windows/AI Models/LLMs/GGUF/Qwen3.6-27B-UD-Q4_K_XL-mtp.gguf
        activation_mmproj: /media/windows/AI Models/LLMs/GGUF/Qwen3.6-27B-mmproj-BF16.gguf
      - id: rp
        model_group: rp
        upstream_model: Huihui-Qwen3.6-27B-abliterated-UD-Q4_K_XL-MTP.gguf
        activation_model: /media/windows/AI Models/LLMs/GGUF/Huihui-Qwen3.6-27B-abliterated-UD-Q4_K_XL-MTP.gguf
        activation_mmproj: /media/windows/AI Models/LLMs/GGUF/Qwen3.6-27B-mmproj-BF16.gguf
    role: required
    capabilities:
      - openai
      - chat
      - completions
    managed: false
    lifecycle:
      driver: systemd
      driver_config:
        scope: user
        unit: llama-bee.service
        dropin: 20-model.conf
        swap_strategy: dropin-env-restart
        health_endpoint: /v1/models
        health_timeout_s: 60
        # Activation env-key mapping — LLAMA_BEE_* names as DATA, not code.
        activation_env_keys:
          model: LLAMA_BEE_MODEL
          aux: LLAMA_BEE_MMPROJ
        # Precheck type: validate model is an absolute, existing .gguf path.
        precheck: gguf_path
  tts:
    name: voxtral-int4-tts
    native_passthrough: true
    host: 127.0.0.1
    port: 8001
    health_endpoint: /health
    timeout: 86400
    role: required
    capabilities:
      - audio
      - speech
    managed: false
  stt:
    name: parakeet-stt
    native_passthrough: true
    host: 127.0.0.1
    port: 5092
    health_endpoint: /health
    timeout: 120
    role: required
    capabilities:
      - audio
      - transcriptions
    managed: false
  embeddings:
    name: nomic-embed-text-v1.5 CPU
    native_passthrough: true
    protocol: openai-compatible
    base_path: /v1
    host: 127.0.0.1
    port: 5061
    model_id: nomic-embed-text-v1.5
    models:
      - id: nomic-embed-text-v1.5
        model_group: nomic-embed-text-v1.5
        upstream_model: nomic-embed-text-v1.5.f16.gguf
    health_endpoint: /health
    timeout: 120
    role: required
    note: "CPU-only llama-server embedding backend; no GPU budget claim."
    capabilities:
      - openai
      - embeddings
    resources:
      gpu_required: false
      vram_gb_estimate: 0
      duration_class: interactive
      max_parallel: 4
    managed: false
  comfyui:
    name: ComfyUI (Image + Video Generation)
    native_passthrough: true
    host: 127.0.0.1
    port: 7890
    health_endpoint: /system_stats
    timeout: 300
    workflows_dir: ./workflows/images
    default_model: flux2-klein-4b
    video_workflows_dir: ./workflows
    video_timeout: 1800
    role: required
    capabilities:
      - images
      - generations
      - videos
    managed: false
images:
  # Cache for `response_format: "url"` and content-addressed image storage.
  cache_dir: cache/images
  # Persistent VRAM-per-(workflow,size) measurements used for adaptive batching.
  vram_estimates_file: cache/vram_estimates.json
  # Signed URL TTL (seconds). Default 1 hour.
  signed_url_ttl: 3600
  # HMAC secret for signed URLs. If unset/empty, generated at first run and persisted
  # to <cache_dir>/.url_signing_secret with mode 0600.
  signed_url_secret: ""
  # Background eviction TTL for cached image bytes (seconds).
  cache_ttl: 86400
  # How often the eviction task runs (seconds).
  cache_eviction_interval: 3600
  # Reserve this many bytes of free VRAM as a safety margin when computing batch size.
  vram_reserve_bytes: 1073741824 # 1 GiB
  # Hard ceiling on batch_size per ComfyUI prompt regardless of VRAM headroom.
  max_batch_size: 4
  # Supports OpenAI's background option: transparent, opaque, or auto. The
  # RMBG graph lives inside each workflow; the proxy only selects the
  # workflow-declared output. `auto` uses an LLM decision.
  background_removal:
    enabled: true
    decision_timeout: 45
model_routing:
  model_dir: /media/windows/AI Models/LLMs
  gguf_dir: /media/windows/AI Models/LLMs/GGUF
  tabby_service: tabbyapi.service
  kobold_service: llama-bee.service
  kobold_service_legacy: llama-turbo.service
  switch_timeout: 60
  # Per-chunk (idle) read timeout for /v1/chat/completions and /v1/completions
  # forwarding. NOT a wall-clock cap — this is the max silence between bytes
  # from the backend. Covers prompt-processing latency on reasoning/vision
  # models (Qwen3.6 27B PP on a 4K-token vision prompt ≈ 150s). 600s is well
  # past any legitimate work and tight enough to release a wedged backend.
  # Env override: UPSTREAM_READ_TIMEOUT.
  upstream_read_timeout: 600
routing:
  default_backend: kobold
  audio_backend: tts
  check_interval: 30
roles:
  default:
    backend: kobold
    model: /media/windows/AI Models/LLMs/GGUF/Qwen3.6-27B-UD-Q4_K_XL-mtp.gguf
    mmproj: /media/windows/AI Models/LLMs/GGUF/Qwen3.6-27B-mmproj-BF16.gguf
    description: Default LLM (Qwen3.6-27B UD-Q4_K_XL MTP via BeeLlama on :5051)
    # Qwen3.6 thinking mode for coding — from official Qwen team recommendations
    sampling:
      temperature: 0.6
      top_p: 0.95
      top_k: 20
      min_p: 0.0
      presence_penalty: 0.0
      repetition_penalty: 1.0
  # Same model as `default`, reasoning OFF — for latency-sensitive or header-less
  # clients (e.g. dictation cleanup) that can only pick a model name. The
  # intent-level `reasoning_effort: none` routes onto the no-think path (the Qwen
  # chat transform turns it into thinking-off), cutting a short call from ~8s to ~1s.
  default-fast:
    backend: kobold
    model: /media/windows/AI Models/LLMs/GGUF/Qwen3.6-27B-UD-Q4_K_XL-mtp.gguf
    mmproj: /media/windows/AI Models/LLMs/GGUF/Qwen3.6-27B-mmproj-BF16.gguf
    description: Default LLM, reasoning off (low-latency)
    sampling:
      reasoning_effort: none
      temperature: 0.6
      top_p: 0.95
      top_k: 20
      min_p: 0.0
      presence_penalty: 0.0
      repetition_penalty: 1.0
  vision:
    backend: tabby
    description: Vision-capable EXL3 model (when tabbyapi.service is active on :5050)
  rp:
    backend: kobold
    model: /media/windows/AI Models/LLMs/GGUF/Huihui-Qwen3.6-27B-abliterated-UD-Q4_K_XL-MTP.gguf
    mmproj: /media/windows/AI Models/LLMs/GGUF/Qwen3.6-27B-mmproj-BF16.gguf
    description: Roleplay LLM (Huihui Qwen3.6-27B abliterated UD-Q4_K_XL MTP)
    # Qwen3.6 non-thinking/instruct mode — from official Qwen team recommendations
    sampling:
      temperature: 0.7
      top_p: 0.80
      top_k: 20
      min_p: 0.0
      presence_penalty: 1.5
      repetition_penalty: 1.0
  coder:
    backend: kobold
    model: /media/windows/AI Models/LLMs/GGUF/Qwen3.6-27B-UD-Q4_K_XL-mtp.gguf
    mmproj: /media/windows/AI Models/LLMs/GGUF/Qwen3.6-27B-mmproj-BF16.gguf
    description: Coding LLM (Qwen3.6-27B UD-Q4_K_XL MTP via BeeLlama)
    # Qwen3.6 thinking mode for coding — from official Qwen team recommendations
    sampling:
      temperature: 0.6
      top_p: 0.95
      top_k: 20
      min_p: 0.0
      presence_penalty: 0.0
      repetition_penalty: 1.0
# Optional catalog of additional GGUF aliases. Each entry becomes a selectable
# model in /v1/models — clients send `model: "<id>"` and the proxy resolves it
# through the same ensure_target() path as roles: (cold-swap on first use).
# Use roles: for canonical workflows; use models: for ad-hoc/extra GGUFs you
# want to expose without inventing a new role.
models:
  - id: heretic-v2
    backend: kobold
    path: /media/windows/AI Models/LLMs/GGUF/Qwen3.6-27B-uncensored-heretic-v2-Q4_K_M.gguf
    mmproj: /media/windows/AI Models/LLMs/GGUF/Qwen3.6-27B-mmproj-BF16.gguf
    description: "Qwen3.6-27B Uncensored Heretic v2 (Q4_K_M)"
  - id: cydonia-24b
    backend: kobold
    path: /media/windows/AI Models/LLMs/GGUF/TheDrummer_Cydonia-24B-v4.3-Q6_K.gguf
    mmproj: null # 24B Cydonia is text-only — no companion mmproj on disk
    description: "TheDrummer Cydonia 24B v4.3 (Q6_K, text-only)"
  - id: qwen3-35b-a3b
    backend: kobold
    path: /media/windows/AI Models/LLMs/GGUF/Qwen3.6-35B-A3B-UD-IQ4_XS.gguf
    mmproj: null # 35B MoE has no companion mmproj on disk (text-only)
    description: "Qwen3.6-35B-A3B UD-IQ4_XS (MoE, text-only)"
videos:
  default_workflow: video-ltx-2.3-distilled
  workflows:
    video-ltx-2.3-distilled:
      file: workflows/video-ltx-2.3-distilled.json
      min_seconds: 1
      max_seconds: 8
      max_size: 1280x720
      frame_rate: 24
      # Duration granularity ~0.333s (LTX 8N+1 latent stride at 24 fps).
      # Proxy rounds requested seconds to the nearest representable length and
      # surfaces any drift via the X-Duration-Adjusted response header.
    video-ltx-2.3-detail:
      file: workflows/video-ltx-2.3-detail.json
      min_seconds: 1
      max_seconds: 8
      max_size: 1280x720
      frame_rate: 24
    video-ltx-2.3-pure-distilled:
      file: workflows/video-ltx-2.3-pure-distilled.json
      min_seconds: 1
      max_seconds: 8
      max_size: 1280x720
      frame_rate: 24
    video-wan-2.2-ti2v-5b-q8:
      file: workflows/video-wan-2.2-ti2v-5b-q8.json
      min_seconds: 1
      max_seconds: 5
      max_size: 1280x704
      frame_rate: 24
      # Same 8N+1 latent stride as LTX. Granularity ~0.333s at 24 fps.
    video-ltx-2.3-long:
      file: workflows/video-ltx-2.3-long.json
      # Long-form is intrinsically ≥2 chunks (the easy forLoopStart body runs
      # once even when LOOPS=0, so actual_seconds = chunk_seconds * (LOOPS + 2)).
      # Minimum at LENGTH=1, LOOPS=0 is ~2.08s. Use ltx-2.3-distilled for <2s.
      min_seconds: 2
      max_seconds: 50
      max_size: 1280x720
      frame_rate: 24
      # Multi-chunk granularity. Drift typically <0.21s; surfaced via
      # X-Duration-Adjusted header.
  aliases:
    ltx-2.3: video-ltx-2.3-distilled
    ltx-2.3-distilled: video-ltx-2.3-distilled
    ltx-2.3-fast: video-ltx-2.3-pure-distilled
    ltx-2.3-distilled-fast: video-ltx-2.3-pure-distilled
    ltx-2.3-pure-distilled: video-ltx-2.3-pure-distilled
    ltx-2.3-22b: video-ltx-2.3-distilled
    ltx-2.3-detail: video-ltx-2.3-detail
    ltx-2.3-long: video-ltx-2.3-long
    ltx-2.3-long-form: video-ltx-2.3-long
    wan-2.2: video-wan-2.2-ti2v-5b-q8
    wan-2.2-ti2v-5b: video-wan-2.2-ti2v-5b-q8
    sora-2: video-ltx-2.3-distilled
    sora-2-pro: video-ltx-2.3-distilled
audio:
  default_workflow: ace-step-1.5-xl-turbo
  workflows_dir: ./workflows/audio
  workflows:
    ace-step-1.5-2b-base:
      file: workflows/audio/ace-step-1.5-2b-base.json
      max_seconds: 300
      min_seconds: 1
    ace-step-1.5-xl-turbo:
      file: workflows/audio/ace-step-1.5-xl-turbo.json
      max_seconds: 300
      min_seconds: 1
    tangoflux:
      file: workflows/audio/tangoflux.json
      max_seconds: 30
      min_seconds: 0.5
  aliases:
    ace-step: ace-step-1.5-xl-turbo
    ace-step-1.5: ace-step-1.5-xl-turbo
    ace-step-xl: ace-step-1.5-xl-turbo
    ace-step-2b: ace-step-1.5-2b-base
    music: ace-step-1.5-xl-turbo
    tangoflux-sfx: tangoflux
    sfx: tangoflux
    ambient: tangoflux
model_compatibility:
  enabled: true
  generated_aliases_file: openai_model_aliases.generated.yml
  openai_models_api_url: https://api.openai.com/v1/models
  include_private: false
  defaults:
    chat: ""
    completions: ""
    speech: mistralai/Voxtral-4B-TTS-2603
    transcriptions: parakeet-tdt-0.6b-v3
    embeddings: nomic-embed-text-v1.5
    images: flux2-klein-4b
    image_edits: flux2-klein-4b-edit
  aliases:
    nomic-embed-text-v1.5:
      category: embeddings
    nomic-embed-text-v1.5.f16.gguf:
      category: embeddings
auth:
  enabled: true
  public_paths:
    - /health
  api_key_env: TABBY_API_KEY
  admin_key_env: TABBY_ADMIN_KEY
  # Set to true to allow unauthenticated access to Ollama read-only discovery
  # routes (/api/tags, /api/version and their /ollama/api/* aliases).
  # Matches how a local Ollama daemon behaves so Open WebUI / LM Studio can
  # auto-discover models without bearer token wiring.
  # Default: false — keep off on internet-facing gateways.
  # Env override: OLLAMA_COMPAT_DISCOVERY=true
  ollama_compat_discovery: false

  # ---- Optional frictionless-auth features (all OFF by default) -------------
  # With every option below left at its default, auth is unchanged: a valid
  # Authorization: Bearer / x-api-key is required on every non-public route.
  #
  # 1) LAN / localhost bypass — clients whose REAL IP is in lan_bypass_cidrs skip
  #    the API key. The public URL still requires it. Real IP defaults to the raw
  #    TCP socket peer; X-Forwarded-For is honored ONLY from proxies you list in
  #    trusted_proxies (rightmost-first, spoof-resistant).
  #      lan_bypass_enabled: true
  #      lan_bypass_cidrs: ["127.0.0.0/8", "::1/128", "192.168.0.0/16", "10.0.0.0/8", "100.64.0.0/10"]
  #      trusted_proxies: ["127.0.0.1"]      # your reverse proxy's IP/CIDR; empty = no proxy
  #    Env overrides: OPENAI_PROXY_LAN_BYPASS=true
  lan_bypass_enabled: true
  lan_bypass_cidrs: ["127.0.0.0/8", "::1/128", "192.168.0.0/16", "10.0.0.0/8", "100.64.0.0/10"]
  trusted_proxies: ["192.168.1.4"]
  #
  # Cloudflare Tunnel: honor CF-Connecting-IP, but ONLY when the connection comes
  # from a verified Cloudflare edge IP (ranges fetched at startup; fail-closed).
  #   Env override: OPENAI_PROXY_CF_MODE=true
  cloudflare_mode: false
  #
  # 2) Query-param key — for clients with no auth-header field (e.g. dictation
  #    apps): accept ?api_key=<key>. Note: appears in some logs; redact upstream.
  #    Env override: OPENAI_PROXY_QUERY_PARAM_KEY=true
  allow_query_param_key: false
  #
  # 3) Per-device path tokens — the URL path IS the credential, e.g. base URL
  #    https://host/tok_livingroom/v1 . Each token is independently revocable.
  #      path_tokens:
  #        tok_livingroom: living-room-speaker
  #        tok_workshop: workshop-pi
  path_tokens: {}
admin:
  db_path: data/admin.db
  # Deployment brand (data, not product code). A generic install shows only the
  # neutral product label; this deployment opts into the vivid.fish wordmark.
  brand:
    product: AI Gateway
    wordmark: vivid.fish
