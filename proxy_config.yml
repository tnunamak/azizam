    mmproj: /media/windows/AI Models/LLMs/GGUF/Qwen3.8-27B-Uncensored-mmproj-F16.gguf
    activation_profile: kv-q5-q4
    context_window: 202752
    description: Coding LLM (Qwen3.8-27B-Uncensored Q4_K_M via local llama.cpp)
    # Qwen3.8 thinking mode — from official Qwen team recommendations. Qwen3.6's
    # card had a separate lower-temperature override for precise coding tasks;
    # Qwen3.8's card dropped that distinction and lists only this one setting.
    sampling:
      temperature: 1.0
      top_p: 0.95
      top_k: 20
      min_p: 0.0
