  decisions:
    name: Local decisions
    host: 127.0.0.1
    port: 8023
    health_endpoint: /health
    timeout: 120
    priority: 200
    role: standby
    capabilities: [decisions]
    managed: false
    default_model: decider-2b-v11
    placement: cpu
    residency: on_demand
    note: "On-demand CPU decision service (observed about 2.9 GiB RSS for narrow readouts, up to 5.84 GiB for 255-option full-vocab readout); configurable CUDA placement with CPU startup fallback."
    lifecycle:
      driver: systemd
      driver_config:
        scope: user
        unit: decider.service
        health_endpoint: /health
        health_timeout_s: 90
  decisions-quality:
    name: Local quality decisions
    host: 127.0.0.1
    port: 8025
    health_endpoint: /health
    timeout: 120
    priority: 200
    role: standby
    capabilities: [decisions]
    managed: false
    default_model: decider-4b-v2.1
    placement: cpu
    residency: on_demand
    note: "Opt-in CPU decision service (4B memory budget is unmeasured; unit starts at 10G); exits after 10 minutes idle."
    lifecycle:
      driver: systemd
      driver_config:
        scope: user
        unit: decider-quality.service
        health_endpoint: /health
        health_timeout_s: 90
  realtime:
    name: speech-to-speech
    display_name: Realtime voice
    host: 127.0.0.1
    port: 8022
    health_endpoint: /v1/pool
    timeout: 120
    # Higher number = lower priority: nothing else serves realtime, but the on-demand services stay behind the always-on ones.
    priority: 200
    role: standby
    note: "OpenAI Realtime (WebSocket) served by Hugging Face speech-to-speech on CPU (Silero VAD, Smart Turn). Its STT, LLM and TTS slots call this gateway's own routes. Started by the gateway lifecycle driver; the gateway relays /v1/realtime to it."
    capabilities:
      - realtime
    managed: false
    lifecycle:
      driver: systemd
      driver_config:
        scope: user
        unit: speech-to-speech.service
        health_endpoint: /v1/pool
        health_timeout_s: 120
  embeddings:
    name: nomic-embed-text-v1.5 CPU
    native_passthrough: true
    protocol: openai-compatible
    base_path: /v1
    host: 127.0.0.1
    port: 5061
    model_id: nomic-embed-text-v1.5
    models:
      - id: nomic-embed-text-v1.5
        model_group: nomic-embed-text-v1.5
        upstream_model: nomic-embed-text-v1.5.f16.gguf
    health_endpoint: /health
    timeout: 120
    role: required
    note: "CPU-only llama-server embedding backend; no GPU budget claim."
    capabilities:
      - openai
      - embeddings
    resources:
      gpu_required: false
      vram_gb_estimate: 0
      duration_class: interactive
      max_parallel: 4
    managed: false
  comfyui:
    name: ComfyUI (Image + Video Generation)
    native_passthrough: true
    host: 127.0.0.1
    port: 7890
    health_endpoint: /system_stats
    health_success_path: system
    timeout: 300
    workflows_dir: ./workflows/images
    default_model: krea2-turbo
    video_workflows_dir: ./workflows
    video_timeout: 1800
    role: required
    capabilities:
      - images
      - generations
      - videos
    managed: false
images:
  # Cache for `response_format: "url"` and content-addressed image storage.
  cache_dir: cache/images
  # Persistent VRAM-per-(workflow,size) measurements used for adaptive batching.
  vram_estimates_file: cache/vram_estimates.json
  # Signed URL TTL (seconds). Default 1 hour.
  signed_url_ttl: 3600
  # HMAC secret for signed URLs. If unset/empty, generated at first run and persisted
  # to <cache_dir>/.url_signing_secret with mode 0600.
  signed_url_secret: ""
  # Background eviction TTL for cached image bytes (seconds).
  cache_ttl: 86400
  # How often the eviction task runs (seconds).
  cache_eviction_interval: 3600
  # Reserve this many bytes of free VRAM as a safety margin when computing batch size.
  vram_reserve_bytes: 1073741824 # 1 GiB
  # Unload idle ComfyUI models once when admission or a CUDA OOM indicates
  # that the current residency blocks the requested workflow.
  free_vram_on_exhaustion: true
  # Hard ceiling on batch_size per ComfyUI prompt regardless of VRAM headroom.
  max_batch_size: 4
  # Supports OpenAI's background option: transparent, opaque, or auto. The
  # RMBG graph lives inside each workflow; the proxy only selects the
  # workflow-declared output. `auto` uses an LLM decision.
  background_removal:
    enabled: true
    decision_timeout: 45
  # /v1/images/variations has no local "true" variations model: there is no
  # prompt in the OpenAI variations request, so the gateway routes it through
  # an edit-capable workflow with a fixed generic prompt instead. Any workflow
  # id here gets "-edit"/"-inpaint" suffixed the same way the edit route does
  # if it isn't already suffixed.
  variations:
    default_workflow: qwen-image-2.1-edit
    # Partial-denoise strength applies only when the resolved workflow's
    # manifest declares a `denoise` input; otherwise its own default stands.
    denoise: 0.75
  edits:
    # Used only for multi-image requests that otherwise resolve to the default
    # edit workflow. Explicit model choices remain pinned to that workflow.
    multiref_default_workflow: qwen-image-2.1-edit-multiref
model_routing:
  model_dir: /media/windows/AI Models/LLMs
  gguf_dir: /media/windows/AI Models/LLMs/GGUF
  tabby_service: tabbyapi.service
  kobold_service: llama-bee.service
  kobold_service_legacy: llama-turbo.service
  switch_timeout: 60
  # Per-chunk (idle) read timeout for /v1/chat/completions and /v1/completions
  # forwarding. NOT a wall-clock cap — this is the max silence between bytes
  # from the backend. Covers prompt-processing latency on reasoning/vision
  # models (Qwen3.6 27B PP on a 4K-token vision prompt ≈ 150s). The local server
  # currently buffers tool-call argument JSON, so a legitimate 16K-token write
  # can produce no upstream bytes for far longer than five minutes. Keep the
  # finite liveness boundary here, above the worst credible full completion,
  # while Pi's client-side idle timeout is disabled for this local backend.
  # Env override: UPSTREAM_READ_TIMEOUT.
  upstream_read_timeout: 1800
routing:
  default_backend: kobold
  audio_backend: tts
  check_interval: 30

identity:
  # CPU face sidecar (services/face-service) used by the likeness check and image-identity.
  # Declared here, not under backends:, so an already-seeded service registry needs no change.
  # The gateway starts the user unit on demand; the sidecar exits after 15 idle minutes.
  face_service:
    host: 127.0.0.1
    port: 8021
    health_endpoint: /health
    timeout: 120
    lifecycle:
      driver: systemd
      driver_config:
        scope: user
        unit: face-service.service
        health_endpoint: /health
        health_timeout_s: 120

# Local reasoning policy. Pi sends qualitative effort; the native gateway
# translates it to the local server's numeric per-request thinking budget.
reasoning:
  default_effort: high
  effort_budgets:
    none: 0
    minimal: 2048
    low: 4096
    medium: 6144
    high: 8192
    xhigh: unlimited
roles:
  default:
    backend: kobold
    model: /media/windows/AI Models/LLMs/GGUF/Qwen3.8-27B-Uncensored-Q4_K_M.gguf
    mmproj: /media/windows/AI Models/LLMs/GGUF/Qwen3.8-27B-Uncensored-mmproj-F16.gguf
    activation_profile: kv-q5-q4
    context_window: 202752
    description: Default LLM (Qwen3.8-27B-Uncensored Q4_K_M via local llama.cpp on :5051)
    # Qwen3.8 thinking mode — from official Qwen team recommendations. Qwen3.6's
    # card had a separate lower-temperature override for precise coding tasks;
