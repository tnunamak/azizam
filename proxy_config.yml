# Optional catalog of additional GGUF aliases. Each entry becomes a selectable
# model in /v1/models — clients send `model: "<id>"` and the proxy resolves it
# through the same ensure_target() path as roles: (cold-swap on first use).
# Use roles: for canonical workflows; use models: for ad-hoc/extra GGUFs you
# want to expose without inventing a new role.
models:
  - id: cydonia-24b
    backend: kobold
    path: /media/windows/AI Models/LLMs/GGUF/TheDrummer_Cydonia-24B-v4.3-Q6_K.gguf
    mmproj: null # 24B Cydonia is text-only — no companion mmproj on disk
    description: "TheDrummer Cydonia 24B v4.3 (Q6_K, text-only)"
videos:
  default_workflow: video-ltx-2.5-t2v
  # Workflow that POST /v1/videos/{id}/remix and POST /v1/videos/edits run.
  # Unset means both return 501 video_remix_not_configured. Keep the
  # `video-remix` alias below (and in model_aliases.videos.stable) pointing at
  # the same workflow.
  remix_workflow: video-bernini-r-remix
  # Long video. POST /v1/videos/extensions runs this chain workflow (unset: 501
  # video_extend_not_configured). `max_total_seconds` caps the stitched length of
  # any chain, source included; beyond it requests get 400
  # video_total_length_exceeded. Segments are at most `chain_segment_seconds`.
  extend_workflow: video-ltx-2.5-long
  max_total_seconds: 40
  # Videos made before job records were persisted have no owner on file, so keyed
  # callers get 404 for them. Set true for a while to keep them readable (any key).
  allow_untracked_ids: false
  chain_segment_seconds: 8
  workflows:
    # LTX-2.5 (default). Separate t2v/i2v graphs: a request with input_reference
    # is routed to `i2v_workflow`. Width/height are floored to multiples of 64
    # (stage 1 runs at half size). Frames are 8k+1. Measured on a 3090: 960x512
    # 5 s = 45 s warm / 107 s cold; 1280x704 = 139 s; i2v 85 s. Gateway video
    # timeout (comfyui.video_timeout, 1800 s) is far above this.
    video-ltx-2.5-t2v:
      file: workflows/videos/video-ltx-2.5-t2v.json
      i2v_workflow: video-ltx-2.5-i2v
      chain_workflow: video-ltx-2.5-long  # seconds > max_seconds, or `shots`, runs the chain
      min_seconds: 1
      max_seconds: 10
      max_size: 1280x704
      default_size: 960x512
      size_multiple: 64
      frame_rate: 24
    video-ltx-2.5-i2v:
      file: workflows/videos/video-ltx-2.5-i2v.json
      chain_workflow: video-ltx-2.5-long
      requires_input_reference: true
      min_seconds: 1
      max_seconds: 10
      max_size: 1280x704
      default_size: 960x512
      size_multiple: 64
      frame_rate: 24
    # MiniMax H3 (license excludes US/EU/UK/KR). Frames are 17k+5. Measured:
    # 960x544 5 s = 120-250 s (t2v), 185 s (i2v), well under video_timeout.
    video-minimax-h3-t2v:
      file: workflows/videos/video-minimax-h3-t2v.json
      i2v_workflow: video-minimax-h3-i2v
      chain_workflow: video-minimax-h3-long  # seconds > max_seconds, or `shots`, runs the chain
      min_seconds: 2
      max_seconds: 10
      max_size: 1344x768
      default_size: 960x544
      frame_rate: 24
      length_step: 17
      length_offset: 5
    video-minimax-h3-i2v:
      file: workflows/videos/video-minimax-h3-i2v.json
      chain_workflow: video-minimax-h3-long
      requires_input_reference: true
      min_seconds: 2
      max_seconds: 10
      max_size: 1344x768
      default_size: 960x544
      frame_rate: 24
      length_step: 17
      length_offset: 5
    # Video-conditioned workflows. Both need extension inputs (`source_video`,
    # and `reference_image` for character replace), so `requires_extensions`
    # makes the create route insist on them. `source_video_input` names the
    # input that is probed for fps and length. Output frame rate follows the
    # source clip; frames are Wan 4k+1, capped at `max_length`.
    # Bernini-R remix (Wan 2.2 14B high+low Q4_K_M GGUF, lightx2v 6 steps):
    # 81 frames at 832x480 = 462 s warm on the 3090 (benchmarked at 3.4 s).
    video-bernini-r-remix:
      file: workflows/videos/video-bernini-r-remix.json
      requires_extensions: true
      source_video_input: source_video
      min_seconds: 1
      max_seconds: 4
      default_seconds: 3.4
      max_size: 832x480
      default_size: 832x480
      frame_rate: 24
      length_step: 4
      length_offset: 1
      max_length: 97
    # SCAIL-2 character replace (Wan 2.1 14B Q4_K_M GGUF + SAM3.1 tracking):
    # one 81-frame segment at 832x448 = 303 s warm. The driving video must
    # have at least 81 frames; longer clips use their first 81 frames.
    video-scail-2-replace:
      file: workflows/videos/video-scail-2-replace.json
      subject_select: true  # subject_index / source_point_*; warns when several people are tracked
      requires_extensions: true
      source_video_input: source_video
      min_seconds: 1
      max_seconds: 4
      default_seconds: 4
      max_size: 832x448
      default_size: 832x448
      frame_rate: 24
      length_step: 4
      length_offset: 1
      max_length: 81
    # LTX-2.5 long video. Built in code (gateway/video_extend.py), not from a
    # template file: a first segment (or a source video) followed by added
    # segments, each conditioned on the last ~1 s (a latent guide), with its own
    # prompt. Single stage (no x2 upscale), 960x512 by default. Serves
    # `video-long` / `ltx-2.5-long`, `shots`, `seconds` past 10 s on ltx-2.5, and
    # POST /v1/videos/extensions. Total length is capped by videos.max_total_seconds.
    video-ltx-2.5-long:
      builder: ltx25_chain
      # One-segment reference graph, bound by the manifest only; requests build
      # their graph in code (gateway/video_extend.py) and never load this file.
      file: workflows/videos/video-ltx-2.5-long.json
      min_seconds: 1
      max_seconds: 40
      max_size: 1280x720
      default_size: 960x512
      frame_rate: 24
    # MiniMax H3 long video (license as above). Built in code by the `h3_chain`
    # engine (gateway/video_extend_h3.py): segments of up to `chain_segment_seconds`,
    # each pinned to the video so far (latent tail inside a request, decoded tail
    # + audio when extending an existing video) with the H3 Motion Context nodes.
    # Serves `h3-long`, `minimax-h3-long`, `shots` and `seconds` past 10 s on
    # minimax-h3, and POST /v1/videos/extensions on an H3 video. Needs the
    # ComfyUI-H3-Motion-Context custom node (see docs/long-video-design.md).
    video-minimax-h3-long:
      builder: h3_chain
      # One-segment reference graph, bound by the manifest only (as for LTX).
      file: workflows/videos/video-minimax-h3-long.json
      chain_segment_seconds: 10
      min_seconds: 2
      max_seconds: 40
      max_size: 1344x768
      default_size: 960x544
      size_multiple: 32
      frame_rate: 24
    video-wan-2.2-ti2v-5b-q8:
      file: workflows/video-wan-2.2-ti2v-5b-q8.json
      min_seconds: 1
      max_seconds: 5
      max_size: 1280x704
      frame_rate: 24
      # Same 8N+1 latent stride as LTX. Granularity ~0.333s at 24 fps.
  aliases:
    # `default` is substituted only when `model` is OMITTED from the request
    # body, so a client sending the literal string "default" -- which works for
    # chat and images -- was rejected with "Unknown video model/workflow".
    # Register it explicitly so all three surfaces behave the same.
    default: video-ltx-2.5-t2v
    ltx-2.5: video-ltx-2.5-t2v
    ltx-2.5-t2v: video-ltx-2.5-t2v
    ltx-2.5-i2v: video-ltx-2.5-i2v
    minimax-h3: video-minimax-h3-t2v
    minimax-h3-t2v: video-minimax-h3-t2v
    minimax-h3-i2v: video-minimax-h3-i2v
    h3: video-minimax-h3-t2v
    minimax-h3-long: video-minimax-h3-long
    h3-long: video-minimax-h3-long
    ltx-2.5-long: video-ltx-2.5-long
    # Retired LTX-2.3 names. LTX-2.3 is gone; these names keep old clients
    # working by pointing at the LTX-2.5 equivalent of each role.
    ltx-2.3: video-ltx-2.5-t2v
    ltx-2.3-distilled: video-ltx-2.5-t2v
    ltx-2.3-fast: video-ltx-2.5-t2v
    ltx-2.3-distilled-fast: video-ltx-2.5-t2v
    ltx-2.3-pure-distilled: video-ltx-2.5-t2v
    ltx-2.3-22b: video-ltx-2.5-t2v
    ltx-2.3-detail: video-ltx-2.5-t2v
    ltx-2.3-long: video-ltx-2.5-long
    ltx-2.3-long-form: video-ltx-2.5-long
    video-ltx-2.3-distilled: video-ltx-2.5-t2v
    video-ltx-2.3-pure-distilled: video-ltx-2.5-t2v
    video-ltx-2.3-detail: video-ltx-2.5-t2v
    video-ltx-2.3-long: video-ltx-2.5-long
    wan-2.2: video-wan-2.2-ti2v-5b-q8
    wan-2.2-ti2v-5b: video-wan-2.2-ti2v-5b-q8
    video-remix: video-bernini-r-remix
    bernini-r: video-bernini-r-remix
    character-replace: video-scail-2-replace
    scail-2: video-scail-2-replace
audio:
  default_workflow: ace-step-1.5-xl-turbo
  workflows_dir: ./workflows/audio
  workflows:
    ace-step-1.5-2b-base:
      file: workflows/audio/ace-step-1.5-2b-base.json
      max_seconds: 300
      min_seconds: 1
    ace-step-1.5-xl-turbo:
      file: workflows/audio/ace-step-1.5-xl-turbo.json
      max_seconds: 300
      min_seconds: 1
    tangoflux:
      file: workflows/audio/tangoflux.json
      max_seconds: 30
      min_seconds: 1
    # Stable Audio 3 small-sfx: default SFX model (aliases sfx, ambient). Output
    # is quiet, so the gateway peak-normalizes it to -1 dBFS.
    sa3-small-sfx:
      file: workflows/audio/sa3-small-sfx.json
      max_seconds: 120
      min_seconds: 1
      default_duration: 10
      normalize_peak_db: -1.0
    # YuE2-3B song with vocals (license CC BY-NC). `duration` is a MAXIMUM (becomes
    # the model's max_duration); the model picks the real length, usually shorter.
    yue2-song:
      file: workflows/audio/yue2-song.json
      max_seconds: 240
      min_seconds: 10
      default_duration: 120
  aliases:
    ace-step: ace-step-1.5-xl-turbo
    ace-step-1.5: ace-step-1.5-xl-turbo
    ace-step-xl: ace-step-1.5-xl-turbo
    ace-step-2b: ace-step-1.5-2b-base
    tangoflux-sfx: tangoflux
    ambient: sa3-small-sfx
    sa3: sa3-small-sfx
    sa3-sfx: sa3-small-sfx
    stable-audio-3-sfx: sa3-small-sfx
    yue2: yue2-song
    yue: yue2-song
# Stable model aliases: the ONE place that decides what a convenience name means.
# Layer 2 (`stable`) is the gateway's own semantic vocabulary and never changes
# meaning; re-point a name here to change which model serves it. Layer 1
# (`openai`) maps OpenAI model names (ordered globs, first match wins) onto
# layer-2 names, so re-pointing a stable alias also moves the OpenAI names that
# use it. Concrete names (roles, workflow ids, engine ids) always keep working.
# Discovery: GET /v1/models (azizam_alias fields), GET /gateway/v1/aliases,
# and GET /gateway/v1/aliases/resolve?operation=chat&model=gpt-4o (dry run).
# Code: gateway/stable_aliases.py. Docs: docs/LOCAL_CLIENT_RECIPES.md.
model_aliases:
  chat:
    stable:
      default: default        # general chat + vision (Qwen3.8-27B, reasoning on)
      fast: default-fast      # same weights, reasoning off: low latency
      vision: default         # Qwen3.8 has a multimodal projector; images work on default
      coder: coder            # coding profile (same weights, large context)
      rp: rp                  # roleplay model
    openai:
      # Keep OSS model ids that happen to start with gpt- on their own path.
      - {match: "gpt-oss*", passthrough: true}
      - {match: "gpt-*-codex*", to: coder}
      - {match: "codex-*", to: coder}
      - {match: "gpt-*-mini*", to: fast}
      - {match: "gpt-*-nano*", to: fast}
      - {match: "o*-mini*", to: fast}
      - {match: "gpt-3.5*", to: fast}
      - {match: "claude-*-haiku*", to: fast}
      - {match: "claude-haiku*", to: fast}
      - {match: "claude-*", to: default}
      - {match: "gpt-*", to: default}
      - {match: "chatgpt-*", to: default}
      - {match: "o1*", to: default}
      - {match: "o3*", to: default}
      - {match: "o4*", to: default}
      - {match: "computer-use-*", to: default}
      - {match: "davinci-002", to: default}
      - {match: "babbage-002", to: default}
  embeddings:
    stable:
      embed: nomic-embed-text-v1.5   # 768-dim; OpenAI text-embedding-3-* vectors are NOT compatible with it
    openai:
      - {match: "text-embedding-*", to: embed}
  images:
    stable:
      image: krea2-turbo           # default text-to-image
      image-fast: flux2-klein-4b   # Apache-licensed lighter fallback
      image-uncensored: krea2-turbo-snofs  # Krea 2 Turbo + SNOFS LoRA; explicit output for adults. Opt-in, never behind `image`
      image-anime: anima-turbo     # Anima Turbo anime (fast); also uncensored
    openai:
      - {match: "gpt-image-*", to: image}
      - {match: "chatgpt-image-*", to: image}
      - {match: "dall-e-*", to: image}
  image_edits:
    stable:
      image: qwen-image-2.1-edit         # alias of image-edit so one name works on both routes
      image-fast: flux2-klein-4b-edit
      image-edit: qwen-image-2.1-edit    # masks and 2+ images pick inpaint/multiref automatically
      image-edit-fast: flux2-klein-4b-edit
      image-identity: image-identity     # real people from reference photos into a new scene, with likeness scores
    openai:
      - {match: "gpt-image-*", to: image-edit}
      - {match: "chatgpt-image-*", to: image-edit}
      - {match: "dall-e-*", to: image-edit}
  videos:
    stable:
      video: video-ltx-2.5-t2v             # text-to-video; input_reference switches to image-to-video
      video-fast: video-ltx-2.5-t2v          # same graph as `video`; 960x512 default is the quick setting
      video-long: video-ltx-2.5-long
      video-remix: video-bernini-r-remix     # needs extensions.source_video; also what POST /v1/videos/{id}/remix runs
      character-replace: video-scail-2-replace  # needs extensions.source_video + reference_image
    openai:
      # Exact names are also mirrored into videos.aliases (media jobs read that
      # table); the glob catches dated snapshots on the main route.
      - {match: "sora-2", to: video}
      - {match: "sora-2-pro", to: video}
      - {match: "sora*", to: video}
  speech:
    # Engines are concrete backends. An engine is usable when its `service`
    # exists and is enabled in the service registry; `planned: true` engines are
    # listed for discovery only. Every engine id is also a valid `model`.
    # Engine data keys: streaming (answers with incremental PCM when asked),
    # native_sample_rate (Hz of that PCM; the gateway resamples to OpenAI's
    # 24 kHz), voice_map (OpenAI voice name -> the engine's voice), voices.
    engines:
      omnivoice:
        service: tts
        model: k2-fsa/OmniVoice
        voice_transform: voxtral-voices    # OpenAI voice names -> cloned fixed identities
        custom_voices: true                # accepts a user-created voice (voice_ref + ref_text)
        description: OmniVoice (Apache-2.0) cloned OpenAI voices; stable speaker identity; fallback behind Chatterbox
      chatterbox:
        service: tts-chatterbox
        model: chatterbox-turbo
        voice_transform: voxtral-voices    # OpenAI voice names -> the 13 reference clips the engine clones
        streaming: true                    # response_format=pcm streams one chunk per sentence group
        native_sample_rate: 24000
        custom_voices: true                # accepts a user-created voice (voice_ref = its stored clip)
        placement: "Python server on GPU0 (about 3.1 GB while loaded; weights unload after 10 min idle, process exits after 1 h), on-demand unit"
        default_voice: alloy
        voices: [alloy, ash, ballad, cedar, coral, echo, fable, marin, nova, onyx, sage, shimmer, verse]
        voice_map: {alloy: alloy, ash: ash, ballad: ballad, cedar: cedar, coral: coral, echo: echo, fable: fable, marin: marin, nova: nova, onyx: onyx, sage: sage, shimmer: shimmer, verse: verse}
        description: "Chatterbox Turbo (MIT): clones the 13 OpenAI voice names from fixed reference clips, first audio about 0.2 s streamed"
      supertonic:
        service: tts-supertonic
        model: supertonic
        streaming: true
        native_sample_rate: 44100
        placement: "audio.cpp on GPU0 (~0.7 GB while loaded; weights unload after 30 min idle), on-demand unit"
        default_voice: F1
        voices: [F1, F2, F3, F4, F5, M1, M2, M3, M4, M5]
        # Chosen by gender and measured pitch/brightness against OpenAI's voice descriptions
        # (see ~/.tmp/media-refresh/speech-tiers/REPORT.md). Preset voices only, no cloning.
        voice_map: {alloy: F1, marin: F1, coral: F3, nova: F2, sage: F5, shimmer: F4, ash: M3, echo: M4, ballad: M4, cedar: M2, fable: M1, verse: M1, onyx: M5}
        description: "Supertonic realtime engine (bake-off: 49 ms first audio)"
      kokoro:
        service: tts-kokoro
        model: kokoro
        streaming: true
        native_sample_rate: 24000
        placement: "Python server on GPU0 (~1.7 GB while running; exits after 10 min idle), on-demand unit"
        default_voice: af_heart
        voices: [af_alloy, af_aoede, af_bella, af_heart, af_jessica, af_kore, af_nicole, af_nova, af_river, af_sarah, af_sky, am_adam, am_echo, am_eric, am_fenrir, am_liam, am_michael, am_onyx, am_puck, am_santa, bf_alice, bf_emma, bf_isabella, bf_lily, bm_daniel, bm_fable, bm_george, bm_lewis]
        # Chosen by gender and measured pitch/brightness against OpenAI's voice descriptions
        # (see ~/.tmp/media-refresh/speech-tiers/REPORT.md). Preset voices only, no cloning.
        voice_map: {alloy: af_alloy, ash: am_michael, ballad: am_puck, cedar: am_adam, coral: af_sky, echo: am_echo, fable: bm_fable, marin: af_bella, nova: af_nova, onyx: am_onyx, sage: af_river, shimmer: af_heart, verse: am_liam}
        description: "Kokoro quality engine (bake-off: best quality balance, UTMOS 3.83, round-trip WER 3.1%)"
    stable:
      # Order is a policy decision: the first deployed engine wins.
      # Chatterbox Turbo is the default (Tim's blind listening test, 7/7) and OmniVoice is the fallback.
      tts: [chatterbox, omnivoice]
      tts-fast: [supertonic, chatterbox, omnivoice]
      tts-quality: [chatterbox, omnivoice, kokoro]
    openai:
      # tts-1 follows the default engine (Daisy sends tts-1 with voice shimmer).
      # Re-point it at tts-fast to make tts-1 the fast tier.
      - {match: "tts-1", to: tts}
      - {match: "tts-1-hd", to: tts-quality}
      - {match: "gpt-4o*-tts*", to: tts}
  transcriptions:
    engines:
      parakeet:
        service: stt
        model: parakeet-tdt-0.6b-v3
        description: NVIDIA Parakeet TDT 0.6B v3 (CPU service; long audio is chunked by the gateway)
      parakeet-gpu:
        service: stt-parakeet-gpu
        model: parakeet-tdt-0.6b-v3
        upload_format: wav16k      # audio.cpp reads only 16 kHz mono WAV; the gateway converts uploads
        placement: "audio.cpp on GPU0 (about 2.3-3.2 GB while loaded; weights unload after 5 min idle), on-demand unit"
        description: "Parakeet TDT 0.6B v3 q8 on GPU0 (same model as `parakeet`, no blanked spans: 5 min set WER 1.5% in 1.1 s vs 2.05% in 13.8 s on CPU)"
      nemotron-streaming:
        service: stt-nemotron
        model: nemotron-3.5-asr-streaming-0.6b          # served in offline mode: fastest final text
        stream_model: nemotron-3.5-asr-streaming-0.6b-stream  # same weights in streaming mode, used when stream=true
        streaming: true            # stream=true sends transcript.text.delta events while decoding
        upload_format: wav16k      # audio.cpp reads only 16 kHz mono WAV; the gateway converts uploads
        placement: "audio.cpp on GPU0 (~2.4 GB with both modes loaded; weights unload after 5 min idle), on-demand unit"
        description: "Nemotron streaming (bake-off: 194 ms end-of-speech to final)"
      canary:
        service: stt-canary
        model: canary-180m-flash
        upload_format: wav16k
        placement: "audio.cpp on GPU0 (~0.9 GB while loaded; weights unload after 5 min idle), on-demand unit"
        description: Canary 180M Flash (low VRAM, strong clean-speech WER)
      nemotron-diarize:
        service: stt-diarize
        model: nemotron-3-diarization
        streaming: true            # stream=true sends transcript.text.segment events as windows finish
        placement: "CPU only (about 1.5 GB RAM; exits after 15 min idle), on-demand unit; words come from the Parakeet service"
        description: "Nemotron 3 Diarization (speakers) + Parakeet TDT (word timestamps): gpt-4o-transcribe-diarize shape, diarized_json"
    stable:
      # Parakeet on GPU0 first (fast, on demand). The gateway tries the next engine when the first cannot
      # serve a request (will not start, connection refused, 503, or an allocation/OOM error: GPU0 full), and
      # answers with `x-azizam-fallback`. A 4xx never falls back, and an engine id by name never does.
      stt: [parakeet-gpu, parakeet]
      stt-fast: [nemotron-streaming, parakeet]
      stt-quality: [parakeet-gpu, parakeet, canary]
      # Diarization has no fallback: a plain-text engine would silently drop the speakers.
      stt-diarize: [nemotron-diarize]
    openai:
      - {match: "*transcribe-diarize*", to: stt-diarize}
      - {match: "whisper*", to: stt}
      - {match: "parakeet-*", to: stt}   # e.g. OpenWhispr sends parakeet-tdt-0.6b; the engine ids `parakeet` and `parakeet-gpu` match first
      - {match: "gpt-4o-mini-transcribe*", to: stt-fast}
      - {match: "gpt-4o*transcribe*", to: stt-quality}
      - {match: "*transcribe*", to: stt}
  decisions:
    engines:
      decider-2b:
        service: decisions
        model: decider-2b-v11
        placement: cpu
        residency: on_demand
        description: "Local fast decisions"
        max_state_tokens: 4096
        context_tokens: 4096
        max_options: 255
        max_levels: 10
        calibrated: true
      decider-4b:
        service: decisions-quality
        model: decider-4b-v2.1
        placement: cpu
        residency: on_demand
        description: "Local quality decisions"
        max_state_tokens: 4096
        context_tokens: 4096
        max_options: 255
        max_levels: 10
        calibrated: true
    stable:
      decide: [decider-2b]
      decide-quality: [decider-4b, decider-2b]
    openai:
      - {match: "jev-*", to: decide}
      - {match: "*/*", passthrough: true}
  rerank:
    engines:
      qwen3-reranker-0.6b:
        service: rerank
        model: qwen3-reranker-0.6b
        max_documents: 1000
        max_document_chars: 10000   # about 3000 tokens: query plus document must fit the 4096-token engine context
        placement: "CPU only (1 GB RAM while running; exits after 10 min idle), on-demand unit"
        description: "Qwen3-Reranker-0.6B on CPU"
    stable:
      rerank: [qwen3-reranker-0.6b]
    openai:
      # Cohere (rerank-v3.5, rerank-english-v3.0), Jina (jina-reranker-v2-base-multilingual), Voyage (rerank-2)
      # and any other *rerank* name that a RAG client sends all reach the one engine.
      - {match: "*rerank*", to: rerank}
  audio_generate:
    stable:
      music: ace-step-1.5-xl-turbo   # instrumental/short music, fastest
      song: yue2-song                # full song with vocals from tags + lyrics
      sfx: sa3-small-sfx             # sound effects and ambience
# User-created voices (POST /v1/audio/voices). Stored per API key under `dir`
# (relative to this file). See docs/LOCAL_CLIENT_RECIPES.md, "Custom voices".
voices:
  dir: data/voices
  consent_mode: optional      # optional: accept and check a consent id if given; required: reject without one
  max_voices_per_key: 20      # OpenAI's limit is 20 per organization
  max_consents_per_key: 50
  max_bytes_per_key: 209715200
  max_upload_bytes: 10485760  # sample and consent recording, as OpenAI
  min_seconds: 5
  max_seconds: 60
  min_speech_seconds: 3.5
  target_seconds: 12          # the stored reference clip is the best window of about this length
  quality_engine: chatterbox  # makes the post-creation speaker-similarity probe
  quality_warn_below: 0.45    # ECAPA cosine; the 13 built-in voices score 0.64-0.79
  design_engine: omnivoice    # renders `type: prompt` voices once from a text description
model_compatibility:
  enabled: true
  generated_aliases_file: openai_model_aliases.generated.yml
  openai_models_api_url: https://api.openai.com/v1/models
  include_private: false
  defaults:
    chat: ""
    completions: ""
    speech: k2-fsa/OmniVoice
    transcriptions: parakeet-tdt-0.6b-v3
    embeddings: nomic-embed-text-v1.5
    images: krea2-turbo
    image_edits: qwen-image-2.1-edit
  aliases:
    nomic-embed-text-v1.5:
      category: embeddings
    nomic-embed-text-v1.5.f16.gguf:
      category: embeddings
auth:
  enabled: true
  public_paths:
    - /health
  api_key_env: TABBY_API_KEY
  admin_key_env: TABBY_ADMIN_KEY
  # Set to true to allow unauthenticated access to Ollama read-only discovery
  # routes (/api/tags, /api/version and their /ollama/api/* aliases).
  # Matches how a local Ollama daemon behaves so Open WebUI / LM Studio can
  # auto-discover models without bearer token wiring.
  # Default: false — keep off on internet-facing gateways.
  # Env override: OLLAMA_COMPAT_DISCOVERY=true
  ollama_compat_discovery: false

  # ---- Optional frictionless-auth features (all OFF by default) -------------
  # With every option below left at its default, auth is unchanged: a valid
  # Authorization: Bearer / x-api-key is required on every non-public route.
  #
  # 1) LAN / localhost bypass — clients whose REAL IP is in lan_bypass_cidrs skip
  #    the API key. The public URL still requires it. Real IP defaults to the raw
  #    TCP socket peer; X-Forwarded-For is honored ONLY from proxies you list in
  #    trusted_proxies (rightmost-first, spoof-resistant).
  #      lan_bypass_enabled: true
  #      lan_bypass_cidrs: ["127.0.0.0/8", "::1/128", "192.168.0.0/16", "10.0.0.0/8", "100.64.0.0/10"]
  #      trusted_proxies: ["127.0.0.1"]      # your reverse proxy's IP/CIDR; empty = no proxy
  #    Env overrides: AZIZAM_LAN_BYPASS=true
  lan_bypass_enabled: true
  lan_bypass_cidrs: ["127.0.0.0/8", "::1/128", "192.168.0.0/16", "10.0.0.0/8", "100.64.0.0/10"]
  trusted_proxies: ["192.168.1.4"]
  #
  # Cloudflare Tunnel: honor CF-Connecting-IP, but ONLY when the connection comes
  # from a verified Cloudflare edge IP (ranges fetched at startup; fail-closed).
  #   Env override: AZIZAM_CF_MODE=true
  cloudflare_mode: false
  #
  # 2) Query-param key — for clients with no auth-header field (e.g. dictation
  #    apps): accept ?api_key=<key>. Note: appears in some logs; redact upstream.
  #    Env override: AZIZAM_QUERY_PARAM_KEY=true
  allow_query_param_key: false
  #
  # 3) Per-device path tokens — the URL path IS the credential, e.g. base URL
  #    https://host/tok_livingroom/v1 . Each token is independently revocable.
  #      path_tokens:
  #        tok_livingroom: living-room-speaker
  #        tok_workshop: workshop-pi
  path_tokens: {}
admin:
  db_path: data/admin.db
  # Deployment brand (data, not product code). A generic install shows only the
  # neutral product label; this deployment opts into the vivid.fish wordmark.
  brand:
    product: Azizam
    wordmark: vivid.fish
