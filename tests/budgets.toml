# scripts/config_import_reads.py; docs/design/CONFIG_HOMES.md 1.2). 97 on 2026-11-05, after the review fix of the scan:
# a lambda or def body is pruned (it does not run at import), and class bodies, defaults, decorators, calls through
# runtime()/CONFIG_HOME, containers filled by .update, walrus and loop targets and calls handed a root are counted.
# The corrected scan measures proxy.py before C0 at 97 as well, so C1 moved no real import-time read: DECISION_RUNTIME
# and MESH_DEPS read the config inside a lambda, which was never an import-time read. Each section slice moves its readers to the runtime
# snapshot and lowers its key; a key whose count reaches zero stays at 0 (scripts/ci/policy.py refuses a removed ratchet).
# 94 on 2026-11-06 (C6): the instance, media admission and service availability settings moved into the config layer, so the
# "gateway" key (GATEWAY_CFG, RESOURCE_ADMISSION_CFG, MEDIA_JOB_ADMISSION_CFG) reached zero.
# C3 (aliases) lowered videos 8 to 7 (VIDEO_ALIASES) and audio 5 to 4 (AUDIO_ALIASES): both tables are derived from the
# effective config by _workflow_alias_tables and republished at every reload. They are counted under the section their
# source statement read, so there is no model_aliases key to lower.
