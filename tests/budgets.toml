# Count ceilings enforced by scripts/ci/policy.py (docs/design/TEST_STRATEGY.md 6).
# Units: pytest collected items (each parameter set counts; subtests do not);
# vitest test cases; Playwright test x project over the gate configs
# (playwright.config.ts, .live-data, .household). Retries never count.
# Set at the counts measured on 2026-10-12 at origin/main 945a0cec
# with this slice merged. Only a slice that must add cases
# raises a ceiling, in the same PR and with its reason; S14 lowers them.

# VT (browser display-state cases moved to vitest, plus VT-FIX oracle restorations):
# Playwright 759 -> 425 (-334: moved or collapsed, with 4 browser representatives restored:
# multipart wire contract, signed media load failure, 1440 px long instance name,
# post-search model grouping geometry); vitest +165 (1708 -> 1873). Counted with
# ~/.tmp/vt-tools/counts.sh at b03f1053 + VT + VT-FIX.

# Slice S13 (orphaned e2e files): +25 vitest and +24 Playwright cases that carry
# the orphans' assertions into gated suites; node:test cases are new, from
# probe-gates.test.mjs in the compat-node step. Measured at 0bff0431 + S13.
[ceilings]
pytest = 8481  # +2: HYG-G2 (policy self-tests: a raw route.fulfill and a malformed stub each fail the hygiene check). +46: FK-NEXT (the four held azgap files on FK: 33; speech and OOM/RMBG wire faults: 9; FK self-tests: 2; video workflow upload-failure and OOM: 2). +12: BX (ci-local browser-section and policy hygiene/fixture self-tests); +164: the azgap coverage-gap batch (15 new files, with the held-back four excluded); +24: ORPH (test-scheduled decisions, scheduled/live tier policy self-tests; -1 always-skipped showcase wrapper); +6: Connect page (release 23); +11: fix/home-latency (test_event_loop_guard 7 endpoints, test_home_latency 4)
vitest = 1894  # +11: HYG-G2 (tests/lib/intercept-shape.spec.ts, the structure check behind fulfilJson). +1: BX (test-priority case for the isolation-proof config); +165: VT moves from the browser. Before that, +67: azgap web specs (16 files incl. 2 cases in try/page.spec). Prior note: +10: web/tests/test-priority.spec.ts (self-renice of the test runners, lead2)
playwright = 426

# Slice ORPH (zero orphans): +98 node:test cases that now run in the gate's
