# Browser hygiene (TEST_STRATEGY.md 3.4 rules 1-3, and 3.4's intercept rule):
# occurrences in Playwright code under web/e2e and *.e2e.* / *.playwright.*
# files under web/src. The first six were 18, 9, 4, 1, 3, 0 and are 0 since HYG-G2:
# 16 of the 18 timers and 8 of the 9 networkidle were in manual capture scripts
# (web/e2e/*capture*.mjs, d1-*.mjs), which now wait on observable state
# (e2e/capture-settle.mjs); the other 2 and 1 were in the sweep; all 4 force: true
# were fs.rm flags, not click forces; the one-shot expect and 2 of the 3 bare
# isVisible were in specs, the third in d1-task-flows.mjs.
# raw_fulfil counts .fulfill( in TypeScript outside web/e2e/fixtures/intercept.ts:
# every stub goes through fulfilJson or fulfilBytes. malformed_stub counts the JSON
# stubs that say, with a reason, they are deliberately unlike the gateway.
# unprobed_endpoint counts the endpoints of web/e2e/fixtures/intercept-registry.ts that
# have no structural oracle (no read probe, and no call on the oracle gateway of
# e2e/fixtures/oracle.ts). It was 33; G2-FIN gave 32 an oracle and moved the last one
# (POST /gateway/v1/workflows/{id}/run answers with bytes) to a component test.
[hygiene]
waitForTimeout = 0
networkidle = 0
force_true = 0
one_shot_expect = 0
bare_isVisible = 0
absolute_home_path = 0
raw_fulfil = 0
malformed_stub = 0
unprobed_endpoint = 0
