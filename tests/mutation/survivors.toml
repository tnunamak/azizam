# Survivors of scripts/mutate on the core modules (tests/mutation/modules.toml), classified.
# class: killable (a test can kill it), equivalent (no observable difference), unproductive (not worth a test).
# A killable entry with killed_by was killed by a manual mutant run because the harness cannot see the line.
# Every entry is a mutant that survived scripts/mutate on the committed tree; a mutant that a test kills has no entry.

[[mutant]]
id = "gateway/category_enforcement.py:64:bool-const:False->True"
class = "equivalent"
reason = "The first call cannot see the initial flag. category_enforcement.py:92 compares the int from PRAGMA data_version with the initial None, so the cached-return test fails before `_failed` is read. At :95 `counter != self._counter` compares an int with the initial None and is already true. A successful load resets the flag at :105."

