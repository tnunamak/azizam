reason = "The TypeVar name is read only by typing introspection (T.__name__, repr). T is used only as a type parameter at category_policy.py:23-31 and :536-546; no code or test inspects its name, and Generic[T] behaves the same under any name. Pinning it would assert a string, not behaviour."

