[[mutant]]
id = "gateway/transforms.py:885:bool:and->or"
class = "killable"
reason = "Differs from the current code only when a close tag comes before an opener in one frame, where the current output is wrong (\"r</think><think>x</think>v\" gives visible \"r</think>v\", reasoning \"x\"). Killed by tests on fix/think-stray-tags (05b404ea) once released; a test here would pin the bug."

[[mutant]]
id = "gateway/transforms.py:885:cmp:<-><="
class = "equivalent"
reason = "Equivalent while the gate `idx < 0 and not in_think` holds. Here `tag` is the opener and idx its find(). `idx <= 0` adds only idx == 0 (text starts with the opener). The inner test at :888 then needs a close tag before position 0 or no opener, and an opener sits at 0, so it is false and the loop goes on as before. fix/think-stray-tags removes the gate; the mutant is then live and its tests kill it."

[[mutant]]
id = "gateway/transforms.py:885:int-const:0->1"
class = "equivalent"
reason = "Equivalent while the gate `idx < 0 and not in_think` holds. `idx < 1` adds only idx == 0 (text starts with the opener), where the inner test at :888 is false: no close tag can sit before position 0, and the opener is present. fix/think-stray-tags removes the gate; the mutant is then live and its tests kill it."

[[mutant]]
id = "gateway/transforms.py:888:cmp:<-><="
class = "equivalent"
reason = "Equivalent under the gate at :885: not in_think and idx < 0 mean find(opener) == -1, so `find(opener) < 0` and `<= 0` are both true."

[[mutant]]
id = "gateway/transforms.py:888:cmp:<-><=#2"
class = "equivalent"
reason = "Dead operand under the gate at :885: find(opener) == -1 makes `find(opener) < 0` true, so the `or` short-circuits and `idx_close < find(opener)` is never evaluated."

[[mutant]]
id = "gateway/transforms.py:888:int-const:0->1#2"
class = "equivalent"
reason = "Equivalent under the gate at :885: find(opener) == -1, so `find(opener) < 0` and `< 1` are both true."

[[mutant]]
id = "gateway/transforms.py:979:str-const:\"\"->\"XXXX\""
class = "killable"
reason = "The else branch is reached only by a data line that ends in a lone CR (or another str.splitlines separator). The current code then drops the terminator and glues the next line onto the data line (verified: b'data: {...}\\r:ping\\n' gives b'data: {...}:ping\\n'), and process_chunk carries unfinished lines at LF only (:956-:962). A test would pin that corruption. The fix needs a CR-aware reader, not a minimal change: open finding in lanes/mut4-REPORT.md."
