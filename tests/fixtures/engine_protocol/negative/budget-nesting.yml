protocol_version: 1
id: budget-nesting
executor: http-v1
operations:
  chat:
    class: generate
    request:
      method: POST
      path: /c
      body:
        encoding: json
        base: empty
        map:
          - when:
              if: {path: /body/a, present: true}
              then:
                - when:
                    if: {path: /body/a, present: true}
                    then:
                      - when:
                          if: {path: /body/a, present: true}
                          then:
                            - when:
                                if: {path: /body/a, present: true}
                                then:
                                  - set: {to: /x, value: 1}
