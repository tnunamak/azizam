schema_version: 1
min_gateway_version: '0.1'
version: 0.1.0
id: mesh.edit.uv-unwrap
intent: mesh.edit
capability: mesh
display_name: Unwrap the UVs of a 3D model
purpose: Unwrap the UVs of a 3D model
description: Unwraps and packs the texture coordinates of a 3D model and returns it as a binary glTF.
technical_description: Fixed 3D stage bound to the local3d-stages service over one multipart POST. The service returns raw GLB bytes.
summary: Send a model; receive the same model with fresh texture coordinates (model/gltf-binary).
source: local
trusted: true
inputs:
  mesh:
    label: model
    help: The 3D model to work on, as a binary glTF (.glb) file.
    type: asset
    required: true
    media_type: model/gltf-binary
outputs:
  mesh:
    modality: mesh
    media_type: model/gltf-binary
bindings:
  local3d-stages:
    transport:
      kind: http-multipart
      path: /uv
    map:
      mesh: mesh
