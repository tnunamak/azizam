# What the gate does not run, each entry checked by scripts/ci/policy.py
# (docs/design/TEST_STRATEGY.md 3.2, 6, 7 T0.4). An entry that no longer
# matches the run (the file now runs, the case no longer skips) fails the
# policy too, so these lists only shrink. Measured on 2026-10-12 (seed 4242).

# Test files that no gate step runs. Each needs an expires_on; after it the
# gate fails until the file runs in a gate step or is deleted. None are left;
# a new test file that no tier runs fails the policy until it is wired in or
# listed below.

# Files that `scripts/test-scheduled` runs instead of the gate (TEST_STRATEGY.md
# 1.3). `task` is a task that script knows (scripts/ci/policy.py SCHEDULED_TASKS).
# test-scheduled reads these entries to decide what to run, and a nightly that
# records no case for a listed file is INCOMPLETE, never green.
[[scheduled]]
path = "tests/compat/node/anthropic.test.mjs"
task = "sdk-probes"
reason = "Node SDK compatibility probe; needs a running gateway, so the nightly runs it on a disposable 18xxx instance over the fake upstream"

[[scheduled]]
path = "tests/compat/node/ollama.test.mjs"
task = "sdk-probes"
reason = "Node SDK compatibility probe; needs a running gateway, so the nightly runs it on a disposable 18xxx instance over the fake upstream"

[[scheduled]]
path = "tests/compat/node/openai.test.mjs"
task = "sdk-probes"
reason = "Node SDK compatibility probe; needs a running gateway, so the nightly runs it on a disposable 18xxx instance over the fake upstream"

[[scheduled]]
path = "tests/compat/node/vercel-ai-sdk.test.mjs"
task = "sdk-probes"
reason = "Node SDK compatibility probe; needs a running gateway, so the nightly runs it on a disposable 18xxx instance over the fake upstream"

[[scheduled]]
path = "web/e2e/sweep/sweep.spec.ts"
task = "sweep"
reason = "Quality sweep over every route, state, width and theme; playwright.sweep.config.ts runs it, too slow for the gate"

# Files that need real upstreams or real credentials: never in the gate or the
# scheduled tier (TEST_STRATEGY.md 1.4). They skip unless their env opt-in is set.
[[live]]
path = "integrations/pi/test/live.test.ts"
reason = "smoke test against a real gateway and a real key (AZIZAM_LIVE_TEST=1); every other Pi test runs in the gate"


